<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Rush</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #2e3440;
      color: #eceff4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
    }
    h1 { margin: 0; font-size: 1.4rem; }
    #hud {
      display: flex;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }
    #stage { position: relative; max-width: 100%; }
    #game {
      display: block;
      border: 3px solid #4c566a;
      border-radius: 6px;
      max-width: 100%;
      touch-action: manipulation;
    }
    #level-select {
      position: absolute;
      inset: 0;
      background: rgba(20, 24, 32, 0.9);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
    }
    #level-select h2 { margin: 0 0 6px; font-size: 1.3rem; }
    #level-list { display: flex; flex-direction: column; gap: 8px; width: min(420px, 100%); }
    .level-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-align: left;
      width: 100%;
      padding: 10px 14px;
    }
    .level-btn small { opacity: 0.8; font-weight: normal; }
    .level-btn:disabled { opacity: 0.5; }
    #controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      background: #5e81ac;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled { background: #4c566a; color: #9aa3b2; cursor: default; }
    #sell-tower { background: #bf616a; }
    #upgrade-tower { background: #a3be8c; color: #1f2430; }
    #tower-info { font-size: 0.9rem; opacity: 0.9; min-height: 1.2em; }
    #status { min-height: 1.4em; font-style: italic; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Tower Rush</h1>
  <div id="hud">
    <span id="level-name"></span>
    <span>💰 Gold: <strong id="gold">0</strong></span>
    <span>❤️ Lives: <strong id="lives">0</strong></span>
    <span>🌊 Wave: <strong id="wave">0 / 0</strong></span>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="level-select">
      <h2>Choose a level</h2>
      <div id="level-list"></div>
    </div>
  </div>
  <div id="controls">
    <button id="start-wave">Start Wave</button>
    <span id="tower-menu" hidden>
      <button id="upgrade-tower">Upgrade</button>
      <button id="sell-tower">Sell</button>
    </span>
    <button id="next-level" hidden>Next Level</button>
    <button id="restart" hidden>Play Again</button>
    <button id="choose-level">Levels</button>
  </div>
  <div id="tower-info"></div>
  <div id="status"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
