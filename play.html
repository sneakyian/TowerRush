        g.addColorStop(0.4, p.color);
        g.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.globalAlpha = Math.min(0.85, frac * 1.1);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'glow': {
        const r = p.size * (0.8 + (1 - frac) * (p.grow || 1) * 0.5);
        glowDisc(ctx, p.x, p.y, r, p.color);
        break;
      }
      case 'flake': {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.6, p.size * 0.35);
        ctx.lineCap = 'round';
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sz = p.size * (0.6 + frac * 0.4) * 1.8;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const a = (k / 3) * Math.PI;
          ctx.moveTo(Math.cos(a) * sz, Math.sin(a) * sz);
          ctx.lineTo(-Math.cos(a) * sz, -Math.sin(a) * sz);
          // Side barbs.
          for (const s of [-1, 1]) {
            const bxp = Math.cos(a) * sz * 0.55 * s;
            const byp = Math.sin(a) * sz * 0.55 * s;
            ctx.moveTo(bxp, byp);
            ctx.lineTo(bxp + Math.cos(a + 0.9 * s) * sz * 0.3, byp + Math.sin(a + 0.9 * s) * sz * 0.3);
          }
        }
        ctx.stroke();
        ctx.restore();
        break;
      }
      case 'bolt': {
        // Short crackling arc that re-jitters every frame.
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.6, p.size * frac);
        ctx.lineCap = 'round';
        const ex = p.x + Math.cos(p.rot) * p.size * 5;
        const ey = p.y + Math.sin(p.rot) * p.size * 5;
        jaggedPath(ctx, p.x, p.y, ex, ey, 4, p.size * 3);
        break;
      }
      case 'bubble':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.7 + (1 - frac) * 0.6), 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.22, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'casing': {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.9);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fillRect(-p.size, -p.size * 0.45, p.size * 2, p.size * 0.3);
        ctx.restore();
        break;
      }
      case 'splinter': {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.7, p.size * 0.5);
        ctx.lineCap = 'round';
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.moveTo(-p.size * 1.6, 0);
        ctx.lineTo(p.size * 1.6, 0);
        ctx.stroke();
        ctx.restore();
        break;
      }
      case 'smoke':
        ctx.globalAlpha = frac * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (1 - frac) * (p.grow || 1) * 0.8), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'spark': {
        const speed = Math.hypot(p.vx, p.vy) || 1;
        const len = Math.min(16, 3 + speed * 0.05);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.6, p.size * frac);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - (p.vx / speed) * len, p.y - (p.vy / speed) * len);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        break;
      }
      case 'ember':
        ctx.fillStyle = p.color;
        ctx.globalAlpha = frac * 0.35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = frac;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + frac * 0.5), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'shard': {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sz = p.size * (0.6 + frac * 0.4);
        ctx.beginPath();
        ctx.moveTo(0, -sz);
        ctx.lineTo(sz * 0.9, sz * 0.7);
        ctx.lineTo(-sz * 0.9, sz * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'star': {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sz = p.size * (0.5 + frac * 0.5) * 1.6;
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const rad = k % 2 ? sz * 0.4 : sz;
          const a = (k / 8) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'drop':
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'tracer':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * frac * 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        break;
      case 'scorch':
      case 'crater':
        ctx.globalAlpha = Math.min(0.8, frac * 1.5);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        if (p.shape === 'crater') {
          ctx.strokeStyle = 'rgba(0,0,0,0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 0.38, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        break;
      case 'frostpatch':
      case 'puddle':
        ctx.globalAlpha = Math.min(0.9, frac * 1.3);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'leaf':
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      case 'snow':
      case 'ash':
      case 'pollen':
        ctx.globalAlpha = Math.min(1, frac * 3) * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'sand':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x - 14, p.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        break;
      case 'firefly': {
        const blink = 0.3 + Math.max(0, Math.sin(p.rot * 0.5 + p.x * 0.05 + p.life * 6)) * 0.7;
        ctx.globalAlpha = Math.min(1, frac * 3) * blink;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = Math.min(1, frac * 3);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      default:
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * frac, 0, Math.PI * 2);
        ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawTexts(ctx, effects) {
  ctx.textAlign = 'center';
  for (const t of effects.texts) {
    ctx.font = `bold ${Math.round(13 * (t.scale || 1))}px sans-serif`;
    ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

const ELEMENT_COLORS = {
  fire: [255, 120, 40],
  ice: [143, 211, 255],
  poison: [143, 211, 58],
  storm: [126, 200, 255],
  arcane: [185, 167, 255],
};

function drawEnemyTraits(ctx, enemy, x, y, pos, r, time) {
  // Elemental aura: a tinted ring at the feet with two orbiting motes.
  if (enemy.element && ELEMENT_COLORS[enemy.element]) {
    const [cr, cg, cb] = ELEMENT_COLORS[enemy.element];
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.45 + Math.sin(time * 4 + enemy.id) * 0.15})`;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(pos.x, pos.y + r * 0.55, r * 1.15, r * 0.45, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(${cr},${cg},${cb},0.9)`;
    for (let m = 0; m < 2; m++) {
      const a = time * 3 + enemy.id + m * Math.PI;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * r * 1.3, y + Math.sin(a) * r * 0.5, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // Regeneration: green pulse while knitting back together.
  if (enemy.regen > 0 && enemy.hp < enemy.maxHp && !enemy.burn && !enemy.poison) {
    const pulse = (time * 1.2 + enemy.id * 0.3) % 1;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(120,255,140,${0.6 * (1 - pulse)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r * (0.6 + pulse * 0.7), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  // Energy shield: faceted bubble that cracks as it drains, flickers while recharging.
  if (enemy.shield) {
    const frac = enemy.shield.hp / enemy.shield.max;
    const sr = r * 1.4;
    if (frac > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(x, y, sr * 0.6, x, y, sr);
      g.addColorStop(0, `rgba(126,200,255,${0.05 * frac})`);
      g.addColorStop(1, `rgba(126,200,255,${0.35 * frac})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, sr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(200,240,255,${0.35 + frac * 0.4})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = time * 0.8 + (k / 6) * Math.PI * 2;
        ctx.lineTo(x + Math.cos(a) * sr, y + Math.sin(a) * sr);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.ellipse(x - sr * 0.4, y - sr * 0.45, sr * 0.25, sr * 0.12, -0.6, 0, Math.PI * 2);
      ctx.fill();
      if (frac < 0.5) {
        ctx.strokeStyle = `rgba(255,255,255,${0.8 - frac})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(x + sr * 0.2, y - sr * 0.9);
        ctx.lineTo(x + sr * 0.45, y - sr * 0.4);
        ctx.lineTo(x + sr * 0.25, y - sr * 0.1);
        ctx.moveTo(x - sr * 0.6, y + sr * 0.3);
        ctx.lineTo(x - sr * 0.3, y + sr * 0.5);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    } else if (enemy.shield.sinceHit >= 3) {
      // Down but about to come back: a faint flicker.
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(126,200,255,${0.2 + Math.sin(time * 25) * 0.15})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.arc(x, y, sr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  // Enraged: pulsing red aura with jagged rays.
  if (enemy.enraged) {
    ctx.globalCompositeOperation = 'lighter';
    glowDisc(ctx, x, y, r * 1.8, `rgba(255,60,40,${0.3 + Math.sin(time * 12) * 0.12})`);
    ctx.strokeStyle = 'rgba(255,90,60,0.8)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 6; k++) {
      const a = time * 2 + (k / 6) * Math.PI * 2;
      const len = r * (1.5 + Math.sin(time * 15 + k) * 0.3);
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r * 1.1, y + Math.sin(a) * r * 1.1);
      ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawBossBar(ctx, game) {
  const boss = game.boss;
  if (!boss) return;
  const type = game.enemyTypes[boss.typeId];
  const w = 320;
  const x = (game.level.width - w) / 2;
  const y = 14;
  const frac = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x - 2, y - 2, w + 4, 16);
  ctx.fillStyle = '#4a1010';
  ctx.fillRect(x, y, w, 12);
  ctx.fillStyle = boss.enraged ? '#ff3b2f' : frac > 0.5 ? '#d64545' : '#ff7a45';
  ctx.fillRect(x, y, w * frac, 12);
  // Phase markers for summons and rage thresholds.
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  if (type.summons) ctx.fillRect(x + w * type.summons.at - 0.5, y, 1, 12);
  if (type.enrage) ctx.fillRect(x + w * 0.3 - 0.5, y, 1, 12);
  if (boss.shield) {
    const sf = boss.shield.hp / boss.shield.max;
    ctx.fillStyle = 'rgba(30,60,90,0.9)';
    ctx.fillRect(x, y - 6, w, 4);
    ctx.fillStyle = '#7ec8ff';
    ctx.fillRect(x, y - 6, w * sf, 4);
  }
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  const title = boss.enraged ? `${type.name} — ENRAGED` : type.name;
  ctx.strokeText(title, game.level.width / 2, y + 10);
  ctx.fillText(title, game.level.width / 2, y + 10);
  const traits = describeTraits(type).join('  ·  ');
  if (traits) {
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#ffd98a';
    ctx.lineWidth = 2.5;
    ctx.strokeText(traits, game.level.width / 2, y + 26);
    ctx.fillText(traits, game.level.width / 2, y + 26);
  }
}

function drawBanner(ctx, effects, level) {
  const banner = effects.banner;
  if (!banner) return;
  const age = banner.maxLife - banner.life;
  const alpha = Math.min(1, age * 4, banner.life * 2);
  const pop = age < 0.3 ? 1.25 - 0.25 * (age / 0.3) : 1; // settles in from slightly large
  const cx = level.width / 2;
  const cy = level.height / 2 - 40;
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pop, pop);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Georgia, serif';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = banner.color;
  ctx.globalAlpha = Math.max(0, alpha) * 0.35;
  ctx.fillText(banner.text, 0, 2); // glow pass
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = 7;
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillStyle = banner.color;
  ctx.fillText(banner.text, 0, 0);
  if (banner.sub) {
    ctx.font = 'italic 16px Georgia, serif';
    ctx.lineWidth = 4;
    ctx.strokeText(banner.sub, 0, 24);
    ctx.fillStyle = '#f2e3b3';
    ctx.fillText(banner.sub, 0, 24);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawRange(ctx, spot, range) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.beginPath();
  ctx.arc(spot.x, spot.y, range, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.lineDashOffset = -performance.now() / 40;
  ctx.stroke();
  ctx.setLineDash([]);
}

// Browser entry point: wires the Game to the canvas and the HUD, handles
// level selection and saved progress.


const PROGRESS_KEY = 'towerrush-progress';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// The world is 800x480 logical units, but the canvas fills the stage (up to
// 1280 CSS px) and its backing store is sized at display size x device pixel
// ratio. Everything is vector-drawn through one scale transform, so a bigger
// or sharper screen simply gets more resolution.
const MAX_BACKING_WIDTH = 2800; // keeps the backing store sane on huge HiDPI screens
const stageEl = document.getElementById('stage');

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const { width, height } = game.level;
  const cssWidth = Math.max(320, stageEl.clientWidth || width);
  const cssHeight = (cssWidth * height) / width;
  const scale = Math.min((cssWidth / width) * dpr, MAX_BACKING_WIDTH / width);
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  canvas.style.aspectRatio = `${width} / ${height}`;
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return { cssWidth, cssHeight };
}

let levelIndex = 0;
let game = new Game(LEVELS[0]);
fitCanvas();
window.addEventListener('resize', fitCanvas);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => fitCanvas()).observe(stageEl);
const effects = new Effects();
const ui = { selectedSpot: -1 };

// --- Saved progress (best effort; storage may be unavailable) -----------

function loadUnlocked() {
  try {
    const n = Number(localStorage.getItem(PROGRESS_KEY));
    return Number.isFinite(n) ? Math.min(Math.max(n, 0), LEVELS.length - 1) : 0;
  } catch {
    return 0;
  }
}

function saveUnlocked(n) {
  try {
    localStorage.setItem(PROGRESS_KEY, String(Math.max(n, loadUnlocked())));
  } catch {
    /* storage unavailable: progress just isn't remembered */
  }
}

// --- HUD elements -------------------------------------------------------

const levelNameEl = document.getElementById('level-name');
const goldEl = document.getElementById('gold');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');
const statusEl = document.getElementById('status');
const towerInfoEl = document.getElementById('tower-info');
const startWaveBtn = document.getElementById('start-wave');
const nextLevelBtn = document.getElementById('next-level');
const restartBtn = document.getElementById('restart');
const chooseLevelBtn = document.getElementById('choose-level');
const towerMenu = document.getElementById('tower-menu');
const upgradeBtn = document.getElementById('upgrade-tower');
const sellBtn = document.getElementById('sell-tower');
const levelSelect = document.getElementById('level-select');
const levelList = document.getElementById('level-list');

for (const type of Object.values(TOWER_TYPES)) {
  const btn = document.createElement('button');
  btn.dataset.type = type.id;
  btn.innerHTML = `<span class="tower-name">${type.name}</span><span class="tower-cost">${type.levels[0].cost}g</span>`;
  btn.title = type.desc;
  btn.style.setProperty('--tower', type.color);
  // Light tower colors need dark text.
  const n = parseInt(type.color.slice(1), 16);
  const luma = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  btn.style.setProperty('--tower-fg', luma > 150 ? '#1b1f2a' : '#ffffff');
  btn.addEventListener('click', () => {
    if (ui.selectedSpot < 0) return;
    const result = game.buildTower(ui.selectedSpot, type.id);
    if (!result.ok && result.reason === 'not-enough-gold') flashStatus('Not enough gold!');
    updateHud();
  });
  towerMenu.insertBefore(btn, upgradeBtn);
}

upgradeBtn.addEventListener('click', () => {
  if (ui.selectedSpot < 0) return;
  const result = game.upgradeTower(ui.selectedSpot);
  if (!result.ok && result.reason === 'not-enough-gold') flashStatus('Not enough gold!');
  updateHud();
});

sellBtn.addEventListener('click', () => {
  if (ui.selectedSpot >= 0) game.sellTower(ui.selectedSpot);
  ui.selectedSpot = -1;
  updateHud();
});

startWaveBtn.addEventListener('click', () => {
  game.startNextWave();
  updateHud();
});

restartBtn.addEventListener('click', () => loadLevel(levelIndex));
nextLevelBtn.addEventListener('click', () => loadLevel(levelIndex + 1));
chooseLevelBtn.addEventListener('click', () => showLevelSelect());

canvas.addEventListener('click', (event) => {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * (game.level.width / rect.width);
  const y = (event.clientY - rect.top) * (game.level.height / rect.height);

  ui.selectedSpot = -1;
  game.level.buildSpots.forEach((spot, i) => {
    if (Math.hypot(spot.x - x, spot.y - y) <= 22) ui.selectedSpot = i;
  });
  updateHud();
});

// --- Level flow -----------------------------------------------------------

function loadLevel(index) {
  levelIndex = Math.min(Math.max(index, 0), LEVELS.length - 1);
  game = new Game(LEVELS[levelIndex]);
  fitCanvas();
  effects.clear();
  ui.selectedSpot = -1;
  levelSelect.hidden = true;
  updateHud();
}

function showLevelSelect() {
  const unlocked = loadUnlocked();
  levelList.replaceChildren();
  LEVELS.forEach((level, i) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.disabled = i > unlocked;
    btn.innerHTML = `<span><strong>${i + 1}. ${level.name}</strong><br><small>${level.subtitle}</small></span><span>${i > unlocked ? '🔒' : `${level.waves.length} waves`}</span>`;
    btn.addEventListener('click', () => loadLevel(i));
    levelList.appendChild(btn);
  });
  levelSelect.hidden = false;
}

// One line of stats for the tower info panel, per attack style.
function describeStats(type, stats) {
  const parts = [];
  if (type.attack === 'aura') {
    parts.push(`towers within ${stats.range} deal ×${stats.boost} damage`);
    return parts.join(' · ');
  }
  if (type.attack === 'beam') {
    parts.push(`${stats.dps} ${type.damageType} dps, up to ×${stats.rampMultiplier} when held`);
  } else {
    parts.push(`${stats.damage} ${type.damageType} dmg`, `${(1 / stats.fireInterval).toFixed(1)}/s`);
  }
  parts.push(stats.minRange ? `${stats.minRange}–${stats.range} range` : `${stats.range} range`);
  if (stats.splashRadius) parts.push(`${stats.splashRadius} splash`);
  if (stats.armorPierce) parts.push(`pierces ${Math.round(stats.armorPierce * 100)}% armor`);
  if (type.targeting === 'toughest') parts.push('targets the toughest');
  if (stats.slow) parts.push(`slows ${Math.round((1 - stats.slow.factor) * 100)}% for ${stats.slow.duration}s`);
  if (stats.burn) parts.push(`burns ${stats.burn.dps}/s for ${stats.burn.duration}s`);
  if (stats.poison) parts.push(`poison ${stats.poison.dpsPerStack}/s per stack, up to ${stats.poison.maxStacks}`);
  if (stats.jumps) parts.push(`arcs to ${stats.jumps} more`);
  return parts.join(' · ');
}

let statusTimer = null;
function flashStatus(text) {
  statusEl.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(updateHud, 1500);
}

function updateHud() {
  levelNameEl.textContent = `${levelIndex + 1}. ${game.level.name}`;
  goldEl.textContent = game.gold;
  livesEl.textContent = game.lives;
  waveEl.textContent = `${Math.max(0, game.waveIndex + 1)} / ${game.waveCount}`;

  const over = game.phase === PHASE.WON || game.phase === PHASE.LOST;
  startWaveBtn.disabled = game.phase !== PHASE.BUILD;
  restartBtn.hidden = !over;
  nextLevelBtn.hidden = !(game.phase === PHASE.WON && levelIndex + 1 < LEVELS.length);

  const spotSelected = ui.selectedSpot >= 0;
  const tower = spotSelected ? game.towers[ui.selectedSpot] : null;
  towerMenu.hidden = !spotSelected || over;
  upgradeBtn.hidden = !tower;
  sellBtn.hidden = !tower;
  for (const btn of towerMenu.querySelectorAll('button[data-type]')) {
    btn.hidden = !!tower;
    btn.disabled = game.gold < TOWER_TYPES[btn.dataset.type].levels[0].cost;
  }

  if (tower) {
    const type = TOWER_TYPES[tower.typeId];
    const stats = game.towerStats(tower);
    const upgradeCost = game.upgradeCost(tower);
    towerInfoEl.textContent = `${type.name} — Level ${tower.level + 1}/${MAX_TOWER_LEVEL} · ${describeStats(type, stats)}`;
    upgradeBtn.textContent = upgradeCost === null ? 'Max level' : `Upgrade (${upgradeCost}g)`;
    upgradeBtn.disabled = upgradeCost === null || game.gold < upgradeCost;
    sellBtn.textContent = `Sell (+${game.sellValue(tower)}g)`;
  } else {
    towerInfoEl.textContent = '';
  }

  if (game.phase === PHASE.WON) {
    saveUnlocked(levelIndex + 1);
    statusEl.textContent = levelIndex + 1 < LEVELS.length ? 'Victory! The next level is unlocked.' : 'Victory! You have beaten every level.';
  } else if (game.phase === PHASE.LOST) {
    statusEl.textContent = 'Defeat! The enemies broke through.';
  } else if (game.phase === PHASE.WAVE) {
    const boss = game.boss;
    if (boss) {
      const traits = describeTraits(game.enemyTypes[boss.typeId]);
      statusEl.textContent = `${game.enemyTypes[boss.typeId].name} approaches!${traits.length ? ` (${traits.join(', ')})` : ''}`;
    } else {
      statusEl.textContent = `Wave ${game.waveIndex + 1} incoming...`;
    }
  } else if (spotSelected && !tower) {
    statusEl.textContent = 'Choose a tower to build.';
  } else if (tower) {
    statusEl.textContent = 'Upgrade or sell this tower.';
  } else {
    statusEl.textContent = 'Click a spot to build, then start the wave.';
  }
}

// --- Game loop ----------------------------------------------------------

let lastTime = performance.now();
function frame(now) {
  // Clamp dt so a background tab doesn't fast-forward the simulation.
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const phaseBefore = game.phase;
  const goldBefore = game.gold;
  const livesBefore = game.lives;
  game.update(dt);
  if (game.phase !== phaseBefore || game.gold !== goldBefore || game.lives !== livesBefore) {
    updateHud();
  }

  effects.process(game.drainEvents());
  effects.ambient(game, dt);
  effects.update(dt);
  render(ctx, game, effects, ui, now / 1000);
  requestAnimationFrame(frame);
}

updateHud();
showLevelSelect();
requestAnimationFrame(frame);

</script>
</body>
</html>
