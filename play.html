<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Rush</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #2a3142 0%, #161a24 60%, #0f1118 100%);
      min-height: 100vh;
      color: #e6eaf2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(90deg, #8fd3ff, #ff4fd8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #hud {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
    }
    #hud > span {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
    }
    #stage {
      position: relative;
      width: min(100%, 1280px);
      border-radius: 10px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(143, 211, 255, 0.08);
    }
    #game {
      display: block;
      border-radius: 10px;
      max-width: 100%;
      touch-action: manipulation;
    }
    #level-select {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 22, 0.86);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      overflow: auto;
    }
    #level-select h2 { margin: 0 0 6px; font-size: 1.3rem; letter-spacing: 0.04em; }
    #level-list { display: flex; flex-direction: column; gap: 8px; width: min(440px, 100%); }
    .level-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-align: left;
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .level-btn:hover:not(:disabled) { background: rgba(143, 211, 255, 0.18); border-color: rgba(143, 211, 255, 0.5); }
    .level-btn small { opacity: 0.75; font-weight: normal; }
    .level-btn:disabled { opacity: 0.45; }
    #controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    #tower-menu { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; }
    button[data-type] {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 92px;
      padding: 8px 10px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--tower) 85%, white 15%), var(--tower));
      color: var(--tower-fg, #fff);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 14px color-mix(in srgb, var(--tower) 55%, transparent);
    }
    button[data-type] .tower-name { font-weight: 600; font-size: 0.85rem; }
    button[data-type] .tower-cost { font-size: 0.8rem; opacity: 0.85; }
    #start-wave { background: linear-gradient(180deg, #6fa0d8, #4a6fa5); font-weight: 600; letter-spacing: 0.03em; }
    #sell-tower { background: linear-gradient(180deg, #d06a72, #a8524c); }
    #upgrade-tower { background: linear-gradient(180deg, #b7d99f, #8fb273); color: #1b1f2a; font-weight: 600; }
    #tower-info { font-size: 0.9rem; opacity: 0.85; min-height: 1.2em; }
    #status { min-height: 1.4em; font-style: italic; opacity: 0.8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Tower Rush</h1>
  <div id="hud">
    <span id="level-name"></span>
    <span>💰 Gold: <strong id="gold">0</strong></span>
    <span>❤️ Lives: <strong id="lives">0</strong></span>
    <span>🌊 Wave: <strong id="wave">0 / 0</strong></span>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="level-select">
      <h2>Choose a level</h2>
      <div id="level-list"></div>
    </div>
  </div>
  <div id="controls">
    <button id="start-wave">Start Wave</button>
    <span id="tower-menu" hidden>
      <button id="upgrade-tower">Upgrade</button>
      <button id="sell-tower">Sell</button>
    </span>
    <button id="next-level" hidden>Next Level</button>
    <button id="restart" hidden>Play Again</button>
    <button id="choose-level">Levels</button>
  </div>
  <div id="tower-info"></div>
  <div id="status"></div>

// Kept for backwards compatibility with existing imports and tests.
const LEVEL_1 = LEVELS[0];

// A polyline path enemies walk along, addressed by distance from the start.
//
// Levels describe a road with a handful of control points. Path.fromLevel()
// bends long straight runs with a gentle meander and runs a centripetal
// Catmull-Rom spline through the result, producing a dense polyline that the
// simulation walks and the renderer draws, so the road reads as a winding
// trail rather than a grid.

function dist(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

// Insert an offset midpoint into every long straight segment so roads wander
// a little instead of running ruler-straight. Alternates side to side.
function meanderWaypoints(points, { minLength = 130, amount = 0.11, maxOffset = 22 } = {}) {
  if (points.length < 2) return points.map((p) => ({ ...p }));
  const out = [{ ...points[0] }];
  let side = 1;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];
    const len = dist(a, b);
    // Leave the off-screen entry and exit stubs straight.
    const offscreen = a.x < 0 || a.y < 0 || b.x < 0 || b.y < 0 || a.x > 800 || b.x > 800;
    if (len >= minLength && !offscreen) {
      const nx = -(b.y - a.y) / len;
      const ny = (b.x - a.x) / len;
      const off = Math.min(maxOffset, len * amount) * side;
      out.push({ x: (a.x + b.x) / 2 + nx * off, y: (a.y + b.y) / 2 + ny * off });
      side = -side;
    }
    out.push({ ...b });
  }
  return out;
}

// Centripetal Catmull-Rom through the control points (Barry–Goldman form).
// The first and last points are kept exactly.
function smoothWaypoints(points, samplesPerSegment = 12) {
  if (points.length < 3) return points.map((p) => ({ ...p }));
  const pts = [points[0], ...points, points[points.length - 1]];
  const knot = (t, a, b) => t + Math.pow(Math.max(dist(a, b), 1e-6), 0.5);
  const out = [{ ...points[0] }];

  for (let i = 1; i < pts.length - 2; i++) {
    const [p0, p1, p2, p3] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
    const t0 = 0;
    const t1 = knot(t0, p0, p1);
    const t2 = knot(t1, p1, p2);
    const t3 = knot(t2, p2, p3);
    for (let s = 1; s <= samplesPerSegment; s++) {
      const t = t1 + ((t2 - t1) * s) / samplesPerSegment;
      const lerp = (a, b, ta, tb) => {
        const w = (t - ta) / (tb - ta);
        return { x: a.x + (b.x - a.x) * w, y: a.y + (b.y - a.y) * w };
      };
      const a1 = lerp(p0, p1, t0, t1);
      const a2 = lerp(p1, p2, t1, t2);
      const a3 = lerp(p2, p3, t2, t3);
      const b1 = lerp(a1, a2, t0, t2);
      const b2 = lerp(a2, a3, t1, t3);
      out.push(lerp(b1, b2, t1, t2));
    }
  }
  return out;
}

class Path {
  constructor(waypoints) {
    if (!waypoints || waypoints.length < 2) {
      throw new Error('Path needs at least two waypoints');
    }
    this.waypoints = waypoints;
    this.segmentLengths = [];
    this.totalLength = 0;
    for (let i = 0; i < waypoints.length - 1; i++) {
      const dx = waypoints[i + 1].x - waypoints[i].x;
      const dy = waypoints[i + 1].y - waypoints[i].y;
      const len = Math.hypot(dx, dy);
      this.segmentLengths.push(len);
      this.totalLength += len;
    }
  }

  // The smooth, winding road for a level. Set `level.smoothPath = false` to
  // walk the raw control points instead.
  static fromLevel(level) {
    if (level.smoothPath === false) return new Path(level.path);
    return new Path(smoothWaypoints(meanderWaypoints(level.path)));
  }

  // Position at `dist` from the start, clamped to the path's ends.
  positionAt(dist) {
    if (dist <= 0) return { ...this.waypoints[0] };
    let remaining = dist;
    for (let i = 0; i < this.segmentLengths.length; i++) {
      const len = this.segmentLengths[i];
      if (remaining <= len) {
        const t = len === 0 ? 0 : remaining / len;
        const a = this.waypoints[i];
        const b = this.waypoints[i + 1];
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
      remaining -= len;
    }
    return { ...this.waypoints[this.waypoints.length - 1] };
  }
}

// Core game logic. No DOM or canvas access here, so it runs in Node for tests.


const PHASE = {
  BUILD: 'build', // between waves; player can build and start the next wave
  WAVE: 'wave',   // enemies spawning/walking
  WON: 'won',
  LOST: 'lost',
};

// Physical damage is cut by armor, magic damage by magic resistance.
function effectiveDamage(amount, damageType, enemyType, armorPierce = 0) {
  const reduction = damageType === 'magic'
    ? enemyType.magicResist || 0
    : (enemyType.armor || 0) * (1 - armorPierce);
  return amount * (1 - reduction);
}

class Game {
  constructor(level, { towerTypes = TOWER_TYPES, enemyTypes = ENEMY_TYPES } = {}) {
    this.level = level;
    this.towerTypes = towerTypes;
    this.enemyTypes = enemyTypes;
    this.path = Path.fromLevel(level);

    this.gold = level.startingGold;
    this.lives = level.startingLives;
    this.phase = PHASE.BUILD;
    this.waveIndex = -1; // index of the wave in progress (or last completed)

    this.enemies = [];
    this.towers = []; // one slot per build spot; null = empty
    for (let i = 0; i < level.buildSpots.length; i++) this.towers.push(null);
    this.projectiles = [];
    this.spawnQueue = []; // [{ typeId, at }] sorted by time; `at` is wave-relative seconds
    this.waveTime = 0;
    this.nextEnemyId = 1;
    this.events = []; // gameplay events since the last drainEvents(), for effects/UI
  }

  get waveCount() {
    return this.level.waves.length;
  }

  // The live boss enemy, if one is on the field.
  get boss() {
    return this.enemies.find((e) => e.alive && e.boss) || null;
  }

  // Record a gameplay event. The queue is capped so a headless simulation
  // that never drains it cannot grow without bound.
  pushEvent(event) {
    this.events.push(event);
    if (this.events.length > 500) this.events.splice(0, this.events.length - 500);
  }

  drainEvents() {
    const events = this.events;
    this.events = [];
    return events;
  }

  // --- Tower stats -------------------------------------------------------

  // Stats for a tower's current tier: { cost, damage, range, fireInterval, splashRadius }.
  towerStats(tower) {
    return this.towerTypes[tower.typeId].levels[tower.level];
  }

  // Cost to take a tower to its next tier, or null at max level.
  upgradeCost(tower) {
    const levels = this.towerTypes[tower.typeId].levels;
    if (tower.level + 1 >= levels.length) return null;
    return levels[tower.level + 1].cost;
  }

  sellValue(tower) {
    return Math.floor(tower.invested * this.level.sellRefund);
  }

  // --- Player actions ---------------------------------------------------

  buildTower(spotIndex, typeId) {
    if (spotIndex < 0 || spotIndex >= this.towers.length) {
      return { ok: false, reason: 'invalid-spot' };
    }
    if (this.towers[spotIndex]) return { ok: false, reason: 'occupied' };
    const type = this.towerTypes[typeId];
    if (!type) return { ok: false, reason: 'unknown-type' };
    const cost = type.levels[0].cost;
    if (this.gold < cost) return { ok: false, reason: 'not-enough-gold' };
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) {
      return { ok: false, reason: 'game-over' };
    }

    this.gold -= cost;
    this.towers[spotIndex] = { typeId, level: 0, cooldown: 0, invested: cost, age: 0 };
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-built', x: spot.x, y: spot.y, towerType: typeId });
    return { ok: true };
  }

  upgradeTower(spotIndex) {
    const tower = this.towers[spotIndex];
    if (!tower) return { ok: false, reason: 'empty' };
    const cost = this.upgradeCost(tower);
    if (cost === null) return { ok: false, reason: 'max-level' };
    if (this.gold < cost) return { ok: false, reason: 'not-enough-gold' };
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) {
      return { ok: false, reason: 'game-over' };
    }

    this.gold -= cost;
    tower.level += 1;
    tower.invested += cost;
    tower.age = 0;
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-upgraded', x: spot.x, y: spot.y, towerType: tower.typeId, level: tower.level + 1 });
    return { ok: true, level: tower.level + 1 };
  }

  sellTower(spotIndex) {
    const tower = this.towers[spotIndex];
    if (!tower) return { ok: false, reason: 'empty' };
    const refund = this.sellValue(tower);
    this.gold += refund;
    this.towers[spotIndex] = null;
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-sold', x: spot.x, y: spot.y, refund });
    return { ok: true, refund };
  }

  startNextWave() {
    if (this.waveIndex + 1 >= this.waveCount) return { ok: false, reason: 'no-more-waves' };
    if (this.phase !== PHASE.BUILD) return { ok: false, reason: 'wave-in-progress' };

    this.waveIndex += 1;
    this.phase = PHASE.WAVE;
    this.waveTime = 0;
    this.spawnQueue = [];

    // Entries within a wave spawn in sequence: all of entry 0, then entry 1, ...
    let t = 0;
    for (const entry of this.level.waves[this.waveIndex].entries) {
      for (let i = 0; i < entry.count; i++) {
        this.spawnQueue.push({ typeId: entry.type, at: t });
        t += entry.interval;
      }
    }
    this.pushEvent({ type: 'wave-started', wave: this.waveIndex + 1, final: this.waveIndex + 1 === this.waveCount });
    return { ok: true, wave: this.waveIndex + 1 };
  }

  // --- Simulation --------------------------------------------------------

  update(dt) {
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) return;
    if (this.phase === PHASE.WAVE) this.waveTime += dt;

    this.spawnEnemies();
    this.moveEnemies(dt);
    this.updateTowers(dt);
    this.updateProjectiles(dt);
    this.cleanupAndCheckEnd();
  }

  spawnEnemies() {
    while (this.spawnQueue.length > 0 && this.spawnQueue[0].at <= this.waveTime) {
      const { typeId } = this.spawnQueue.shift();
      const type = this.enemyTypes[typeId];
      this.enemies.push({
        id: this.nextEnemyId++,
        typeId,
        hp: type.hp,
        maxHp: type.hp,
        speed: type.speed,
        bounty: type.bounty,
        radius: type.radius,
        boss: !!type.boss,
        livesCost: type.lives || 1,
        dist: 0,
        alive: true,
        flash: 0, // seconds of white hit-flash left, for rendering
        slow: null, // { factor, remaining } while chilled
        burn: null, // { dps, remaining, damageType } while burning
        poison: null, // { stacks, dpsPerStack, remaining } while poisoned
        age: 0, // seconds since spawning, for the renderer
      });
      const pos = this.path.positionAt(0);
      this.pushEvent({ type: 'enemy-spawned', x: pos.x, y: pos.y, enemyType: typeId });
      if (type.boss) this.pushEvent({ type: 'boss-spawned', name: type.name, enemyType: typeId });
    }
  }

  moveEnemies(dt) {
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      enemy.flash = Math.max(0, (enemy.flash || 0) - dt);
      enemy.age = (enemy.age || 0) + dt;
      if (enemy.slow) {
        enemy.slow.remaining -= dt;
        if (enemy.slow.remaining <= 0) enemy.slow = null;
      }
      if (enemy.burn) {
        this.damageEnemy(enemy, enemy.burn.dps * dt, enemy.burn.damageType, { flash: false });
        enemy.burn.remaining -= dt;
        if (enemy.burn.remaining <= 0) enemy.burn = null;
        if (!enemy.alive) continue;
      }
      if (enemy.poison) {
        this.damageEnemy(enemy, enemy.poison.dpsPerStack * enemy.poison.stacks * dt, 'magic', { flash: false });
        enemy.poison.remaining -= dt;
        if (enemy.poison.remaining <= 0) enemy.poison = null;
        if (!enemy.alive) continue;
      }
      enemy.dist += enemy.speed * (enemy.slow ? enemy.slow.factor : 1) * dt;
      if (enemy.dist >= this.path.totalLength) {
        enemy.alive = false;
        enemy.leaked = true;
        const cost = enemy.livesCost || 1;
        this.lives = Math.max(0, this.lives - cost);
        const pos = this.path.positionAt(this.path.totalLength - 1);
        this.pushEvent({ type: 'enemy-leaked', x: pos.x, y: pos.y, boss: enemy.boss, cost });
      }
    }
  }

  // Damage multiplier a tower receives from the strongest beacon covering it.
  applyBeaconBoosts() {
    for (const tower of this.towers) if (tower) tower.boost = 1;
    this.towers.forEach((beacon, b) => {
      if (!beacon || (this.towerTypes[beacon.typeId].attack || 'projectile') !== 'aura') return;
      const stats = this.towerStats(beacon);
      const from = this.level.buildSpots[b];
      this.towers.forEach((tower, i) => {
        if (!tower || i === b) return;
        const spot = this.level.buildSpots[i];
        if (Math.hypot(spot.x - from.x, spot.y - from.y) <= stats.range) {
          tower.boost = Math.max(tower.boost, stats.boost);
        }
      });
    });
  }

  updateTowers(dt) {
    this.applyBeaconBoosts();
    for (let i = 0; i < this.towers.length; i++) {
      const tower = this.towers[i];
      if (!tower) continue;
      const type = this.towerTypes[tower.typeId];
      const stats = this.towerStats(tower);
      const spot = this.level.buildSpots[i];
      const attack = type.attack || 'projectile';
      tower.age = (tower.age || 0) + dt; // seconds since built/upgraded, for the renderer
      const boost = tower.boost || 1;

      if (attack === 'aura') continue;
      if (attack === 'beam') {
        this.updateBeam(tower, type, stats, spot, dt, boost);
        continue;
      }

      tower.cooldown = Math.max(0, tower.cooldown - dt);
      if (tower.cooldown > 0) continue;
      const target = this.findTarget(spot, stats.range, { minRange: stats.minRange, mode: type.targeting });
      if (!target) continue;

      const pos = this.path.positionAt(target.dist);
      tower.angle = Math.atan2(pos.y - spot.y, pos.x - spot.x);
      tower.targetX = pos.x; // where the shot went, for continuous effects like the flame jet
      tower.targetY = pos.y;
      tower.cooldown = stats.fireInterval;
      this.pushEvent({ type: 'shot', x: spot.x, y: spot.y, angle: tower.angle, towerType: tower.typeId, level: tower.level, targetX: pos.x, targetY: pos.y });

      if (attack === 'projectile') {
        this.projectiles.push({
          x: spot.x,
          y: spot.y,
          startX: spot.x,
          startY: spot.y,
          prevX: spot.x,
          prevY: spot.y,
          targetId: target.id,
          lastTarget: pos,
          speed: type.projectileSpeed,
          damage: stats.damage * boost,
          damageType: type.damageType,
          armorPierce: stats.armorPierce || 0,
          splashRadius: stats.splashRadius,
          slow: stats.slow || null,
          poison: stats.poison || null,
          color: type.color,
          towerType: tower.typeId,
          towerLevel: tower.level,
          dirX: 0,
          dirY: 0,
        });
      } else if (attack === 'instant') {
        this.damageEnemy(target, stats.damage * boost, type.damageType);
        if (stats.burn) this.applyBurn(target, { dps: stats.burn.dps * boost, duration: stats.burn.duration }, type.damageType);
        this.pushEvent({ type: 'hit', x: pos.x, y: pos.y, towerType: tower.typeId, level: tower.level, splash: 0 });
      } else if (attack === 'chain') {
        this.chainLightning(spot, target, stats, type, tower, boost);
      }
    }
  }

  // Lightning hits the target, then arcs to the nearest untouched enemy
  // within chainRadius, losing damage with every jump.
  chainLightning(spot, target, stats, type, tower, boost = 1) {
    const points = [{ x: spot.x, y: spot.y - 26 }];
    const struck = new Set();
    let current = target;
    let damage = stats.damage * boost;
    for (let jump = 0; jump <= stats.jumps && current; jump++) {
      const pos = this.path.positionAt(current.dist);
      points.push(pos);
      struck.add(current.id);
      this.damageEnemy(current, damage, type.damageType);
      damage *= stats.falloff;
      let next = null;
      let best = Infinity;
      for (const enemy of this.enemies) {
        if (!enemy.alive || struck.has(enemy.id)) continue;
        const p = this.path.positionAt(enemy.dist);
        const d = Math.hypot(p.x - pos.x, p.y - pos.y);
        if (d <= stats.chainRadius && d < best) {
          best = d;
          next = enemy;
        }
      }
      current = next;
    }
    this.pushEvent({ type: 'zap', points, towerType: tower.typeId, level: tower.level });
  }

  // A beam stays on its target while it can and ramps up the longer it holds.
  updateBeam(tower, type, stats, spot, dt, boost = 1) {
    let target = this.enemies.find((e) => e.id === tower.beamTargetId && e.alive) || null;
    if (target) {
      const pos = this.path.positionAt(target.dist);
      if (Math.hypot(pos.x - spot.x, pos.y - spot.y) > stats.range) target = null;
    }
    if (!target) {
      target = this.findTarget(spot, stats.range);
      tower.beamTargetId = target ? target.id : null;
      tower.beamTime = 0;
    }
    if (!target) return;

    tower.beamTime += dt;
    const ramp = Math.min(1, tower.beamTime / stats.rampTime);
    const multiplier = 1 + (stats.rampMultiplier - 1) * ramp;
    const pos = this.path.positionAt(target.dist);
    tower.angle = Math.atan2(pos.y - spot.y, pos.x - spot.x);
    this.damageEnemy(target, stats.dps * multiplier * boost * dt, type.damageType, { flash: false });
  }

  // Current damage multiplier of a beam tower, for the HUD and renderer.
  beamMultiplier(tower) {
    const stats = this.towerStats(tower);
    if (!tower.beamTargetId || !stats.rampTime) return 1;
    return 1 + (stats.rampMultiplier - 1) * Math.min(1, (tower.beamTime || 0) / stats.rampTime);
  }

  applySlow(enemy, slow) {
    // A stronger or fresher chill replaces a weaker one; never stacks.
    if (!enemy.slow || slow.factor <= enemy.slow.factor) {
      enemy.slow = { factor: slow.factor, remaining: slow.duration };
    } else {
      enemy.slow.remaining = Math.max(enemy.slow.remaining, slow.duration);
    }
  }

  applyPoison(enemy, poison) {
    if (!enemy.poison) {
      enemy.poison = { stacks: 1, dpsPerStack: poison.dpsPerStack, remaining: poison.duration };
    } else {
      enemy.poison.stacks = Math.min(poison.maxStacks, enemy.poison.stacks + 1);
      enemy.poison.dpsPerStack = Math.max(enemy.poison.dpsPerStack, poison.dpsPerStack);
      enemy.poison.remaining = poison.duration;
    }
  }

  applyBurn(enemy, burn, damageType) {
    if (!enemy.burn || burn.dps >= enemy.burn.dps) {
      enemy.burn = { dps: burn.dps, remaining: burn.duration, damageType };
    } else {
      enemy.burn.remaining = Math.max(enemy.burn.remaining, burn.duration);
    }
  }

  // Kingdom Rush convention: shoot the enemy furthest along the path in range.
  // `mode: 'toughest'` instead picks the highest-HP enemy; `minRange` skips
  // enemies that are too close (mortars).
  findTarget(from, range, { minRange = 0, mode = 'furthest' } = {}) {
    let best = null;
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      const pos = this.path.positionAt(enemy.dist);
      const d = Math.hypot(pos.x - from.x, pos.y - from.y);
      if (d > range || d < minRange) continue;
      const better = mode === 'toughest'
        ? !best || enemy.hp > best.hp || (enemy.hp === best.hp && enemy.dist > best.dist)
        : !best || enemy.dist > best.dist;
      if (better) best = enemy;
    }
    return best;
  }

  updateProjectiles(dt) {
    for (const proj of this.projectiles) {
      const target = this.enemies.find((e) => e.id === proj.targetId && e.alive);
      // Fly toward the live target, or the target's last known spot if it died.
      const dest = target ? this.path.positionAt(target.dist) : proj.lastTarget;
      if (target) proj.lastTarget = dest;

      const dx = dest.x - proj.x;
      const dy = dest.y - proj.y;
      const distToDest = Math.hypot(dx, dy);
      const step = proj.speed * dt;
      proj.prevX = proj.x;
      proj.prevY = proj.y;
      if (distToDest > 0) {
        proj.dirX = dx / distToDest;
        proj.dirY = dy / distToDest;
      }

      if (distToDest <= step) {
        proj.x = dest.x;
        proj.y = dest.y;
        proj.done = true;
        this.applyHit(proj, target);
        this.pushEvent({
          type: 'hit',
          x: proj.x,
          y: proj.y,
          towerType: proj.towerType,
          level: proj.towerLevel,
          splash: proj.splashRadius,
        });
      } else {
        proj.x += (dx / distToDest) * step;
        proj.y += (dy / distToDest) * step;
      }
    }
    this.projectiles = this.projectiles.filter((p) => !p.done);
  }

  applyHit(proj, directTarget) {
    if (proj.splashRadius > 0) {
      for (const enemy of this.enemies) {
        if (!enemy.alive) continue;
        const pos = this.path.positionAt(enemy.dist);
        if (Math.hypot(pos.x - proj.x, pos.y - proj.y) <= proj.splashRadius + enemy.radius) {
          this.damageEnemy(enemy, proj.damage, proj.damageType, { armorPierce: proj.armorPierce });
          if (proj.slow) this.applySlow(enemy, proj.slow);
          if (proj.poison) this.applyPoison(enemy, proj.poison);
        }
      }
    } else if (directTarget) {
      this.damageEnemy(directTarget, proj.damage, proj.damageType, { armorPierce: proj.armorPierce });
      if (proj.slow) this.applySlow(directTarget, proj.slow);
      if (proj.poison) this.applyPoison(directTarget, proj.poison);
    }
  }

  damageEnemy(enemy, amount, damageType = 'physical', { flash = true, armorPierce = 0 } = {}) {
    if (!enemy.alive) return;
    const type = this.enemyTypes[enemy.typeId];
    enemy.hp -= effectiveDamage(amount, damageType, type, armorPierce);
    if (flash) enemy.flash = 0.12;
    if (enemy.hp <= 0 && enemy.alive) {
      enemy.alive = false;
      this.gold += enemy.bounty;
      const pos = this.path.positionAt(enemy.dist);
      this.pushEvent({
        type: 'enemy-died',
        x: pos.x,
        y: pos.y,
        bounty: enemy.bounty,
        enemyType: enemy.typeId,
        boss: enemy.boss,
      });
    }
  }

  cleanupAndCheckEnd() {
    this.enemies = this.enemies.filter((e) => e.alive);

    if (this.lives <= 0) {
      this.phase = PHASE.LOST;
      this.pushEvent({ type: 'game-lost' });
      return;
    }
    const waveCleared =
      this.phase === PHASE.WAVE && this.spawnQueue.length === 0 && this.enemies.length === 0;
    if (waveCleared) {
      this.phase = this.waveIndex + 1 >= this.waveCount ? PHASE.WON : PHASE.BUILD;
      this.pushEvent({ type: this.phase === PHASE.WON ? 'game-won' : 'wave-cleared' });
    }
  }
}

// Visual effects state: particles, ground decals, floating texts, banners,
// lightning bolts, tracers, screen shake, full-screen flashes, and scheduled
// bursts. No DOM or canvas access — the renderer draws this, tests drive it
// headless.
//
// Particle shapes (drawn by render.js):
//   dot     shrinking filled circle            spark   streak along its velocity
//   ember   glowing dot with a soft halo        shard   spinning triangle
//   star    spinning four-point star            smoke   growing soft puff
//   ring    expanding ring                      flash   short bright burst
//   drop    falling droplet                     tracer  fading line (x,y)->(x2,y2)
//   scorch / crater / frostpatch / puddle       ground decals (groundParticles)
//   leaf / snow / ash / sand / firefly / pollen ambient weather


const MAX_PARTICLES = 900;
const MAX_GROUND = 160;

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function pick(list) {
  return list[Math.floor(Math.random() * list.length)];
}

class Effects {
  constructor({ enemyTypes = ENEMY_TYPES } = {}) {
    this.enemyTypes = enemyTypes;
    this.particles = [];       // drawn above enemies
    this.groundParticles = []; // drawn beneath enemies (decals, dust)
    this.texts = [];           // {x,y,text,color,life,maxLife,scale}
    this.banner = null;        // {text,color,life,maxLife,sub}
    this.scheduled = [];       // [{delay, x, y, kind, ...}] future bursts
    this.bolts = [];           // [{points, life, maxLife}] lightning arcs
    this.shake = 0;            // current screen-shake amplitude (px)
    this.flash = null;         // {color, alpha} full-screen flash
    this.dustTimer = 0;        // throttles ambient footstep dust
    this.weatherTimer = 0;     // throttles ambient weather
    this.time = 0;
  }

  clear() {
    this.particles = [];
    this.groundParticles = [];
    this.texts = [];
    this.banner = null;
    this.scheduled = [];
    this.bolts = [];
    this.shake = 0;
    this.flash = null;
  }

  // --- Event intake -------------------------------------------------------------

  process(events) {
    for (const event of events) {
      switch (event.type) {
        case 'shot': this.spawnMuzzle(event); break;
        case 'hit': this.spawnImpact(event); break;
        case 'zap': this.spawnLightning(event); break;
        case 'enemy-died': event.boss ? this.spawnBossDeath(event) : this.spawnDeath(event); break;
        case 'enemy-spawned': this.spawnEmerge(event); break;
        case 'boss-spawned': this.spawnBossArrival(event); break;
        case 'enemy-leaked': this.spawnLeak(event); break;
        case 'tower-built': this.spawnConstruction(event); break;
        case 'tower-sold': this.spawnSale(event); break;
        case 'tower-upgraded': this.spawnUpgrade(event); break;
        case 'wave-started':
          this.setBanner(event.final ? 'Final Wave' : `Wave ${event.wave}`, event.final ? '#ff9f45' : '#f2e3b3');
          break;
        case 'game-won':
          this.setBanner('Victory!', '#ffd700', 'The realm is safe');
          this.scheduleFireworks();
          this.addFlash('#ffffff', 0.5);
          break;
        case 'game-lost':
          this.setBanner('Defeat!', '#e25555', 'The castle has fallen');
          this.addFlash('#5a0000', 0.55);
          this.shake = Math.max(this.shake, 10);
          break;
      }
    }
  }

  // --- Ambient: driven by live game state every frame ----------------------------

  ambient(game, dt) {
    this.time += dt;
    this.ambientWeather(game.level, dt);

    // Footstep dust under walkers.
    this.dustTimer -= dt;
    if (this.dustTimer <= 0) {
      this.dustTimer = 0.09;
      for (const enemy of game.enemies) {
        if (!enemy.alive || Math.random() > 0.4) continue;
        const pos = game.path.positionAt(enemy.dist);
        this.addGroundParticle({
          x: pos.x + rand(-4, 4), y: pos.y + enemy.radius * 0.6,
          vx: rand(-8, 8), vy: rand(-14, -4),
          life: rand(0.3, 0.55), size: rand(1.5, 3), color: '#b8a67e', shape: 'smoke',
        });
      }
    }

    // Status effects on enemies: embers, chill sparkles, poison bubbles.
    for (const enemy of game.enemies) {
      if (!enemy.alive) continue;
      const pos = game.path.positionAt(enemy.dist);
      if (enemy.burn && Math.random() < dt * 16) {
        const fire = Math.random() < 0.35;
        this.addParticle({
          x: pos.x + rand(-enemy.radius * 0.6, enemy.radius * 0.6), y: pos.y - enemy.radius * 0.5,
          vx: rand(-10, 10), vy: fire ? rand(-40, -18) : rand(-60, -28),
          life: fire ? rand(0.25, 0.45) : rand(0.3, 0.6), size: fire ? rand(2.5, 4) : rand(1.5, 3),
          color: pick(['#ff9f45', '#ffd97a', '#ff6b35']), shape: fire ? 'fire' : 'ember', drag: fire ? 1.5 : 0,
        });
      }
      if (enemy.slow && Math.random() < dt * 9) {
        this.addParticle({
          x: pos.x + rand(-enemy.radius, enemy.radius), y: pos.y + rand(-enemy.radius, enemy.radius),
          vx: rand(-6, 6), vy: rand(-14, -3),
          life: rand(0.5, 0.9), size: rand(1.2, 2.4), color: '#dff3ff', shape: 'star', spin: rand(-3, 3),
        });
      }
      if (enemy.poison && Math.random() < dt * (6 + enemy.poison.stacks * 3)) {
        this.addParticle({
          x: pos.x + rand(-enemy.radius * 0.7, enemy.radius * 0.7), y: pos.y - enemy.radius * 0.3,
          vx: rand(-5, 5), vy: rand(-26, -12),
          life: rand(0.5, 0.9), size: rand(1.5, 3), color: pick(['#8fd33a', '#c6ff6b']), shape: 'dot', drag: 1.5,
        });
      }
    }

    // Towers: beam impact sparks, beacon motes, frost mist, venom drips.
    game.towers.forEach((tower, i) => {
      if (!tower) return;
      const spot = game.level.buildSpots[i];
      if (tower.beamTargetId) {
        const target = game.enemies.find((e) => e.id === tower.beamTargetId && e.alive);
        if (target && Math.random() < dt * 34) {
          const pos = game.path.positionAt(target.dist);
          const angle = rand(0, Math.PI * 2);
          this.addParticle({
            x: pos.x, y: pos.y,
            vx: Math.cos(angle) * rand(40, 110), vy: Math.sin(angle) * rand(40, 110) - 25,
            life: rand(0.15, 0.32), size: rand(1, 2.4), color: pick(['#ff4fd8', '#ffffff', '#ffb3ec']), shape: 'spark',
          });
        }
      }
      if (tower.typeId === 'beacon' && Math.random() < dt * 10) {
        const a = rand(0, Math.PI * 2);
        this.addParticle({
          x: spot.x + Math.cos(a) * rand(4, 16), y: spot.y - 10 + Math.sin(a) * rand(2, 6),
          vx: rand(-4, 4), vy: rand(-34, -16),
          life: rand(0.8, 1.4), size: rand(1.2, 2.4), color: pick(['#ffd166', '#fff1b8']), shape: 'ember', drag: 0.6,
        });
      }
      if (tower.typeId === 'frost' && Math.random() < dt * 5) {
        this.addGroundParticle({
          x: spot.x + rand(-12, 12), y: spot.y + rand(0, 8),
          vx: rand(-6, 6), vy: rand(-4, -1),
          life: rand(0.9, 1.6), size: rand(4, 7), color: 'rgba(191,233,255,0.35)', shape: 'smoke',
        });
      }
      if (tower.typeId === 'venom' && Math.random() < dt * 4) {
        this.addParticle({
          x: spot.x + rand(-6, 6), y: spot.y - 14,
          vx: 0, vy: 20,
          life: 0.5, size: 2, color: '#8fd33a', shape: 'drop', gravity: 180,
        });
      }
    });

    // Projectile trails.
    for (const proj of game.projectiles) {
      const t = proj.towerType;
      if (t === 'frost' && Math.random() < dt * 34) {
        this.addParticle({ x: proj.x + rand(-2, 2), y: proj.y + rand(-2, 2), vx: rand(-8, 8), vy: rand(-8, 8), life: rand(0.2, 0.4), size: rand(1, 2), color: '#dff3ff', shape: 'star', spin: 4 });
      } else if (t === 'mage' && Math.random() < dt * 44) {
        this.addParticle({ x: proj.x + rand(-2, 2), y: proj.y + rand(-2, 2), vx: rand(-12, 12), vy: rand(-12, 12), life: rand(0.2, 0.36), size: rand(1, 2.2), color: pick(['#b9a7ff', '#e6dcff']), shape: 'ember' });
      } else if (t === 'cannon' && Math.random() < dt * 28) {
        this.addParticle({ x: proj.x, y: proj.y - 10, vx: rand(-6, 6), vy: rand(-14, -4), life: rand(0.25, 0.5), size: rand(1.5, 3), color: '#8d949b', shape: 'smoke' });
      } else if (t === 'mortar' && Math.random() < dt * 60) {
        this.addParticle({ x: proj.x, y: proj.y - 14, vx: rand(-10, 10), vy: rand(-10, 10), life: rand(0.2, 0.4), size: rand(1.5, 3), color: pick(['#ffb347', '#ff6b35', '#9aa0a6']), shape: Math.random() < 0.6 ? 'ember' : 'smoke' });
      } else if (t === 'venom' && Math.random() < dt * 20) {
        this.addParticle({ x: proj.x, y: proj.y, vx: rand(-3, 3), vy: 10, life: 0.4, size: 1.6, color: '#8fd33a', shape: 'drop', gravity: 160 });
      } else if (t === 'archer' && Math.random() < dt * 20) {
        this.addParticle({ x: proj.x, y: proj.y, vx: 0, vy: 0, life: 0.14, size: 1, color: 'rgba(255,255,255,0.5)', shape: 'dot' });
      }
    }
  }

  // Theme weather: each level has its own drifting atmosphere.
  ambientWeather(level, dt) {
    const { width = 800, height = 480, theme } = level;
    this.weatherTimer -= dt;
    if (this.weatherTimer > 0) return;
    this.weatherTimer = 0.05;
    const kind = (theme && theme.weather) || 'none';
    const roll = Math.random();
    if (kind === 'leaves' && roll < 0.35) {
      this.addParticle({
        x: rand(-20, width), y: rand(-10, height * 0.3), vx: rand(18, 40), vy: rand(10, 24),
        life: rand(5, 8), size: rand(2, 3.2), color: pick(['#7fb24a', '#a9c94f', '#d9a441']),
        shape: 'leaf', spin: rand(1, 4), wobble: 40, drag: 0,
      });
      if (Math.random() < 0.3) {
        this.addParticle({ x: rand(0, width), y: rand(0, height), vx: rand(-6, 6), vy: rand(-8, -2), life: rand(2, 4), size: rand(0.8, 1.6), color: 'rgba(255,255,220,0.8)', shape: 'pollen', wobble: 20 });
      }
    } else if (kind === 'snow' && roll < 0.9) {
      for (let i = 0; i < 2; i++) {
        this.addParticle({
          x: rand(-20, width), y: -6, vx: rand(-8, 14), vy: rand(22, 48),
          life: rand(9, 13), size: rand(1.2, 2.8), color: 'rgba(255,255,255,0.9)', shape: 'snow', wobble: 30,
        });
      }
    } else if (kind === 'sand' && roll < 0.5) {
      this.addParticle({
        x: -10, y: rand(0, height), vx: rand(160, 260), vy: rand(-10, 10),
        life: rand(3.5, 5.5), size: rand(0.8, 1.6), color: 'rgba(255,235,180,0.55)', shape: 'sand',
      });
    } else if (kind === 'fireflies') {
      if (roll < 0.25) {
        this.addParticle({
          x: rand(0, width), y: rand(height * 0.2, height), vx: rand(-8, 8), vy: rand(-8, 8),
          life: rand(3, 6), size: rand(1.2, 2.2), color: '#c6ff8a', shape: 'firefly', wobble: 30,
        });
      }
      if (roll > 0.85) {
        this.addGroundParticle({
          x: rand(0, width), y: rand(0, height), vx: rand(4, 12), vy: rand(-3, 3),
          life: rand(4, 7), size: rand(14, 26), color: 'rgba(200,230,200,0.12)', shape: 'smoke',
        });
      }
    } else if (kind === 'embers') {
      if (roll < 0.5) {
        this.addParticle({
          x: rand(0, width), y: height + 6, vx: rand(-14, 14), vy: rand(-60, -30),
          life: rand(4, 7), size: rand(1, 2.4), color: pick(['#ff9f45', '#ffd97a', '#ff6b35']), shape: 'ember', wobble: 36, drag: 0.3,
        });
      }
      if (roll > 0.55) {
        this.addParticle({
          x: rand(-20, width), y: -6, vx: rand(-10, 10), vy: rand(14, 30),
          life: rand(9, 14), size: rand(1, 2.2), color: 'rgba(120,110,110,0.7)', shape: 'ash', wobble: 25,
        });
      }
    }
  }

  // --- Spawners -------------------------------------------------------------------

  spawnMuzzle(event) {
    const t = event.towerType;
    if (t === 'cannon' || t === 'mortar') {
      const n = t === 'mortar' ? 12 : 8;
      for (let i = 0; i < n; i++) {
        const spread = event.angle + rand(-0.5, 0.5);
        this.addParticle({
          x: event.x + Math.cos(event.angle) * 14, y: event.y - 10 + Math.sin(event.angle) * 14,
          vx: Math.cos(spread) * rand(60, 150), vy: Math.sin(spread) * rand(60, 150) - 20,
          life: rand(0.15, 0.35), size: rand(2, 4.5), color: i % 2 ? '#ffd97a' : '#9aa0a6',
          shape: i % 2 ? 'spark' : 'smoke',
        });
      }
      this.addParticle({ x: event.x + Math.cos(event.angle) * 16, y: event.y - 10 + Math.sin(event.angle) * 16, vx: 0, vy: 0, life: 0.1, size: t === 'mortar' ? 16 : 11, color: '#fff1b8', shape: 'flash' });
      if (t === 'mortar') this.shake = Math.max(this.shake, 2);
    } else if (t === 'sniper') {
      // Tracer line from nest to target plus a sharp muzzle flash.
      if (event.targetX !== undefined) {
        this.addParticle({ x: event.x, y: event.y - 30, x2: event.targetX, y2: event.targetY, vx: 0, vy: 0, life: 0.14, size: 2, color: '#f2ffd0', shape: 'tracer' });
      }
      this.addParticle({ x: event.x + Math.cos(event.angle) * 18, y: event.y - 30 + Math.sin(event.angle) * 18, vx: 0, vy: 0, life: 0.09, size: 9, color: '#ffffff', shape: 'flash' });
    } else if (t === 'mage') {
      for (let i = 0; i < 6; i++) {
        this.addParticle({ x: event.x, y: event.y - 26, vx: rand(-40, 40), vy: rand(-40, 40), life: rand(0.2, 0.42), size: rand(1.4, 3), color: pick(['#b9a7ff', '#e6dcff']), shape: 'ember' });
      }
    } else if (t === 'flame') {
      // Fire tongues ride the jet, sooty smoke curls off its end, embers stray.
      const level = event.level || 0;
      const len = 15 + level * 1.5;
      const ox = event.x + Math.cos(event.angle) * len;
      const oy = event.y - 12 + Math.sin(event.angle) * len;
      const reach = event.targetX !== undefined ? Math.hypot(event.targetX - ox, event.targetY - oy) : 60;
      for (let i = 0; i < 4; i++) {
        const spread = event.angle + rand(-0.2, 0.2);
        const speed = rand(150, 260);
        this.addParticle({
          x: ox, y: oy, vx: Math.cos(spread) * speed, vy: Math.sin(spread) * speed - 8,
          life: rand(0.22, 0.4), size: rand(2.5, 4.5) + level * 0.5,
          color: pick(['#ff9a3a', '#ff7a2a', '#ffc45a', '#ff5a1f', '#e8401a']), shape: 'fire', drag: 2.2, grow: 1.6,
        });
      }
      const ex = ox + Math.cos(event.angle) * reach;
      const ey = oy + Math.sin(event.angle) * reach;
      this.addParticle({
        x: ex + rand(-6, 6), y: ey + rand(-6, 6),
        vx: Math.cos(event.angle) * rand(20, 50) + rand(-10, 10), vy: rand(-45, -20),
        life: rand(0.6, 1.1), size: rand(3, 5), color: pick(['rgba(70,60,60,0.55)', 'rgba(40,35,35,0.5)']),
        shape: 'smoke', grow: 2.2, drag: 1.2,
      });
      if (Math.random() < 0.7) {
        this.addParticle({ x: ex, y: ey, vx: rand(-40, 40), vy: rand(-80, -30), life: rand(0.4, 0.8), size: rand(1.2, 2), color: pick(['#ffd97a', '#ff9f45']), shape: 'ember', gravity: 40, drag: 0.8 });
      }
    } else if (t === 'venom') {
      for (let i = 0; i < 3; i++) {
        this.addParticle({ x: event.x, y: event.y - 14, vx: Math.cos(event.angle) * rand(20, 50) + rand(-15, 15), vy: Math.sin(event.angle) * rand(20, 50), life: 0.3, size: 1.6, color: '#8fd33a', shape: 'drop', gravity: 200 });
      }
    } else if (t === 'archer') {
      this.addParticle({ x: event.x, y: event.y - 20, vx: Math.cos(event.angle) * 30, vy: Math.sin(event.angle) * 30, life: 0.15, size: 1.6, color: '#e8e2d4', shape: 'dot' });
    }
  }

  spawnImpact(event) {
    const t = event.towerType;
    if (t === 'cannon' || t === 'mortar') {
      this.spawnExplosion(event.x, event.y, t === 'mortar' ? 1.6 : 1, Math.max(20, event.splash));
    } else if (t === 'frost') {
      for (let i = 0; i < 9; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(30, 110);
        this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 20, life: rand(0.3, 0.55), size: rand(2, 3.5), color: i % 2 ? '#8fd3ff' : '#ffffff', shape: 'shard', spin: rand(-8, 8), gravity: 120 });
      }
      this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.28, size: 16, color: '#bfe9ff', shape: 'ring' });
      this.addGroundParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 2.5, size: rand(9, 13), color: 'rgba(191,233,255,0.45)', shape: 'frostpatch' });
    } else if (t === 'venom') {
      for (let i = 0; i < 7; i++) {
        this.addParticle({ x: event.x, y: event.y, vx: rand(-60, 60), vy: rand(-70, -10), life: rand(0.3, 0.5), size: rand(1.5, 2.6), color: pick(['#8fd33a', '#c6ff6b']), shape: 'drop', gravity: 220 });
      }
      this.addGroundParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 3, size: rand(8, 12), color: 'rgba(120,200,40,0.4)', shape: 'puddle' });
    } else if (t === 'sniper') {
      for (let i = 0; i < 8; i++) {
        const angle = rand(0, Math.PI * 2);
        this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * rand(60, 160), vy: Math.sin(angle) * rand(60, 160), life: rand(0.15, 0.3), size: rand(1, 2), color: '#ffffff', shape: 'spark' });
      }
      this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.12, size: 12, color: '#f2ffd0', shape: 'flash' });
    } else if (t === 'flame') {
      // Fire splashes up the target, embers pop off, and the ground scorches.
      for (let i = 0; i < 3; i++) {
        this.addParticle({ x: event.x + rand(-6, 6), y: event.y + rand(-5, 5), vx: rand(-25, 25), vy: rand(-65, -25), life: rand(0.25, 0.45), size: rand(2, 3.5), color: pick(['#ff9f45', '#ff7a2a', '#ff6b35', '#e8401a']), shape: 'fire', drag: 1.5 });
      }
      this.addParticle({ x: event.x + rand(-4, 4), y: event.y + rand(-4, 4), vx: rand(-30, 30), vy: rand(-70, -30), life: rand(0.3, 0.6), size: rand(1.4, 2.4), color: '#ffd97a', shape: 'ember', gravity: 50 });
      if (Math.random() < 0.2) {
        this.addGroundParticle({ x: event.x + rand(-4, 4), y: event.y + rand(2, 8), vx: 0, vy: 0, life: rand(2, 4), size: rand(4, 7), color: 'rgba(30,20,15,0.45)', shape: 'scorch' });
      }
    } else if (t === 'mage') {
      for (let i = 0; i < 12; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(30, 110);
        this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: rand(0.25, 0.5), size: rand(1.4, 3.2), color: i % 2 ? '#8f7bff' : '#e6dcff', shape: i % 3 ? 'ember' : 'star', spin: rand(-6, 6) });
      }
      this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.2, size: 12, color: '#b9a7ff', shape: 'ring' });
    } else {
      for (let i = 0; i < 5; i++) {
        this.addParticle({ x: event.x, y: event.y, vx: rand(-60, 60), vy: rand(-60, 10), life: rand(0.15, 0.3), size: rand(1.2, 2.2), color: i % 2 ? '#e8e2d4' : '#c9a86a', shape: 'spark', gravity: 120 });
      }
    }
  }

  // Multi-stage explosion: flash, fireball, sparks, debris, smoke, ring, decal, shake.
  spawnExplosion(x, y, scale, splash) {
    this.addParticle({ x, y, vx: 0, vy: 0, life: 0.12, size: 22 * scale, color: '#fff1b8', shape: 'flash' });
    for (let i = 0; i < 4; i++) {
      this.addParticle({ x: x + rand(-6, 6) * scale, y: y + rand(-6, 6) * scale, vx: rand(-20, 20), vy: rand(-40, -10), life: rand(0.25, 0.4), size: rand(8, 13) * scale, color: pick(['#ff9f45', '#ff6b35', '#ffd97a']), shape: 'smoke', grow: 1.2 });
    }
    for (let i = 0; i < Math.round(18 * scale); i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(60, 220) * scale;
      this.addParticle({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 30, life: rand(0.3, 0.65), size: rand(1.5, 3.5), color: pick(['#ffd97a', '#ff9f45', '#ff6b35', '#ffffff']), shape: 'spark', gravity: 200, drag: 1.2 });
    }
    for (let i = 0; i < Math.round(7 * scale); i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(50, 150) * scale;
      this.addParticle({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 60, life: rand(0.4, 0.8), size: rand(2, 4), color: pick(['#3b3b3b', '#6b5a4a', '#8a7a6a']), shape: 'shard', spin: rand(-12, 12), gravity: 300 });
    }
    for (let i = 0; i < Math.round(6 * scale); i++) {
      this.addParticle({ x: x + rand(-9, 9), y: y + rand(-9, 9), vx: rand(-18, 18), vy: rand(-55, -20), life: rand(0.6, 1.2), size: rand(5, 10) * scale, color: '#7d848a', shape: 'smoke', grow: 1.6 });
    }
    this.addParticle({ x, y, vx: 0, vy: 0, life: 0.35, size: splash * scale, color: '#ffb347', shape: 'ring' });
    this.addGroundParticle({ x, y, vx: 0, vy: 0, life: 5, size: rand(10, 14) * scale, color: 'rgba(40,32,22,0.55)', shape: scale > 1.2 ? 'crater' : 'scorch' });
    this.shake = Math.max(this.shake, 1.5 * scale);
  }

  spawnLightning(event) {
    this.bolts.push({ points: event.points, life: 0.18, maxLife: 0.18 });
    for (const p of event.points.slice(1)) {
      this.addParticle({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.1, size: 9, color: '#dff3ff', shape: 'flash' });
      for (let i = 0; i < 6; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(40, 130);
        this.addParticle({ x: p.x, y: p.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: rand(0.15, 0.32), size: rand(1, 2.2), color: i % 2 ? '#dff3ff' : '#7ec8ff', shape: 'spark' });
      }
    }
  }

  spawnDeath(event) {
    const type = this.enemyTypes[event.enemyType];
    const color = type?.color ?? '#888';
    const r = type?.radius ?? 9;
    // Shards of the body, a spark burst, a rising soul wisp, and a coin.
    for (let i = 0; i < 8; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(30, 110);
      this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 50, life: rand(0.35, 0.65), size: rand(2, 3.5) * (r / 9), color, shape: 'shard', spin: rand(-10, 10), gravity: 260 });
    }
    for (let i = 0; i < 6; i++) {
      const angle = rand(0, Math.PI * 2);
      this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * rand(40, 120), vy: Math.sin(angle) * rand(40, 120), life: rand(0.2, 0.4), size: rand(1, 2), color: '#ffffff', shape: 'spark' });
    }
    this.addParticle({ x: event.x, y: event.y - 4, vx: 0, vy: -28, life: 0.9, size: r * 0.7, color: 'rgba(230,240,255,0.5)', shape: 'smoke', grow: 0.6 });
    this.addParticle({ x: event.x, y: event.y, vx: rand(-15, 15), vy: -95, life: 0.65, size: 3, color: '#ffd700', shape: 'star', spin: 9, gravity: 280 });
    this.addText(event.x, event.y - 12, `+${event.bounty}g`, '#ffd700');
  }

  spawnBossDeath(event) {
    const type = this.enemyTypes[event.enemyType];
    const color = type?.color ?? '#888';
    this.addFlash('#ffffff', 0.7);
    this.shake = Math.max(this.shake, 12);
    this.spawnExplosion(event.x, event.y, 2.2, 60);
    for (let i = 0; i < 24; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(60, 220);
      this.addParticle({ x: event.x, y: event.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 80, life: rand(0.6, 1.2), size: rand(3, 6), color, shape: 'shard', spin: rand(-12, 12), gravity: 240 });
    }
    // Aftershocks spread out over the next second.
    for (let i = 1; i <= 6; i++) {
      this.scheduled.push({ delay: i * 0.16, x: event.x + rand(-40, 40), y: event.y + rand(-30, 30), kind: 'blast', scale: 0.9 });
    }
    this.scheduled.push({ delay: 0.3, x: event.x, y: event.y, kind: 'firework' });
    this.scheduled.push({ delay: 0.7, x: event.x - 60, y: event.y - 40, kind: 'firework' });
    this.scheduled.push({ delay: 1.1, x: event.x + 60, y: event.y - 40, kind: 'firework' });
    this.setBanner(`${type?.name ?? 'Boss'} slain!`, '#ffd700', `+${event.bounty} gold`);
    this.addText(event.x, event.y - 20, `+${event.bounty}g`, '#ffd700', 1.6);
  }

  spawnBossArrival(event) {
    this.setBanner(event.name, '#ff6b6b', 'approaches');
    this.shake = Math.max(this.shake, 5);
    this.addFlash('#3a0000', 0.35);
  }

  spawnEmerge(event) {
    for (let i = 0; i < 5; i++) {
      this.addParticle({ x: event.x + rand(-6, 10), y: event.y + rand(-6, 6), vx: rand(5, 34), vy: rand(-20, -4), life: rand(0.3, 0.55), size: rand(2, 4.5), color: '#b8a67e', shape: 'smoke', grow: 1.4 });
    }
  }

  spawnLeak(event) {
    const cost = event.cost || 1;
    this.addText(event.x, event.y, cost === 1 ? '-1 life' : `-${cost} lives`, '#e25555', 1 + cost * 0.12);
    this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.4 + cost * 0.05, size: 22 + cost * 6, color: '#e25555', shape: 'ring' });
    this.addFlash('#5a0000', Math.min(0.45, 0.12 + cost * 0.06));
    this.shake = Math.max(this.shake, 1 + cost);
  }

  spawnConstruction(event) {
    for (let i = 0; i < 12; i++) {
      const angle = rand(0, Math.PI * 2);
      this.addParticle({
        x: event.x + Math.cos(angle) * rand(4, 14), y: event.y + Math.sin(angle) * rand(2, 8),
        vx: Math.cos(angle) * rand(20, 70), vy: rand(-80, -20),
        life: rand(0.3, 0.65), size: rand(2, 4), color: i % 3 === 0 ? '#9aa1a8' : '#c2b391',
        gravity: 240, shape: i % 2 ? 'shard' : 'smoke', spin: rand(-8, 8), grow: 1.3,
      });
    }
    this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.3, size: 24, color: '#ffffff', shape: 'ring' });
  }

  spawnSale(event) {
    for (let i = 0; i < 8; i++) {
      this.addParticle({ x: event.x + rand(-8, 8), y: event.y + rand(-10, 0), vx: rand(-25, 25), vy: rand(-90, -40), life: rand(0.4, 0.7), size: rand(2, 3), color: '#ffd700', shape: 'star', spin: rand(-8, 8), gravity: 220 });
    }
    this.addText(event.x, event.y - 16, `+${event.refund}g`, '#ffd700');
  }

  spawnUpgrade(event) {
    this.addParticle({ x: event.x, y: event.y - 8, vx: 0, vy: 0, life: 0.45, size: 28, color: '#ffd700', shape: 'ring' });
    this.addParticle({ x: event.x, y: event.y - 14, vx: 0, vy: 0, life: 0.18, size: 20, color: '#fff1b8', shape: 'flash' });
    for (let i = 0; i < 16; i++) {
      const angle = rand(0, Math.PI * 2);
      this.addParticle({
        x: event.x + Math.cos(angle) * rand(2, 12), y: event.y + Math.sin(angle) * rand(1, 6),
        vx: rand(-18, 18), vy: rand(-120, -50),
        life: rand(0.5, 0.9), size: rand(1.5, 3), color: i % 3 === 0 ? '#ffffff' : '#ffd700',
        shape: i % 2 ? 'star' : 'ember', spin: rand(-8, 8), gravity: 90, drag: 0.8,
      });
    }
    this.addText(event.x, event.y - 30, `Level ${event.level}`, '#ffd700', 1.2);
  }

  scheduleFireworks() {
    for (let i = 0; i < 7; i++) {
      this.scheduled.push({ delay: 0.3 + i * 0.4, x: rand(120, 680), y: rand(60, 220), kind: 'firework' });
    }
  }

  spawnFirework(x, y) {
    const hue = pick(['#ffd700', '#7bd47b', '#7badff', '#ff8fb3', '#c9a1ff', '#ffffff']);
    this.addParticle({ x, y, vx: 0, vy: 0, life: 0.15, size: 18, color: '#ffffff', shape: 'flash' });
    for (let i = 0; i < 26; i++) {
      const angle = (i / 26) * Math.PI * 2;
      const speed = rand(60, 130);
      this.addParticle({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: rand(0.6, 1.0), size: rand(1.5, 3), color: i % 4 === 0 ? '#ffffff' : hue, shape: 'spark', gravity: 70, drag: 1.0 });
    }
    for (let i = 0; i < 10; i++) {
      this.addParticle({ x, y, vx: rand(-50, 50), vy: rand(-60, 20), life: rand(1, 1.6), size: rand(1.5, 2.6), color: hue, shape: 'star', spin: rand(-8, 8), gravity: 60, drag: 1.2 });
    }
  }

  // --- Primitives -------------------------------------------------------------------

  addParticle({ x, y, vx, vy, life, size, color, shape = 'dot', gravity = 0, spin = 0, drag = 0, grow = 1, wobble = 0, x2, y2 }) {
    if (this.particles.length >= MAX_PARTICLES) this.particles.shift();
    this.particles.push({ x, y, vx, vy, life, maxLife: life, size, color, shape, gravity, spin, rot: Math.random() * Math.PI * 2, drag, grow, wobble, x2, y2 });
  }

  addGroundParticle({ x, y, vx, vy, life, size, color, shape = 'dot', gravity = 0 }) {
    if (this.groundParticles.length >= MAX_GROUND) this.groundParticles.shift();
    this.groundParticles.push({ x, y, vx, vy, life, maxLife: life, size, color, shape, gravity, spin: 0, rot: 0, drag: 0, grow: 1, wobble: 0 });
  }

  addText(x, y, text, color, scale = 1) {
    this.texts.push({ x, y, text, color, life: 0.9 + scale * 0.2, maxLife: 0.9 + scale * 0.2, scale });
  }

  setBanner(text, color, sub = '') {
    this.banner = { text, color, sub, life: 2.2, maxLife: 2.2 };
  }

  addFlash(color, alpha) {
    if (!this.flash || alpha > this.flash.alpha) this.flash = { color, alpha };
  }

  // --- Integration ------------------------------------------------------------------

  update(dt) {
    for (const list of [this.particles, this.groundParticles]) {
      for (const p of list) {
        p.life -= dt;
        p.vy += p.gravity * dt;
        if (p.drag) {
          const k = Math.max(0, 1 - p.drag * dt);
          p.vx *= k;
          p.vy *= k;
        }
        if (p.wobble) p.vx += (Math.random() - 0.5) * p.wobble * dt * 10;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.spin * dt;
      }
    }
    this.particles = this.particles.filter((p) => p.life > 0);
    this.groundParticles = this.groundParticles.filter((p) => p.life > 0);

    for (const t of this.texts) {
      t.life -= dt;
      t.y -= 28 * dt;
    }
    this.texts = this.texts.filter((t) => t.life > 0);

    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }

    for (const b of this.bolts) b.life -= dt;
    this.bolts = this.bolts.filter((b) => b.life > 0);

    for (const s of this.scheduled) {
      s.delay -= dt;
      if (s.delay <= 0) {
        if (s.kind === 'firework') this.spawnFirework(s.x, s.y);
        else if (s.kind === 'blast') this.spawnExplosion(s.x, s.y, s.scale || 1, 30);
      }
    }
    this.scheduled = this.scheduled.filter((s) => s.delay > 0);

    this.shake = Math.max(0, this.shake - dt * 18);
    if (this.flash) {
      this.flash.alpha -= dt * 1.6;
      if (this.flash.alpha <= 0) this.flash = null;
    }
  }
}

// Canvas rendering. Pure drawing — reads game/effects state, never mutates it.
//
// Layers, back to front:
//   static terrain (prerendered once per level): ground, path, water base,
//     cave, castle
//   animated water (ripples, shimmer)
//   ground particles (dust, scorch)
//   build spots, decorations, towers, enemies (sorted by y), projectiles
//   cloud shadows
//   particles, floating text, boss bar, banner

let sceneCache = null; // { level, terrain: canvas, decor: [...], clouds: [...] }

// Small deterministic PRNG so decorations stay put between frames and loads.
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function render(ctx, game, effects, ui, time) {
  const { level } = game;
  // The canvas may be scaled for high-DPI screens; terrain is prerendered at
  // the same scale so it stays crisp.
  const dpr = ctx.getTransform().a || 1;
  const scene = getScene(game, dpr);
  ctx.clearRect(0, 0, level.width, level.height);

  // Screen shake: a small decaying offset applied to everything but the HUD.
  ctx.save();
  if (effects.shake > 0) {
    ctx.translate(Math.sin(time * 47) * effects.shake, Math.cos(time * 31) * effects.shake * 0.7);
  }
  ctx.drawImage(scene.terrain, -8, -8, level.width + 16, level.height + 16);

  drawWaterAnimation(ctx, level, time);
  drawParticleList(ctx, effects.groundParticles);
  drawBuildSpots(ctx, game, ui, time);
  drawDecorations(ctx, scene.decor, level.theme, time);
  drawTowers(ctx, game, ui, time);
  drawEnemies(ctx, game, time);
  drawProjectiles(ctx, game);
  drawBeams(ctx, game, time);
  drawFlameJets(ctx, game, time);
  drawBolts(ctx, effects.bolts);
  drawCloudShadows(ctx, scene.clouds, level, time);
  drawBeaconAuras(ctx, game, time);
  drawParticleList(ctx, effects.particles, true);
  ctx.restore();
  drawVignette(ctx, scene.vignette, level);
  if (effects.flash) {
    ctx.globalAlpha = Math.max(0, Math.min(1, effects.flash.alpha));
    ctx.fillStyle = effects.flash.color;
    ctx.fillRect(0, 0, level.width, level.height);
    ctx.globalAlpha = 1;
  }
  drawTexts(ctx, effects);
  drawBossBar(ctx, game);
  drawBanner(ctx, effects, level);
}

// --- Scene setup (once per level) -----------------------------------------

function getScene(game, dpr) {
  if (sceneCache && sceneCache.level === game.level && sceneCache.dpr === dpr) return sceneCache;
  const { level } = game;
  const { theme } = level;
  const rng = mulberry32(42);

  const terrain = document.createElement('canvas');
  terrain.width = Math.round(level.width * dpr);
  terrain.height = Math.round(level.height * dpr);
  const ctx = terrain.getContext('2d');
  ctx.scale(dpr, dpr);

  // Ground with soft mottling.
  const ground = ctx.createLinearGradient(0, 0, 0, level.height);
  ground.addColorStop(0, theme.groundTop);
  ground.addColorStop(1, theme.groundBottom);
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, level.width, level.height);
  // Soft, small mottles with blurred edges so the ground reads as texture
  // rather than a scatter of hard-edged blobs.
  for (let i = 0; i < 160; i++) {
    const x = rng() * level.width;
    const y = rng() * level.height;
    const r = 10 + rng() * 26;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = rng() > 0.5 ? theme.mottleLight : theme.mottleDark;
    g.addColorStop(0, c);
    g.addColorStop(1, transparentOf(c)); // same hue at alpha 0 avoids grey fringes
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * (0.45 + rng() * 0.4), rng() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }

  drawGroundTexture(ctx, level, rng);
  drawThemeGroundFeatures(ctx, game, rng);

  for (const w of level.water) drawWaterBase(ctx, w, theme);

  // Path: dark edge, fill, worn center line, then wear and tear.
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathEdge;
  ctx.lineWidth = 34;
  ctx.stroke();
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathFill;
  ctx.lineWidth = 28;
  ctx.stroke();
  // Inner highlight on the sun side gives the road a little relief.
  ctx.save();
  ctx.translate(-1.5, -1.5);
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 24;
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.setLineDash([2, 14]);
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathLine;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
  drawPathDetail(ctx, game, theme, rng);
  for (const w of level.water) drawShoreDetail(ctx, w, theme, rng);

  drawThemeSetPieces(ctx, game, rng);
  drawCave(ctx, level, theme);
  drawCastle(ctx, level, theme);

  const decor = placeDecorations(game, rng);
  const clouds = makeClouds(level, rng);
  const vignette = makeVignette(level, dpr);
  sceneCache = { level, dpr, terrain, decor, clouds, vignette };
  return sceneCache;
}

// Soft darkening toward the edges, prerendered once; gives the map depth.
function makeVignette(level, dpr) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(level.width * dpr);
  canvas.height = Math.round(level.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const g = ctx.createRadialGradient(level.width / 2, level.height / 2, level.height * 0.45, level.width / 2, level.height / 2, level.width * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(10,8,20,0.42)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, level.width, level.height);
  return canvas;
}

function drawVignette(ctx, vignette, level) {
  ctx.drawImage(vignette, 0, 0, level.width, level.height);
}

function tracePath(ctx, waypoints) {
  ctx.beginPath();
  waypoints.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
}

function drawWaterBase(ctx, w, theme) {
  // Shore ring, then deep-to-shallow radial fill.
  ctx.fillStyle = theme.lava ? 'rgba(20,10,8,0.6)' : 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(w.x, w.y, w.rx + 6, w.ry + 5, 0, 0, Math.PI * 2);
  ctx.fill();
  const grad = ctx.createRadialGradient(w.x, w.y, 2, w.x, w.y, w.rx);
  grad.addColorStop(0, theme.waterDeep);
  grad.addColorStop(1, theme.waterShallow);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(w.x, w.y, w.rx, w.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  if (theme.lilyPads) {
    const rng = mulberry32(w.x * 7 + w.y);
    for (let i = 0; i < 4; i++) {
      const a = rng() * Math.PI * 2;
      const d = rng() * 0.7;
      const px = w.x + Math.cos(a) * w.rx * d;
      const py = w.y + Math.sin(a) * w.ry * d;
      ctx.fillStyle = '#6fae4a';
      ctx.beginPath();
      ctx.ellipse(px, py, 7, 5, 0, 0.4, Math.PI * 2 - 0.2);
      ctx.lineTo(px, py);
      ctx.fill();
    }
  }
}

function drawCave(ctx, level, theme) {
  const p = level.path[0];
  const x = Math.max(16, Math.min(level.width - 16, p.x));
  const y = Math.max(16, Math.min(level.height - 16, p.y));
  // Rock rim: a few irregular boulders stacked around the mouth.
  const rim = ['#5a5248', '#4a4238', '#6a6258'];
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + (i / 8) * Math.PI;
    const rx = x + Math.cos(a) * 26;
    const ry = y + Math.sin(a) * 22 + 2;
    ctx.fillStyle = rim[i % 3];
    ctx.strokeStyle = '#2f2a24';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(rx, ry, 8 + (i % 2) * 3, 6 + (i % 3), a, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.fillStyle = '#4a4238';
  ctx.beginPath();
  ctx.arc(x, y, 22, Math.PI, 0);
  ctx.fill();
  const g = ctx.createRadialGradient(x, y + 4, 2, x, y, 18);
  g.addColorStop(0, '#000000');
  g.addColorStop(1, '#17120d');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, 16, Math.PI, 0);
  ctx.fill();
  // Something is watching from inside.
  ctx.fillStyle = 'rgba(255,80,60,0.85)';
  ctx.beginPath();
  ctx.arc(x - 4, y - 5, 1.3, 0, Math.PI * 2);
  ctx.arc(x + 4, y - 5, 1.3, 0, Math.PI * 2);
  ctx.fill();
  // Moss / frost / ash on the rocks per theme.
  ctx.fillStyle = theme.lava ? 'rgba(255,120,40,0.25)' : theme.lilyPads ? 'rgba(90,140,60,0.45)' : 'rgba(255,255,255,0.12)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.arc(x - 20 + i * 10, y - 16 + (i % 2) * 4, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCastle(ctx, level, theme) {
  const p = level.path[level.path.length - 1];
  const x = Math.max(34, Math.min(level.width - 34, p.x));
  const y = Math.max(64, Math.min(level.height - 20, p.y));
  const stone = theme.stone;
  const dark = theme.stoneDark;
  // Ground shadow.
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, y + 12, 40, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // Curtain wall with brick courses.
  ctx.fillStyle = stone;
  ctx.fillRect(x - 28, y - 34, 56, 46);
  ctx.strokeStyle = 'rgba(0,0,0,0.18)';
  ctx.lineWidth = 1;
  for (let row = 0; row < 6; row++) {
    const ry = y - 30 + row * 7;
    ctx.beginPath();
    ctx.moveTo(x - 28, ry);
    ctx.lineTo(x + 28, ry);
    ctx.stroke();
    for (let c = 0; c < 4; c++) {
      const cx = x - 28 + ((c + (row % 2) * 0.5) * 56) / 4;
      ctx.beginPath();
      ctx.moveTo(cx, ry);
      ctx.lineTo(cx, ry + 7);
      ctx.stroke();
    }
  }
  // Corner towers.
  for (const side of [-1, 1]) {
    const tx = x + side * 30;
    ctx.fillStyle = dark;
    ctx.fillRect(tx - 8, y - 48, 16, 60);
    ctx.fillStyle = stone;
    ctx.fillRect(tx - 7, y - 46, 14, 56);
    for (let i = 0; i < 3; i++) ctx.fillRect(tx - 8 + i * 6, y - 54, 4, 7);
    ctx.fillStyle = '#2b2520';
    ctx.fillRect(tx - 1.5, y - 36, 3, 8);
    // Conical roof with a glowing window beneath.
    ctx.fillStyle = '#7a3a3a';
    ctx.beginPath();
    ctx.moveTo(tx - 10, y - 54);
    ctx.lineTo(tx, y - 70);
    ctx.lineTo(tx + 10, y - 54);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,210,120,0.9)';
    ctx.fillRect(tx - 1.5, y - 18, 3, 5);
  }
  // Crenellations and string course.
  ctx.fillStyle = dark;
  for (let i = 0; i < 4; i++) ctx.fillRect(x - 20 + i * 12, y - 42, 7, 9);
  ctx.fillRect(x - 28, y - 14, 56, 2);
  // Gate with portcullis.
  ctx.fillStyle = '#5b4632';
  ctx.beginPath();
  ctx.arc(x, y + 10, 11, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x - 11, y + 10, 22, 2);
  ctx.strokeStyle = '#2b2520';
  ctx.lineWidth = 1.2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * 4, y + 10 - Math.sqrt(Math.max(0, 121 - (i * 4) ** 2)));
    ctx.lineTo(x + i * 4, y + 12);
    ctx.stroke();
  }
  // Arrow slits and a lit window.
  ctx.fillStyle = '#2b2520';
  ctx.fillRect(x - 17, y - 28, 3, 8);
  ctx.fillRect(x + 14, y - 28, 3, 8);
  ctx.fillStyle = 'rgba(255,210,120,0.9)';
  ctx.fillRect(x - 2, y - 30, 4, 6);
  // Banners on the towers and a flag over the gate.
  ctx.strokeStyle = dark;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 42);
  ctx.lineTo(x, y - 62);
  ctx.stroke();
  ctx.fillStyle = '#c33c3c';
  ctx.beginPath();
  ctx.moveTo(x, y - 62);
  ctx.lineTo(x + 16, y - 57);
  ctx.lineTo(x, y - 52);
  ctx.fill();
  ctx.fillStyle = '#3f6fb5';
  for (const side of [-1, 1]) {
    ctx.fillRect(x + side * 30 - 3, y - 30, 6, 12);
    ctx.beginPath();
    ctx.moveTo(x + side * 30 - 3, y - 18);
    ctx.lineTo(x + side * 30, y - 14);
    ctx.lineTo(x + side * 30 + 3, y - 18);
    ctx.fill();
  }
}

// --- Ground texture, path wear, shorelines ------------------------------------------------

// 'rgba(r,g,b,a)' -> the same colour fully transparent, for clean gradient falloff.
function transparentOf(color) {
  const m = /rgba?\(([^)]+)\)/.exec(color);
  if (!m) return 'rgba(0,0,0,0)';
  const [r, g, b] = m[1].split(',').map((v) => v.trim());
  return `rgba(${r},${g},${b},0)`;
}

function drawGroundTexture(ctx, level, rng) {
  const { theme } = level;
  const w = level.width;
  const h = level.height;
  if (theme.weather === 'leaves' || theme.lilyPads) {
    // Grass blades: thousands of short strokes in nearby greens.
    const greens = theme.lilyPads ? ['#6f8f45', '#52703a', '#7f9d4e', '#415f2c'] : ['#83b85e', '#6aa14e', '#95c468', '#5d9444'];
    ctx.lineWidth = 1;
    for (let i = 0; i < 2600; i++) {
      const x = rng() * w;
      const y = rng() * h;
      const len = 2 + rng() * 3;
      const lean = (rng() - 0.5) * 1.6;
      ctx.strokeStyle = greens[Math.floor(rng() * greens.length)];
      ctx.globalAlpha = 0.35 + rng() * 0.4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + lean, y - len);
      ctx.stroke();
    }
  } else if (theme.weather === 'snow') {
    // Snow sparkle and faint wind-blown drifts.
    for (let i = 0; i < 1400; i++) {
      ctx.globalAlpha = 0.3 + rng() * 0.6;
      ctx.fillStyle = rng() > 0.5 ? '#ffffff' : '#dbe8f1';
      ctx.fillRect(rng() * w, rng() * h, 1.2, 1.2);
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < 120; i++) {
      const x = rng() * w;
      const y = rng() * h;
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 15, y - 3, x + 30 + rng() * 20, y);
      ctx.stroke();
    }
  } else if (theme.weather === 'sand') {
    // Sand grain and wind ripples.
    for (let i = 0; i < 2200; i++) {
      ctx.globalAlpha = 0.2 + rng() * 0.4;
      ctx.fillStyle = rng() > 0.5 ? '#f3dca0' : '#b98f4e';
      ctx.fillRect(rng() * w, rng() * h, 1.3, 1.3);
    }
    ctx.lineWidth = 1;
    for (let i = 0; i < 160; i++) {
      const x = rng() * w;
      const y = rng() * h;
      ctx.strokeStyle = 'rgba(160,120,60,0.22)';
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 10, y + 3, x + 24 + rng() * 16, y);
      ctx.stroke();
    }
  } else if (theme.lava) {
    // Ash speckle and faint cooling-crust cracks.
    for (let i = 0; i < 2000; i++) {
      ctx.globalAlpha = 0.25 + rng() * 0.45;
      ctx.fillStyle = rng() > 0.7 ? '#6a5a58' : '#241c1c';
      ctx.fillRect(rng() * w, rng() * h, 1.4, 1.4);
    }
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.globalAlpha = 1;
    for (let i = 0; i < 90; i++) {
      let x = rng() * w;
      let y = rng() * h;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let k = 0; k < 4; k++) {
        x += (rng() - 0.5) * 24;
        y += (rng() - 0.5) * 24;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// Perpendicular unit normal of the path at distance d.
function pathNormal(game, d) {
  const a = game.path.positionAt(Math.max(0, d - 2));
  const b = game.path.positionAt(d + 2);
  const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
  return { x: -(b.y - a.y) / len, y: (b.x - a.x) / len };
}

function drawPathDetail(ctx, game, theme, rng) {
  const total = game.path.totalLength;
  // Wheel ruts: two faint lines either side of the center.
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    for (let d = 0; d <= total; d += 6) {
      const p = game.path.positionAt(d);
      const n = pathNormal(game, d);
      const x = p.x + n.x * 6 * side;
      const y = p.y + n.y * 6 * side;
      if (d === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // Pebbles and footprints scattered on the road.
  for (let d = 10; d < total; d += 9) {
    if (rng() > 0.55) continue;
    const p = game.path.positionAt(d);
    const n = pathNormal(game, d);
    const off = (rng() - 0.5) * 22;
    const x = p.x + n.x * off;
    const y = p.y + n.y * off;
    ctx.fillStyle = rng() > 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.ellipse(x, y, 1 + rng() * 1.6, 0.8 + rng() * 1.2, rng() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  // Grass tufts and edge wear where the road meets the ground.
  const tuft = theme.lava ? 'rgba(90,70,60,0.6)' : theme.weather === 'snow' ? 'rgba(255,255,255,0.7)' : theme.weather === 'sand' ? 'rgba(110,80,40,0.5)' : 'rgba(70,120,45,0.8)';
  ctx.strokeStyle = tuft;
  ctx.lineWidth = 1.2;
  for (let d = 4; d < total; d += 7) {
    if (rng() > 0.6) continue;
    const p = game.path.positionAt(d);
    const n = pathNormal(game, d);
    const side = rng() > 0.5 ? 1 : -1;
    const x = p.x + n.x * (15 + rng() * 4) * side;
    const y = p.y + n.y * (15 + rng() * 4) * side;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + k * 1.6 + n.x * side * 2, y - 3 - Math.abs(k) + n.y * side * 2);
      ctx.stroke();
    }
  }
}

function drawShoreDetail(ctx, w, theme, rng) {
  // Foam / frost / ash line hugging the water's edge, plus a few rim stones.
  ctx.strokeStyle = theme.lava ? 'rgba(255,170,80,0.35)' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 5]);
  ctx.beginPath();
  ctx.ellipse(w.x, w.y, w.rx - 3, w.ry - 3, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < 10; i++) {
    const a = rng() * Math.PI * 2;
    const x = w.x + Math.cos(a) * (w.rx + 6 + rng() * 6);
    const y = w.y + Math.sin(a) * (w.ry + 5 + rng() * 5);
    ctx.fillStyle = theme.lava ? '#3a2a28' : rng() > 0.5 ? '#8f9296' : '#a8abaf';
    ctx.beginPath();
    ctx.ellipse(x, y, 2 + rng() * 2, 1.5 + rng(), a, 0, Math.PI * 2);
    ctx.fill();
  }
}

// Find a spot clear of the road, build spots, and water.
function findClearSpot(game, rng, clearance, waterPad = 14) {
  const { level } = game;
  for (let attempt = 0; attempt < 60; attempt++) {
    const x = clearance + rng() * (level.width - clearance * 2);
    const y = clearance + rng() * (level.height - clearance * 2);
    if (distToPath(game, x, y) < 20 + clearance) continue;
    if (level.buildSpots.some((s) => Math.hypot(s.x - x, s.y - y) < 26 + clearance)) continue;
    if (level.water.some((w) => ((x - w.x) / (w.rx + waterPad + clearance)) ** 2 + ((y - w.y) / (w.ry + waterPad + clearance)) ** 2 < 1)) continue;
    return { x, y };
  }
  return null;
}

// --- Theme set pieces: large static features that give each map a place -------------------

// Drawn under the road and water: broad ground shapes (fields, dunes, drifts, moss, lava cracks).
function drawThemeGroundFeatures(ctx, game, rng) {
  const { theme } = game.level;
  if (theme.weather === 'leaves') {
    for (let i = 0; i < 3; i++) {
      const spot = findClearSpot(game, rng, 34);
      if (spot) drawCropField(ctx, spot.x, spot.y, 70 + rng() * 40, 44 + rng() * 24, rng);
    }
    for (let i = 0; i < 4; i++) {
      const spot = findClearSpot(game, rng, 14);
      if (spot) drawFlowerMeadow(ctx, spot.x, spot.y, rng);
    }
  } else if (theme.weather === 'snow') {
    for (let i = 0; i < 9; i++) {
      const spot = findClearSpot(game, rng, 18);
      if (spot) drawSnowDrift(ctx, spot.x, spot.y, 26 + rng() * 30, rng);
    }
    for (let i = 0; i < 4; i++) {
      const spot = findClearSpot(game, rng, 16);
      if (spot) drawIceCrack(ctx, spot.x, spot.y, rng);
    }
  } else if (theme.weather === 'sand') {
    for (let i = 0; i < 7; i++) {
      const spot = findClearSpot(game, rng, 20);
      if (spot) drawDune(ctx, spot.x, spot.y, 50 + rng() * 60, rng);
    }
    for (let i = 0; i < 4; i++) {
      const spot = findClearSpot(game, rng, 16);
      if (spot) drawCrackedEarth(ctx, spot.x, spot.y, rng);
    }
  } else if (theme.lilyPads) {
    for (let i = 0; i < 9; i++) {
      const spot = findClearSpot(game, rng, 12, 4);
      if (spot) drawMossPatch(ctx, spot.x, spot.y, 14 + rng() * 18, rng);
    }
  } else if (theme.lava) {
    for (let i = 0; i < 9; i++) {
      const spot = findClearSpot(game, rng, 14);
      if (spot) drawLavaCrack(ctx, spot.x, spot.y, rng);
    }
    for (let i = 0; i < 5; i++) {
      const spot = findClearSpot(game, rng, 18);
      if (spot) drawAshDune(ctx, spot.x, spot.y, 26 + rng() * 26, rng);
    }
  }
}

// Drawn over the road layer: objects with height (fences, hay, logs, boulders, ruins, huts).
function drawThemeSetPieces(ctx, game, rng) {
  const { theme } = game.level;
  const place = (n, clearance, fn) => {
    for (let i = 0; i < n; i++) {
      const spot = findClearSpot(game, rng, clearance);
      if (spot) fn(spot.x, spot.y);
    }
  };
  if (theme.weather === 'leaves') {
    place(4, 10, (x, y) => drawHaystack(ctx, x, y));
    place(3, 12, (x, y) => drawLog(ctx, x, y, rng, '#6b4a2b'));
    place(3, 22, (x, y) => drawFence(ctx, x, y, 3 + Math.floor(rng() * 3), rng() > 0.5));
    place(3, 10, (x, y) => drawStump(ctx, x, y));
    place(1, 30, (x, y) => drawFarmhouse(ctx, x, y));
    place(2, 12, (x, y) => drawStonePile(ctx, x, y, rng, '#8f9296', '#a8abaf'));
  } else if (theme.weather === 'snow') {
    place(6, 12, (x, y) => drawSnowBoulder(ctx, x, y, rng));
    place(3, 14, (x, y) => drawLog(ctx, x, y, rng, '#5a3f2a', true));
    place(1, 30, (x, y) => drawCabin(ctx, x, y));
    place(2, 20, (x, y) => drawFence(ctx, x, y, 3, true, true));
  } else if (theme.weather === 'sand') {
    place(2, 26, (x, y) => drawRuins(ctx, x, y, rng));
    place(1, 26, (x, y) => drawTent(ctx, x, y));
    place(3, 12, (x, y) => drawStonePile(ctx, x, y, rng, '#b08b55', '#d6b27e'));
    place(2, 12, (x, y) => drawSkull(ctx, x, y));
  } else if (theme.lilyPads) {
    place(6, 12, (x, y) => drawMangroveRoots(ctx, x, y, rng));
    place(4, 12, (x, y) => drawLog(ctx, x, y, rng, '#3f3024', false, true));
    place(3, 10, (x, y) => drawMushroomRing(ctx, x, y, rng));
    place(1, 30, (x, y) => drawStiltHut(ctx, x, y));
  } else if (theme.lava) {
    place(5, 14, (x, y) => drawBasaltColumns(ctx, x, y, rng));
    place(3, 16, (x, y) => drawFissure(ctx, x, y, rng));
    place(3, 10, (x, y) => drawSkull(ctx, x, y, true));
