  ctx.beginPath();
  ctx.moveTo(x + 2, y - h * 0.7);
  ctx.lineTo(x + 4.5, y - h * 0.45);
  ctx.lineTo(x + 3, y - h * 0.25);
  ctx.stroke();
  // Side crystals, growing with tier.
  for (let c = 0; c < level; c++) {
    const side = c % 2 ? 1 : -1;
    const sh = 14 + c * 3;
    const sx = x + side * (11 + Math.floor(c / 2) * 4);
    const g = ctx.createLinearGradient(sx, y - 2 - sh, sx, y - 2);
    g.addColorStop(0, '#e9f7ff');
    g.addColorStop(1, '#6fb8e8');
    ctx.fillStyle = g;
    ctx.globalAlpha = glow + 0.2;
    ctx.strokeStyle = 'rgba(95,168,216,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx + side * 1.5, y - 2 - sh);
    ctx.lineTo(sx + side * 5, y - 2);
    ctx.lineTo(sx - side * 3, y - 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // Aurora shimmer at the tip and drifting motes with sparkle crosses.
  ctx.globalCompositeOperation = 'lighter';
  glowDisc(ctx, tipX, tipY, 7 + level, `rgba(223,243,255,${0.4 + Math.sin(time * 5) * 0.2})`);
  for (let m = 0; m < 3 + level; m++) {
    const a = time * 1.6 + (m / (3 + level)) * Math.PI * 2;
    const mx = x + Math.cos(a) * (13 + level * 2);
    const my = y - 16 + Math.sin(a) * 7 - Math.sin(time * 2 + m) * 4;
    const tw = 0.6 + Math.sin(time * 4 + m) * 0.4;
    ctx.strokeStyle = `rgba(255,255,255,${tw})`;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(mx - 2.2, my);
    ctx.lineTo(mx + 2.2, my);
    ctx.moveTo(mx, my - 2.2);
    ctx.lineTo(mx, my + 2.2);
    ctx.stroke();
  }
  if (level >= 3) {
    ctx.strokeStyle = 'rgba(223,243,255,0.6)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 3]);
    ctx.lineDashOffset = time * 12;
    ctx.beginPath();
    ctx.ellipse(x, y - h * 0.55, 16, 5.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalCompositeOperation = 'source-over';
}

// --- Tesla coil: insulated mast with a crackling sphere ----------------------------

function drawTeslaTower(ctx, spot, time, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 30 + level * 5;
  const charge = 0.5 + Math.sin(time * 9) * 0.2 + (justFired ? 0.5 : 0);
  // Iron base block with vents and bolts.
  ctx.fillStyle = cylinderGradient(ctx, x - 11, x + 11, '#262a2f', '#4f555c', '#3b4046');
  ctx.strokeStyle = '#15181b';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x - 11 - level * 0.5, y - 9, 22 + level, 13, 2);
  ctx.fillStyle = '#15181b';
  for (let v = 0; v < 3; v++) ctx.fillRect(x - 7 + v * 5, y - 5, 3, 1.4);
  for (let v = 0; v < 3; v++) ctx.fillRect(x - 7 + v * 5, y - 2, 3, 1.4);
  ctx.fillStyle = '#7a8188';
  for (const [bx, by] of [[-9, -7], [9, -7], [-9, 2], [9, 2]]) {
    ctx.beginPath();
    ctx.arc(x + bx, y + by, 1, 0, Math.PI * 2);
    ctx.fill();
  }
  // Charge indicator lamp.
  ctx.globalCompositeOperation = 'lighter';
  glowDisc(ctx, x + 7, y - 6.5, 3.5, `rgba(126,200,255,${charge * 0.8})`);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(200,240,255,${0.5 + charge * 0.5})`;
  ctx.beginPath();
  ctx.arc(x + 7, y - 6.5, 1.2, 0, Math.PI * 2);
  ctx.fill();
  // Mast with copper windings.
  ctx.fillStyle = cylinderGradient(ctx, x - 2.5, x + 2.5, '#4a5058', '#9aa1a8', '#6d747b');
  ctx.fillRect(x - 2.5, y - h, 5, h - 9);
  ctx.fillStyle = 'rgba(196,122,58,0.9)';
  for (let wy = y - 14; wy > y - h + 6; wy -= 2.2) ctx.fillRect(x - 2.5, wy, 5, 1);
  // Insulator rings: ceramic white discs with copper collars.
  const rings = 2 + level;
  for (let r = 0; r < rings; r++) {
    const ry = y - 13 - r * ((h - 16) / rings);
    const rr = 7.5 + (level - r) * 0.5;
    ctx.fillStyle = '#c47a3a';
    ctx.beginPath();
    ctx.ellipse(x, ry + 1.2, rr, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = cylinderGradient(ctx, x - rr, x + rr, '#aab1b8', '#f1f4f7', '#dfe4e8');
    ctx.strokeStyle = '#7a8188';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.ellipse(x, ry, rr, 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  // Arcs crawling between rings.
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(223,243,255,${charge * 0.9})`;
  ctx.lineWidth = 1;
  for (let r = 0; r < rings - 1; r++) {
    if (Math.sin(time * 17 + r * 3.1) < 0.3) continue;
    const y0 = y - 13 - r * ((h - 16) / rings);
    const y1 = y - 13 - (r + 1) * ((h - 16) / rings);
    const side = Math.sin(time * 5 + r) > 0 ? 1 : -1;
    jaggedPath(ctx, x + side * 6, y0, x + side * 5.5, y1, 4, 5);
  }
  // Sphere: chrome dome with halo and flickering discharge.
  const sy = y - h - 5;
  const sr = 6.5 + level * 0.8;
  glowDisc(ctx, x, sy, sr * 2.4 + level, `rgba(126,200,255,${charge * 0.45})`);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = domeGradient(ctx, x, sy, sr, '#ffffff', '#aab1b8', '#4f555c');
  ctx.strokeStyle = '#3b4046';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(x, sy, sr, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(223,243,255,${charge})`;
  ctx.lineWidth = 1.3;
  for (let a = 0; a < 2 + level; a++) {
    const ang = time * 7 + a * 2.1;
    const len = 9 + Math.sin(time * 23 + a) * 4;
    const ex = x + Math.cos(ang) * (sr + len);
    const ey = sy + Math.sin(ang) * (sr + len) * 0.8;
    jaggedPath(ctx, x + Math.cos(ang) * sr, sy + Math.sin(ang) * sr, ex, ey, 3, 5);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(ex, ey, 1, 0, Math.PI * 2);
    ctx.fill();
  }
  if (level >= 2) {
    // Secondary toroid and (tier 4) orbiting charge motes.
    ctx.strokeStyle = `rgba(126,200,255,${0.4 + charge * 0.3})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, sy + 2, sr + 6, 3, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (level >= 3) {
    ctx.fillStyle = 'rgba(223,243,255,0.9)';
    for (let m = 0; m < 4; m++) {
      const a = time * 4 + (m / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(x + Math.cos(a) * (sr + 9), sy + Math.sin(a) * 4, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// Flamethrower: riveted brass boiler on an iron skid, pressure gauge, valve
// wheel, fuel hose and a swivel-mounted nozzle that glows while firing.
const FLAME_NOZZLE_LEN = (level) => 15 + level * 1.5;

function drawFlameTower(ctx, spot, time, angle, firing, level) {
  const x = spot.x;
  const y = spot.y - 8;
  const flick = Math.sin(time * 23) * 0.5 + Math.sin(time * 37 + 1) * 0.5;

  // Ground shadow and iron skid.
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(x, y + 10, 16 + level, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3a3b40';
  ctx.strokeStyle = '#1f2024';
  ctx.lineWidth = 1;
  roundRect(ctx, x - 14 - level, y + 3, 28 + level * 2, 6, 2);
  ctx.fillStyle = '#26272b';
  ctx.fillRect(x - 12 - level, y + 8, 4, 3);
  ctx.fillRect(x + 8 + level, y + 8, 4, 3);

  // Side fuel tanks from tier 2, with a vertical brass gradient.
  if (level >= 1) {
    for (const sx of [x - 19 - level, x + 14 + level]) {
      const g = ctx.createLinearGradient(sx, 0, sx + 6, 0);
      g.addColorStop(0, '#6b4616');
      g.addColorStop(0.4, '#e2b25a');
      g.addColorStop(1, '#8a5e22');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#4a3010';
      ctx.lineWidth = 1;
      roundRect(ctx, sx, y - 7, 6, 13, 3);
      ctx.fillStyle = '#3a3b40';
      ctx.fillRect(sx + 1.5, y - 9, 3, 2.5); // cap
    }
  }

  // Main drum: cylindrical shading, end bands, rivets, specular streak.
  const w = 24 + level * 2;
  const h = 17 + level;
  const left = x - w / 2;
  const top = y - 11 - level;
  const brass = ctx.createLinearGradient(0, top, 0, top + h);
  brass.addColorStop(0, '#7a5520');
  brass.addColorStop(0.22, '#e4b45a');
  brass.addColorStop(0.42, '#f7dc92');
  brass.addColorStop(0.7, '#c98f36');
  brass.addColorStop(1, '#5e3c12');
  ctx.fillStyle = brass;
  ctx.strokeStyle = '#4a3010';
  ctx.lineWidth = 1.5;
  roundRect(ctx, left, top, w, h, 7);
  ctx.strokeStyle = 'rgba(70,45,15,0.75)';
  ctx.lineWidth = 2;
  for (const bx of [left + 6, left + w - 6]) {
    ctx.beginPath();
    ctx.moveTo(bx, top + 1);
    ctx.lineTo(bx, top + h - 1);
    ctx.stroke();
    for (const ry of [top + 4, top + h / 2, top + h - 4]) {
      ctx.fillStyle = '#4a3010';
      ctx.beginPath();
      ctx.arc(bx, ry, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe9b0';
      ctx.beginPath();
      ctx.arc(bx - 0.4, ry - 0.4, 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.strokeStyle = 'rgba(255,245,210,0.55)';
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(left + 9, top + 4);
  ctx.lineTo(left + w - 9, top + 4);
  ctx.stroke();
  // Soot staining toward the nozzle side.
  const soot = ctx.createLinearGradient(x, 0, x + w / 2, 0);
  soot.addColorStop(0, 'rgba(0,0,0,0)');
  soot.addColorStop(1, 'rgba(30,20,10,0.35)');
  ctx.fillStyle = soot;
  roundRectFill(ctx, left, top, w, h, 7);

  // Pressure gauge: bezel, dial, red zone, needle, glass highlight.
  const gx = left + w * 0.32;
  const gy = top + h * 0.56;
  ctx.fillStyle = '#2b2b30';
  ctx.beginPath();
  ctx.arc(gx, gy, 4.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f3ecd6';
  ctx.beginPath();
  ctx.arc(gx, gy, 3.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d9413a';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(gx, gy, 2.6, -0.4, 0.8);
  ctx.stroke();
  const needle = firing ? 0.3 + flick * 0.3 : -2.2 + Math.sin(time * 2) * 0.15;
  ctx.strokeStyle = '#1e1e22';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(gx, gy);
  ctx.lineTo(gx + Math.cos(needle) * 2.9, gy + Math.sin(needle) * 2.9);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.arc(gx - 1.1, gy - 1.3, 1.1, 0, Math.PI * 2);
  ctx.fill();

  // Valve wheel on top, spinning while fuel flows.
  const vx = left + w * 0.72;
  const vy = top - 3.5;
  ctx.strokeStyle = '#3b3b40';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(vx, top + 1);
  ctx.lineTo(vx, vy);
  ctx.stroke();
  ctx.strokeStyle = '#9b2626';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(vx, vy, 3.4, 0, Math.PI * 2);
  ctx.stroke();
  const spin = time * (firing ? 5 : 0.6);
  for (let k = 0; k < 3; k++) {
    const a = spin + (k * Math.PI * 2) / 3;
    ctx.beginPath();
    ctx.moveTo(vx, vy);
    ctx.lineTo(vx + Math.cos(a) * 3.4, vy + Math.sin(a) * 3.4);
    ctx.stroke();
  }

  // Fuel hose: a short loop from the valve down to the swivel.
  const sx = x;
  const sy = y - 4;
  ctx.strokeStyle = '#3a3330';
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(vx, top + 1);
  ctx.bezierCurveTo(vx + 7, top - 3 + Math.sin(time * 3) * 0.4, sx + 9, sy - 7, sx + 4, sy - 2);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(vx, top + 0.5);
  ctx.bezierCurveTo(vx + 7, top - 3.5 + Math.sin(time * 3) * 0.4, sx + 9, sy - 7.5, sx + 4, sy - 2.5);
  ctx.stroke();
  ctx.fillStyle = '#8a8d96';
  ctx.beginPath();
  ctx.arc(sx + 4, sy - 2, 1.1, 0, Math.PI * 2);
  ctx.fill();

  // Swivel mount.
  ctx.fillStyle = '#4b4d55';
  ctx.strokeStyle = '#202126';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(sx, sy + 1, 7.5 + level * 0.5, 4.6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#6f737d';
  ctx.beginPath();
  ctx.ellipse(sx, sy, 5.5 + level * 0.5, 3.2, 0, 0, Math.PI * 2);
  ctx.fill();

  // Nozzle barrels: twin barrels from tier 3.
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const px = -sin;
  const py = cos;
  const len = FLAME_NOZZLE_LEN(level);
  const barrels = level >= 2 ? [-2.4, 2.4] : [0];
  for (const off of barrels) {
    const bx0 = sx + px * off;
    const by0 = sy + py * off;
    const tx = bx0 + cos * len;
    const ty = by0 + sin * len;
    ctx.strokeStyle = '#2e3136';
    ctx.lineWidth = 5 + level * 0.5;
    ctx.beginPath();
    ctx.moveTo(bx0, by0);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    // Heat bands along the barrel.
    ctx.strokeStyle = firing ? 'rgba(255,120,40,0.7)' : 'rgba(110,115,125,0.9)';
    ctx.lineWidth = 1;
    for (const t of [0.45, 0.65, 0.85]) {
      const cx = bx0 + cos * len * t;
      const cy = by0 + sin * len * t;
      ctx.beginPath();
      ctx.moveTo(cx + px * 2.6, cy + py * 2.6);
      ctx.lineTo(cx - px * 2.6, cy - py * 2.6);
      ctx.stroke();
    }
    // Top highlight.
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(bx0 + cos * 3 - px * 1.4, by0 + sin * 3 - py * 1.4);
    ctx.lineTo(bx0 + cos * (len - 3) - px * 1.4, by0 + sin * (len - 3) - py * 1.4);
    ctx.stroke();
    // Bell mouth, glowing when hot.
    ctx.fillStyle = firing ? '#ff8a3a' : '#4a4e55';
    ctx.strokeStyle = '#1f2024';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(tx, ty, 3.4 + level * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = firing ? '#fff1c8' : '#1b1c20';
    ctx.beginPath();
    ctx.arc(tx, ty, 1.6 + level * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    if (firing) {
      const g = ctx.createRadialGradient(tx, ty, 0, tx, ty, 11 + level);
      g.addColorStop(0, `rgba(255,170,70,${0.55 + flick * 0.15})`);
      g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(tx, ty, 11 + level, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Pilot light: a small layered tongue licking off the mouth.
      drawFlameTongue(ctx, tx + cos * 2, ty + sin * 2, angle, 6 + flick * 1.2, 3.6, time, off);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // Tier 4: cooling fins and a glowing burner vent on the drum.
  if (level >= 3) {
    ctx.strokeStyle = '#2e3136';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 4; k++) {
      const fx = left + w * 0.48 + k * 2.6;
      ctx.beginPath();
      ctx.moveTo(fx, top - 1);
      ctx.lineTo(fx, top - 5);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = `rgba(255,120,40,${0.5 + flick * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(left + w * 0.52, top + h * 0.78, 4, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
}

// Fill-only rounded rect (no stroke) for overlays like soot.
function roundRectFill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
}

// A layered flame tongue pointing along `angle`: red sheath, orange body,
// yellow core, white heart, each shorter than the last and flickering.
function drawFlameTongue(ctx, x, y, angle, length, width, time, seed) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const layers = [
    [1.0, 1.0, 'rgba(255,70,20,0.55)'],
    [0.8, 0.8, 'rgba(255,140,40,0.8)'],
    [0.6, 0.6, 'rgba(255,215,110,0.9)'],
    [0.35, 0.4, 'rgba(255,250,225,0.95)'],
  ];
  for (const [ls, ws, color] of layers) {
    const L = length * ls * (1 + Math.sin(time * 21 + seed * 3) * 0.15);
    const W = width * ws;
    const wob = Math.sin(time * 15 + seed) * W * 0.4;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, -W);
    ctx.quadraticCurveTo(L * 0.6, -W * 0.9 + wob, L, wob * 0.5);
    ctx.quadraticCurveTo(L * 0.6, W * 0.9 + wob, 0, W);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// Continuous fire jet from each flamethrower to its target while it fires:
// four additive layers from a translucent red sheath to a white-hot core,
// with turbulence rolling along the stream and a heat bloom at the impact.
function drawFlameJets(ctx, game, time) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  game.towers.forEach((tower, i) => {
    if (!tower || tower.typeId !== 'flame' || !(tower.cooldown > 0) || tower.targetX === undefined) return;
    const spot = game.level.buildSpots[i];
    const level = tower.level;
    const angle = tower.angle ?? 0;
    const len = FLAME_NOZZLE_LEN(level);
    const ox = spot.x + Math.cos(angle) * len;
    const oy = spot.y - 12 + Math.sin(angle) * len;
    const dist = Math.hypot(tower.targetX - ox, tower.targetY - oy);
    const reach = Math.min(dist + 12, 120);
    const seed = i * 1.37;
    const baseW = 10 + level * 2.5;
    const layers = [
      [1.0, 1.0, 'rgba(255,45,10,0.22)'],
      [0.8, 0.96, 'rgba(255,110,25,0.36)'],
      [0.56, 0.86, 'rgba(255,185,60,0.42)'],
      [0.24, 0.55, 'rgba(255,240,200,0.5)'],
    ];
    ctx.save();
    ctx.translate(ox, oy);
    ctx.rotate(angle);
    const segs = 8;
    for (const [ws, ls, color] of layers) {
      const L = reach * ls;
      const upper = [];
      const lower = [];
      for (let k = 0; k <= segs; k++) {
        const t = k / segs;
        const sx = L * t;
        // The stream widens with distance and ripples as fuel pulses through.
        const w = (2.5 + baseW * Math.pow(t, 0.7) * (1 + Math.sin(time * 19 - t * 11 + seed) * 0.28)) * ws;
        const drift = Math.sin(time * 13 - t * 8 + seed) * 3.2 * t + Math.sin(time * 29 + t * 17) * 0.8 * t;
        upper.push([sx, -w + drift]);
        lower.push([sx, w + drift]);
      }
      ctx.fillStyle = color;
      ctx.beginPath();
      tracePolyline(ctx, upper, true);
      tracePolyline(ctx, lower.reverse(), false);
      ctx.closePath();
      ctx.fill();
    }
    // Hot sparks riding the stream.
    ctx.fillStyle = 'rgba(255,240,200,0.9)';
    for (let k = 0; k < 3 + level; k++) {
      const t = ((time * 2.2 + k * 0.31 + seed) % 1);
      const sx = reach * t;
      const sy = Math.sin(time * 13 - t * 8 + seed) * 3 * t + Math.sin(k * 7.3 + time * 9) * baseW * 0.5 * t;
      ctx.globalAlpha = 1 - t;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.1 + level * 0.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // Heat bloom where the stream lands and a warm ground light along it.
    const ex = ox + Math.cos(angle) * Math.min(dist, reach);
    const ey = oy + Math.sin(angle) * Math.min(dist, reach);
    const bloom = ctx.createRadialGradient(ex, ey, 0, ex, ey, 18 + level * 3);
    bloom.addColorStop(0, `rgba(255,170,80,${0.3 + Math.sin(time * 27 + seed) * 0.08})`);
    bloom.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(ex, ey, 18 + level * 3, 0, Math.PI * 2);
    ctx.fill();
    const light = ctx.createRadialGradient(ox, oy, 0, ox, oy, reach);
    light.addColorStop(0, 'rgba(255,150,60,0.12)');
    light.addColorStop(1, 'rgba(255,100,20,0)');
    ctx.fillStyle = light;
    ctx.beginPath();
    ctx.arc(ox, oy, reach, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// Smooth midpoint-curve through a point list, continuing the current path.
function tracePolyline(ctx, pts, start) {
  if (start) ctx.moveTo(pts[0][0], pts[0][1]);
  else ctx.lineTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length - 1; k++) {
    const mx = (pts[k][0] + pts[k + 1][0]) / 2;
    const my = (pts[k][1] + pts[k + 1][1]) / 2;
    ctx.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last[0], last[1]);
}

// --- Laser lance: obsidian pillar with a charging emitter ----------------------------

function drawLaserTower(ctx, spot, time, angle, multiplier, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 28 + level * 5;
  const hot = multiplier > 0 ? Math.min(1, 0.45 + (multiplier - 1) / 3) : 0.2 + Math.sin(time * 2) * 0.08;
  const pink = (a) => `rgba(255,79,216,${a})`;
  // Hex base plate with a glowing seam ring.
  ctx.fillStyle = domeGradient(ctx, x, y + 1, 14, '#4a4458', '#2b2634', '#15121b');
  ctx.strokeStyle = '#15121b';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2;
    ctx.lineTo(x + Math.cos(a) * (14 + level), y + 2 + Math.sin(a) * 6);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = pink(0.25 + hot * 0.4);
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 10 + level, 4.2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  // Pillar: glossy black with a vertical highlight.
  const body = ctx.createLinearGradient(x - 8, 0, x + 8, 0);
  body.addColorStop(0, '#15121b');
  body.addColorStop(0.35, '#3a3448');
  body.addColorStop(0.5, '#4a4458');
  body.addColorStop(1, '#15121b');
  ctx.fillStyle = body;
  ctx.strokeStyle = '#0d0b12';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 8 - level, y + 4);
  ctx.lineTo(x - 5, y - h);
  ctx.lineTo(x + 5, y - h);
  ctx.lineTo(x + 8 + level, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Capacitor cells: fill up from the bottom as the beam ramps.
  const cells = 4 + level;
  const filled = multiplier > 0 ? Math.round(((multiplier - 1) / 3) * cells) : 0;
  for (let c = 0; c < cells; c++) {
    const cy = y - 2 - c * ((h - 8) / cells);
    const lit = c < filled;
    ctx.globalCompositeOperation = lit ? 'lighter' : 'source-over';
    ctx.fillStyle = lit ? pink(0.85) : 'rgba(255,79,216,0.12)';
    ctx.fillRect(x - 1.6, cy - 2.2, 3.2, 2.6);
    if (lit) glowDisc(ctx, x, cy - 1, 5, pink(0.35));
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = pink(hot * 0.9);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 3.5, y + 2);
  ctx.lineTo(x - 3.5, y - h + 4);
  ctx.moveTo(x + 3.5, y + 2);
  ctx.lineTo(x + 3.5, y - h + 4);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  // Cooling fins that glow with heat.
  if (level >= 1) {
    for (const fy of [-10, -16, -22, -28].slice(0, 2 + level)) {
      ctx.strokeStyle = hot > 0.6 ? `rgba(255,${120 + (1 - hot) * 100},${160},0.9)` : '#5c5570';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - 10 - level, y + fy);
      ctx.lineTo(x - 5, y + fy);
      ctx.moveTo(x + 5, y + fy);
      ctx.lineTo(x + 10 + level, y + fy);
      ctx.stroke();
    }
  }
  // Emitter head: swivel ring, lens assembly, barrel with focusing rings.
  const hy = y - h - 5;
  ctx.fillStyle = domeGradient(ctx, x, hy, 8 + level, '#8a7fa0', '#4a4458', '#1b1724');
  ctx.strokeStyle = '#0d0b12';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(x, hy, 8 + level, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const px = -sin;
  const py = cos;
  const bl = 12 + level * 1.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1b1724';
  ctx.lineWidth = 6 + level;
  ctx.beginPath();
  ctx.moveTo(x, hy);
  ctx.lineTo(x + cos * bl, hy + sin * bl);
  ctx.stroke();
  ctx.strokeStyle = '#6d6383';
  ctx.lineWidth = 4 + level;
  ctx.beginPath();
  ctx.moveTo(x, hy);
  ctx.lineTo(x + cos * bl, hy + sin * bl);
  ctx.stroke();
  ctx.strokeStyle = pink(0.6 + hot * 0.4);
  ctx.lineWidth = 1;
  for (const t of [0.4, 0.65, 0.9]) {
    const cx = x + cos * bl * t;
    const cy = hy + sin * bl * t;
    ctx.beginPath();
    ctx.moveTo(cx + px * (2.6 + level * 0.5), cy + py * (2.6 + level * 0.5));
    ctx.lineTo(cx - px * (2.6 + level * 0.5), cy - py * (2.6 + level * 0.5));
    ctx.stroke();
  }
  // Lens: concentric glow that intensifies with heat, plus a lens flare cross.
  const lx = x + cos * (bl + 1);
  const ly = hy + sin * (bl + 1);
  ctx.globalCompositeOperation = 'lighter';
  glowDisc(ctx, lx, ly, 6 + hot * 8, pink(0.35 + hot * 0.4));
  ctx.fillStyle = `rgba(255,${180 + hot * 75},${236},${0.7 + hot * 0.3})`;
  ctx.beginPath();
  ctx.arc(lx, ly, 2 + hot * 2, 0, Math.PI * 2);
  ctx.fill();
  if (multiplier > 0) {
    ctx.strokeStyle = `rgba(255,255,255,${0.3 + hot * 0.5})`;
    ctx.lineWidth = 1;
    const fl = 5 + hot * 7;
    ctx.beginPath();
    ctx.moveTo(lx - fl, ly);
    ctx.lineTo(lx + fl, ly);
    ctx.moveTo(lx, ly - fl);
    ctx.lineTo(lx, ly + fl);
    ctx.stroke();
  }
  // Holographic targeting ring spinning around the head.
  ctx.strokeStyle = pink(0.3 + hot * 0.3);
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.lineDashOffset = -time * 20;
  ctx.beginPath();
  ctx.ellipse(x, hy, 13 + level * 2, 4.5, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = 'source-over';
}

// --- Mortar: sandbagged emplacement ----------------------------------------------

function drawMortarTower(ctx, spot, time, angle, cooldownFrac, level) {
  const x = spot.x;
  const y = spot.y;
  // Dug-in earth and a ring of stitched sandbags, two courses high at tier 3+.
  ctx.fillStyle = 'rgba(70,55,35,0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 3, 15 + level, 8 + level * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  const bags = 9 + level;
  for (let course = 0; course < (level >= 2 ? 2 : 1); course++) {
    for (let i = 0; i < bags; i++) {
      const a = (i / bags) * Math.PI * 2 + course * 0.35;
      const bx = x + Math.cos(a) * (13 + level - course * 1.5);
      const by = y + 3 + Math.sin(a) * (6.5 + level * 0.5) - course * 3.5;
      if (course === 1 && Math.sin(a) < -0.2) continue; // keep the rear open for the tube
      const g = ctx.createLinearGradient(bx, by - 3, bx, by + 3);
      g.addColorStop(0, '#d2bb88');
      g.addColorStop(1, '#8e7a52');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#6a5a3c';
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.ellipse(bx, by, 5.2, 3, a, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = 'rgba(106,90,60,0.6)';
      ctx.beginPath();
      ctx.moveTo(bx - Math.cos(a) * 3.5, by - Math.sin(a) * 2);
      ctx.lineTo(bx + Math.cos(a) * 3.5, by + Math.sin(a) * 2);
      ctx.stroke();
    }
  }
  // Steel baseplate with bolts and bipod legs.
  ctx.fillStyle = domeGradient(ctx, x, y - 1, 10, '#6d747b', '#4a4f55', '#2a2e33');
  ctx.strokeStyle = '#1f2327';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(x, y, 9.5 + level, 4.8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#8a9198';
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * (7 + level), y + Math.sin(a) * 3.2, 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  const recoil = Math.max(0, (cooldownFrac - 0.8) / 0.2) * 3;
  const len = 19 + level * 2 - recoil;
  const dx = Math.cos(angle) * 0.55;
  const dy = -0.85;
  ctx.strokeStyle = '#3a3f45';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + dx * 9 - 7, y - 2 + dy * 9 + 6);
  ctx.lineTo(x + dx * 9, y - 2 + dy * 9);
  ctx.lineTo(x + dx * 9 + 7, y - 2 + dy * 9 + 6);
  ctx.stroke();
  // Tube: fat, dark, with a reinforced breech, a muzzle collar, and a hot bore after firing.
  const w = 9 + level;
  const tx = x + dx * len;
  const ty = y - 2 + dy * len;
  ctx.strokeStyle = '#1f2327';
  ctx.lineWidth = w + 2;
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.strokeStyle = '#3a3f45';
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x - 2.5, y - 4);
  ctx.lineTo(tx - 2.5, ty - 1);
  ctx.stroke();
  ctx.strokeStyle = '#15181b';
  ctx.lineWidth = w + 3;
  ctx.lineCap = 'butt';
  for (const t of [0.15, 0.92]) {
    ctx.beginPath();
    ctx.moveTo(x + dx * len * t, y - 2 + dy * len * t);
    ctx.lineTo(x + dx * len * (t + 0.05), y - 2 + dy * len * (t + 0.05));
    ctx.stroke();
  }
  // Bore: dark ellipse, glowing right after a shot.
  ctx.fillStyle = cooldownFrac > 0.8 ? `rgba(255,120,40,${(cooldownFrac - 0.8) * 4})` : '#0f1113';
  ctx.beginPath();
  ctx.ellipse(tx, ty, w * 0.42, w * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Sight bracket.
  ctx.strokeStyle = '#8a9198';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + dx * 12 + 4, y - 2 + dy * 12);
  ctx.lineTo(x + dx * 12 + 7, y - 2 + dy * 12 - 3);
  ctx.stroke();
  // Lingering muzzle smoke.
  if (cooldownFrac > 0.6) {
    const k = (cooldownFrac - 0.6) / 0.4;
    ctx.fillStyle = `rgba(160,160,160,${k * 0.6})`;
    ctx.beginPath();
    ctx.arc(tx + dx * 6, ty + dy * 6 - (1 - k) * 22, 5 + (1 - k) * 14, 0, Math.PI * 2);
    ctx.fill();
  }
  // Shell crate with brass-tipped rounds and a stacked spare.
  const cx = x + 10 + level;
  ctx.fillStyle = cylinderGradient(ctx, cx, cx + 10, '#4e3620', '#8a6236', '#6b4a2b');
  ctx.strokeStyle = '#3f2e1a';
  ctx.lineWidth = 1;
  ctx.fillRect(cx, y - 3, 10, 8);
  ctx.strokeRect(cx, y - 3, 10, 8);
  ctx.strokeStyle = 'rgba(63,46,26,0.7)';
  ctx.beginPath();
  ctx.moveTo(cx, y + 1);
  ctx.lineTo(cx + 10, y + 1);
  ctx.stroke();
  for (const sx of [2.5, 5, 7.5]) {
    ctx.fillStyle = '#2f3338';
    ctx.beginPath();
    ctx.arc(cx + sx, y - 5, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e2b84a';
    ctx.beginPath();
    ctx.arc(cx + sx, y - 5.4, 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  if (level >= 1) {
    ctx.fillStyle = '#2f3338';
    ctx.beginPath();
    ctx.ellipse(x - 12 - level, y + 1, 4.5, 1.8, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e2b84a';
    ctx.beginPath();
    ctx.arc(x - 8 - level, y + 0.2, 1, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Sniper nest: iron-banded mast with a hooded marksman -------------------------

function drawSniperTower(ctx, spot, time, angle, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 42 + level * 5;
  const nestY = y - h + 4;
  // Stone footing and guy ropes.
  ctx.fillStyle = domeGradient(ctx, x, y, 11, '#b4bbc2', '#9aa1a8', '#6b7178');
  ctx.strokeStyle = '#5c6268';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(x, y + 1, 11 + level, 4.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(120,100,70,0.7)';
  ctx.lineWidth = 0.8;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * 3, y - h + 14);
    ctx.lineTo(x + side * (16 + level), y + 3);
    ctx.stroke();
    ctx.fillStyle = '#5a4322';
    ctx.beginPath();
    ctx.arc(x + side * (16 + level), y + 3, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // Timber mast: two poles with grain, cross braces, and iron bands.
  for (const side of [-1, 1]) {
    ctx.strokeStyle = '#5a4322';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + side * 8, y + 2);
    ctx.lineTo(x + side * 4.5, nestY + 6);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,220,160,0.22)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x + side * 8 - 0.8, y + 1);
    ctx.lineTo(x + side * 4.5 - 0.8, nestY + 6);
    ctx.stroke();
  }
  ctx.strokeStyle = '#5a4322';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let b = 0; b < 4; b++) {
    const t0 = b / 4;
    const t1 = (b + 1) / 4;
    const w0 = 8 - 3.5 * t0;
    const w1 = 8 - 3.5 * t1;
    const y0 = y + 2 + (nestY + 6 - y - 2) * t0;
    const y1 = y + 2 + (nestY + 6 - y - 2) * t1;
    ctx.moveTo(x - w0, y0);
    ctx.lineTo(x + w1, y1);
    ctx.moveTo(x + w0, y0);
    ctx.lineTo(x - w1, y1);
  }
  ctx.stroke();
  ctx.strokeStyle = '#3b3b40';
  ctx.lineWidth = 2;
  for (let b = 1; b < 4; b++) {
    const t = b / 4;
    const w = 8 - 3.5 * t;
    const by = y + 2 + (nestY + 6 - y - 2) * t;
    ctx.beginPath();
    ctx.moveTo(x - w - 1, by);
    ctx.lineTo(x + w + 1, by);
    ctx.stroke();
  }
  // Rope ladder up one side.
  ctx.strokeStyle = 'rgba(200,170,120,0.8)';
  ctx.lineWidth = 0.7;
  for (let r = 0; r < 6; r++) {
    const t = (r + 0.5) / 6;
    const by = y + 2 + (nestY + 6 - y - 2) * t;
    ctx.beginPath();
    ctx.moveTo(x - 1.5, by);
    ctx.lineTo(x + 1.5, by);
    ctx.stroke();
  }
  // Crow's nest: barrel-stave basket with shadow beneath.
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(x, nestY + 8, 11, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  const nest = ctx.createLinearGradient(x - 11, 0, x + 11, 0);
  nest.addColorStop(0, '#6a4e26');
  nest.addColorStop(0.5, '#a3804a');
  nest.addColorStop(1, '#6a4e26');
  ctx.fillStyle = nest;
  ctx.strokeStyle = '#4e3a1c';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 11, nestY - 2);
  ctx.lineTo(x - 9, nestY + 7);
  ctx.lineTo(x + 9, nestY + 7);
  ctx.lineTo(x + 11, nestY - 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(78,58,28,0.6)';
  ctx.lineWidth = 0.8;
  for (let sx = -8; sx <= 8; sx += 4) {
    ctx.beginPath();
    ctx.moveTo(x + sx, nestY - 2);
    ctx.lineTo(x + sx * 0.85, nestY + 7);
    ctx.stroke();
  }
  ctx.strokeStyle = '#3b3b40';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x - 11, nestY - 1);
  ctx.lineTo(x + 11, nestY - 1);
  ctx.moveTo(x - 9.5, nestY + 5);
  ctx.lineTo(x + 9.5, nestY + 5);
  ctx.stroke();
  // Marksman: hooded cloak, hat, rifle with scope and bipod, swung to the target.
  const my = nestY - 6;
  const cloak = ['#2e4a2a', '#2a4a5a', '#4a3a2a', '#1f2a3a'][level];
  ctx.fillStyle = cloak;
  ctx.beginPath();
  ctx.moveTo(x - 4, nestY - 1);
  ctx.lineTo(x - 3, my - 1);
  ctx.lineTo(x + 3, my - 1);
  ctx.lineTo(x + 4, nestY - 1);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e7c9a3';
  ctx.beginPath();
  ctx.arc(x, my - 2.5, 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3b2f1e';
  ctx.beginPath();
  ctx.ellipse(x, my - 4.5, 4.2, 1.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(x - 2.2, my - 7.5, 4.4, 3.2);
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);
  const px = -sin;
  const py = cos;
  const rl = 20 + level * 2;
  const kick = justFired ? 2 : 0;
  const rx = x - cos * kick;
  const ry = my - 3 - sin * kick;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#4a3a22';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(rx - cos * 5, ry - sin * 5);
  ctx.lineTo(rx + cos * 6, ry + sin * 6);
  ctx.stroke();
  ctx.strokeStyle = '#1f2327';
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(rx, ry);
  ctx.lineTo(rx + cos * rl, ry + sin * rl);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(rx + cos * 4 - px * 0.7, ry + sin * 4 - py * 0.7);
  ctx.lineTo(rx + cos * (rl - 2) - px * 0.7, ry + sin * (rl - 2) - py * 0.7);
  ctx.stroke();
  // Scope and bipod.
  ctx.strokeStyle = '#2f3338';
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(rx + cos * 5 - px * 2.4, ry + sin * 5 - py * 2.4);
  ctx.lineTo(rx + cos * 11 - px * 2.4, ry + sin * 11 - py * 2.4);
  ctx.stroke();
  ctx.strokeStyle = '#1f2327';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(rx + cos * (rl - 5), ry + sin * (rl - 5));
  ctx.lineTo(rx + cos * (rl - 5) + px * 4, ry + sin * (rl - 5) + py * 4 + 2);
  ctx.moveTo(rx + cos * (rl - 5), ry + sin * (rl - 5));
  ctx.lineTo(rx + cos * (rl - 5) - px * 4, ry + sin * (rl - 5) - py * 4 + 2);
  ctx.stroke();
  // Scope glint: a sweeping lens flare.
  const glint = 0.5 + Math.sin(time * 5) * 0.3 + (justFired ? 0.5 : 0);
  const gx = rx + cos * 11 - px * 2.4;
  const gy = ry + sin * 11 - py * 2.4;
  ctx.globalCompositeOperation = 'lighter';
  glowDisc(ctx, gx, gy, 4, `rgba(200,255,220,${glint * 0.6})`);
  ctx.strokeStyle = `rgba(230,255,240,${glint})`;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(gx - 3.5, gy);
  ctx.lineTo(gx + 3.5, gy);
  ctx.moveTo(gx, gy - 3.5);
  ctx.lineTo(gx, gy + 3.5);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  // Canopy with a stitched hem, and a pennant.
  const canopy = ['#4a6b3a', '#3f7a3a', '#2e8a4a', '#1f9a5a'][level];
  const cg = ctx.createLinearGradient(x - 14, 0, x + 14, 0);
  cg.addColorStop(0, '#2a3f22');
  cg.addColorStop(0.5, canopy);
  cg.addColorStop(1, '#2a3f22');
  ctx.fillStyle = cg;
  ctx.strokeStyle = '#1f2f1a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 14, my - 9);
  ctx.quadraticCurveTo(x, my - 24, x + 14, my - 9);
  ctx.quadraticCurveTo(x, my - 12, x - 14, my - 9);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.setLineDash([1.5, 2]);
  ctx.beginPath();
  ctx.moveTo(x - 13, my - 9.5);
  ctx.quadraticCurveTo(x, my - 12.5, x + 13, my - 9.5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = '#5a4322';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x, my - 16.5);
  ctx.lineTo(x, my - 24);
  ctx.stroke();
  ctx.fillStyle = level >= 3 ? '#ffd700' : '#e8e2d4';
  ctx.beginPath();
  ctx.moveTo(x, my - 24);
  ctx.lineTo(x + 7 + Math.sin(time * 4) * 1.5, my - 22 + Math.sin(time * 6) * 1);
  ctx.lineTo(x, my - 20);
  ctx.closePath();
  ctx.fill();
}

// --- Venom spitter: carnivorous plant --------------------------------------------

function drawVenomTower(ctx, spot, time, angle, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const r = 12 + level * 1.5;
  const pulse = 1 + Math.sin(time * 4) * 0.04 + (justFired ? 0.08 : 0);
  const cx = x;
  const cy = y - r * 0.6;
  // Mossy mound and writhing root tendrils.
  ctx.fillStyle = domeGradient(ctx, x, y + 1, 14, '#6f8f45', '#52703a', '#36502a');
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 14 + level, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#3f5a2a';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  for (let t = 0; t < 5 + level; t++) {
    const a = (t / (5 + level)) * Math.PI * 2 + 0.3;
    const wig = Math.sin(time * 2 + t) * 2.5;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * 6, y + 2 + Math.sin(a) * 2);
    ctx.quadraticCurveTo(x + Math.cos(a) * 13 + wig, y + 2 + Math.sin(a) * 6 - 3, x + Math.cos(a) * (18 + level) + wig, y + 2 + Math.sin(a) * 8);
    ctx.stroke();
    // Thorns along the tendril.
    ctx.fillStyle = '#2f5a1a';
    ctx.beginPath();
    const tx = x + Math.cos(a) * 14 + wig * 0.7;
    const ty = y + 2 + Math.sin(a) * 6 - 1;
    ctx.moveTo(tx - 1.2, ty);
    ctx.lineTo(tx, ty - 3);
    ctx.lineTo(tx + 1.2, ty);
    ctx.closePath();
    ctx.fill();
  }
  // Leaves with midribs.
  for (let lf = 0; lf < 5 + level; lf++) {
    const a = (lf / (5 + level)) * Math.PI * 2 + 0.9;
    const lx = x + Math.cos(a) * (15 + level);
    const ly = y + 1 + Math.sin(a) * 7;
    const lg = ctx.createLinearGradient(x, y, lx, ly);
    lg.addColorStop(0, '#2f5a1a');
    lg.addColorStop(1, '#6fae3a');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * 4, y + 1 + Math.sin(a) * 2);
    ctx.quadraticCurveTo(lx - Math.sin(a) * 5, ly + Math.cos(a) * 3, lx, ly);
    ctx.quadraticCurveTo(lx + Math.sin(a) * 5, ly - Math.cos(a) * 3, x + Math.cos(a) * 4, y + 1 + Math.sin(a) * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,60,15,0.5)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * 4, y + 1 + Math.sin(a) * 2);
    ctx.lineTo(lx, ly);
    ctx.stroke();
  }
  // Pod: bulbous, shaded, pulsing, with veins and glowing sacs.
  const podBase = ['#6fae3a', '#63a634', '#58a02e', '#4c9a28'][level];
  ctx.fillStyle = domeGradient(ctx, cx, cy, r, '#b7e07a', podBase, '#2f5a1a');
  ctx.strokeStyle = '#2f5a1a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(cx, cy, r * pulse, r * 0.85 * pulse, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(47,90,26,0.55)';
  ctx.lineWidth = 1;
  for (let v = 0; v < 4 + level; v++) {
    const a = (v / (4 + level)) * Math.PI * 2 + 0.4 + Math.sin(time * 3 + v) * 0.05;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.2);
    ctx.quadraticCurveTo(cx + Math.cos(a) * r * 0.6, cy + Math.sin(a) * r * 0.8, cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.75);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (let s = 0; s < 1 + Math.min(level, 2); s++) {
    const sa = 2.4 + s * 1.3;
    const sx = cx + Math.cos(sa) * r * 0.45;
    const sy = cy + Math.sin(sa) * r * 0.4;
    glowDisc(ctx, sx, sy, r * 0.42, `rgba(198,255,107,${0.5 + Math.sin(time * 6 + s) * 0.2})`);
  }
  ctx.globalCompositeOperation = 'source-over';
  // Spines along the pod's crown.
  ctx.fillStyle = '#2f5a1a';
  for (let sp = 0; sp < 5; sp++) {
    const a = Math.PI + (sp / 4) * Math.PI;
    const sx = cx + Math.cos(a) * r * 0.9;
    const sy = cy + Math.sin(a) * r * 0.75;
    ctx.beginPath();
    ctx.moveTo(sx + Math.sin(a) * 1.5, sy - Math.cos(a) * 1.5);
    ctx.lineTo(sx + Math.cos(a) * 4, sy + Math.sin(a) * 3.5);
    ctx.lineTo(sx - Math.sin(a) * 1.5, sy + Math.cos(a) * 1.5);
    ctx.closePath();
    ctx.fill();
  }
  // Maw aimed at the target: lips, teeth, glowing throat, dripping ichor.
  const heads = level >= 3 ? [0, -0.5, 0.5] : [0];
  for (const off of heads) {
    const ma = angle + off;
    const scale = off === 0 ? 1 : 0.65;
    const mx = cx + Math.cos(ma) * r * 0.8;
    const my = cy + Math.sin(ma) * r * 0.6;
    const open = (justFired ? 1.4 : 1) * scale;
    ctx.fillStyle = '#2f5a1a';
    ctx.beginPath();
    ctx.ellipse(mx, my, (4.5 + level * 0.5) * open, 3.2 * open, ma, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    glowDisc(ctx, mx, my, 5 * open, 'rgba(143,211,58,0.5)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1b3a0e';
    ctx.beginPath();
    ctx.ellipse(mx, my, 2.6 * open, 1.6 * open, ma, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#eef7d8';
    for (let t = -1; t <= 1; t += 2) {
      const tx = mx + Math.cos(ma + t * 1.2) * 2.8 * open;
      const ty = my + Math.sin(ma + t * 1.2) * 2.2 * open;
      ctx.beginPath();
      ctx.moveTo(tx - 0.8, ty - 0.8);
      ctx.lineTo(tx + Math.cos(ma) * 1.5, ty + Math.sin(ma) * 1.5);
      ctx.lineTo(tx + 0.8, ty + 0.8);
      ctx.closePath();
      ctx.fill();
    }
    // Ichor string hanging from the lower lip.
    ctx.strokeStyle = 'rgba(143,211,58,0.8)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(mx, my + 2.5 * open);
    ctx.quadraticCurveTo(mx + 0.5, my + 5 * open, mx + Math.sin(time * 5) * 0.6, my + (6 + Math.sin(time * 3) * 1.5) * open);
    ctx.stroke();
  }
}

// --- War beacon: rune-inlaid brazier ----------------------------------------------

function drawBeaconTower(ctx, spot, time, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 20 + level * 3;
  const bowlY = y - h;
  // Rotating light rays on the ground.
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 6; k++) {
    const a = time * 0.4 + (k / 6) * Math.PI * 2;
    const g = ctx.createLinearGradient(x, y, x + Math.cos(a) * 26, y + Math.sin(a) * 12);
    g.addColorStop(0, 'rgba(255,209,102,0.18)');
    g.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a - 0.18) * (26 + level * 3), y + Math.sin(a - 0.18) * (12 + level));
    ctx.lineTo(x + Math.cos(a + 0.18) * (26 + level * 3), y + Math.sin(a + 0.18) * (12 + level));
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  // Stepped stone pedestal with gold rune inlays.
  ctx.fillStyle = domeGradient(ctx, x, y + 1, 13, '#a3a9b1', '#7d848c', '#4a4f55');
  ctx.strokeStyle = '#4a4f55';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 13 + level, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  const ped = ctx.createLinearGradient(x - 7, 0, x + 7, 0);
  ped.addColorStop(0, '#4a4f55');
  ped.addColorStop(0.45, '#9aa1a8');
  ped.addColorStop(1, '#4a4f55');
  ctx.fillStyle = ped;
  ctx.beginPath();
  ctx.moveTo(x - 7, y + 3);
  ctx.lineTo(x - 5, bowlY + 10);
  ctx.lineTo(x + 5, bowlY + 10);
  ctx.lineTo(x + 7, y + 3);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(255,209,102,${0.6 + Math.sin(time * 3) * 0.25})`;
  ctx.lineWidth = 1;
  for (let r = 0; r < 3; r++) {
    const ry = y - 2 - r * ((h - 14) / 3);
    ctx.beginPath();
    ctx.moveTo(x - 2, ry);
    ctx.lineTo(x, ry - 2.5);
    ctx.lineTo(x + 2, ry);
    ctx.lineTo(x, ry + 2.5);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  // Bowl: bronze with a bright rim and a rune band.
  const bowl = ctx.createLinearGradient(x - 12, 0, x + 12, 0);
  bowl.addColorStop(0, '#5a3c14');
  bowl.addColorStop(0.4, '#c98f36');
  bowl.addColorStop(0.55, '#e4b45a');
  bowl.addColorStop(1, '#5a3c14');
  ctx.fillStyle = bowl;
  ctx.strokeStyle = '#3f2a10';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 12 - level, bowlY);
  ctx.quadraticCurveTo(x, bowlY + 16, x + 12 + level, bowlY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#2b1d0a';
  ctx.beginPath();
  ctx.ellipse(x, bowlY, 12 + level, 3.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffd98a';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.ellipse(x, bowlY, 12 + level, 3.2, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Embers glowing in the bowl.
  ctx.globalCompositeOperation = 'lighter';
  glowDisc(ctx, x, bowlY, 9 + level, `rgba(255,140,51,${0.6 + Math.sin(time * 7) * 0.2})`);
  // Layered flames using the shared tongue helper, leaning in the breeze.
  const n = 3 + level;
  for (let f = 0; f < n; f++) {
    const fx = x + (f - (n - 1) / 2) * 4;
    const lean = Math.sin(time * 5 + f) * 0.25;
    const fh = (12 + level * 3) * (0.8 + Math.sin(time * 9 + f * 1.7) * 0.25) * (f === Math.floor(n / 2) ? 1.3 : 1);
    drawFlameTongue(ctx, fx, bowlY - 1, -Math.PI / 2 + lean, fh, 3.6, time, f * 1.7);
  }
  glowDisc(ctx, x, bowlY - 8, 20 + level * 3, `rgba(255,209,102,${0.2 + Math.sin(time * 3) * 0.06})`);
  // Rotating rune ring above the flame.
  ctx.strokeStyle = 'rgba(255,209,102,0.55)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([3, 4]);
  ctx.lineDashOffset = -time * 16;
  ctx.beginPath();
  ctx.ellipse(x, bowlY - 14 - level * 2, 15 + level * 2, 5, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalCompositeOperation = 'source-over';
  // Banners on poles from tier 2.
  if (level >= 1) {
    for (const side of [-1, 1]) {
      const bx = x + side * (15 + level);
      ctx.strokeStyle = '#5a4322';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(bx, y + 2);
      ctx.lineTo(bx, y - 24 - level * 2);
      ctx.stroke();
      ctx.fillStyle = level >= 3 ? '#b8323a' : '#c98f36';
      ctx.beginPath();
      ctx.moveTo(bx, y - 24 - level * 2);
      ctx.lineTo(bx + side * 7, y - 22 - level * 2 + Math.sin(time * 5 + side) * 1.5);
      ctx.lineTo(bx + side * 6, y - 12 + Math.sin(time * 5 + side + 1) * 1.5);
      ctx.lineTo(bx, y - 12);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffd98a';
      ctx.beginPath();
      ctx.arc(bx + side * 3.5, y - 17 - level, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// Beacon auras: pulsing rings, flowing golden links to every empowered tower
// and a small floating rune over each one.
function drawBeaconAuras(ctx, game, time) {
  ctx.globalCompositeOperation = 'lighter';
  game.towers.forEach((beacon, b) => {
    if (!beacon || beacon.typeId !== 'beacon') return;
    const stats = game.towerStats(beacon);
    const from = game.level.buildSpots[b];
    for (let k = 0; k < 2; k++) {
      const pulse = ((time * 0.5 + b * 0.3 + k * 0.5) % 1);
      ctx.strokeStyle = `rgba(255,209,102,${0.35 * (1 - pulse)})`;
      ctx.lineWidth = 2.5 * (1 - pulse) + 0.5;
      ctx.beginPath();
      ctx.ellipse(from.x, from.y, stats.range * pulse, stats.range * pulse * 0.92, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,209,102,0.14)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 8]);
    ctx.lineDashOffset = time * 10;
    ctx.beginPath();
    ctx.arc(from.x, from.y, stats.range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    game.towers.forEach((tower, i) => {
      if (!tower || i === b || (tower.boost || 1) <= 1) return;
      const to = game.level.buildSpots[i];
      if (Math.hypot(to.x - from.x, to.y - from.y) > stats.range) return;
      const x0 = from.x;
      const y0 = from.y - 22;
      const x1 = to.x;
      const y1 = to.y - 12;
      const mx = (x0 + x1) / 2;
      const my = (y0 + y1) / 2 - 18;
      ctx.strokeStyle = `rgba(255,209,102,${0.16 + Math.sin(time * 4 + i) * 0.06})`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 7]);
      ctx.lineDashOffset = -time * 40;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo(mx, my, x1, y1);
      ctx.stroke();
      ctx.setLineDash([]);
      // Motes flowing along the arc.
      for (let m = 0; m < 3; m++) {
        const t = ((time * 0.5 + m / 3 + i * 0.17) % 1);
        const px = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1;
        const py = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * my + t * t * y1;
        glowDisc(ctx, px, py, 4, 'rgba(255,230,150,0.6)');
      }
      // Floating rune above the boosted tower.
      const ry = to.y - 46 + Math.sin(time * 3 + i) * 2;
      ctx.strokeStyle = 'rgba(255,220,120,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(to.x - 3, ry);
      ctx.lineTo(to.x, ry - 4);
      ctx.lineTo(to.x + 3, ry);
      ctx.lineTo(to.x, ry + 4);
      ctx.closePath();
      ctx.stroke();
      glowDisc(ctx, to.x, ry, 7, 'rgba(255,209,102,0.35)');
    });
  });
  ctx.globalCompositeOperation = 'source-over';
}

// Laser beams: wide glow, hot core, pulses racing along the beam, and a
// flaring impact with lens-flare spikes that grow as the beam ramps up.
function drawBeams(ctx, game, time) {
  ctx.globalCompositeOperation = 'lighter';
  game.towers.forEach((tower, i) => {
    if (!tower || !tower.beamTargetId) return;
    const target = game.enemies.find((e) => e.id === tower.beamTargetId && e.alive);
    if (!target) return;
    const spot = game.level.buildSpots[i];
    const pos = game.path.positionAt(target.dist);
    const h = 28 + tower.level * 5 + 5;
    const mult = game.beamMultiplier(tower);
    const stats = game.towerStats(tower);
    const heat = stats.rampMultiplier > 1 ? (mult - 1) / (stats.rampMultiplier - 1) : 1;
    const bl = 12 + tower.level * 1.5 + 1;
    const sx = spot.x + Math.cos(tower.angle) * bl;
    const sy = spot.y - h + Math.sin(tower.angle) * bl;
    const dx = pos.x - sx;
    const dy = pos.y - sy;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    ctx.lineCap = 'round';
    // Outer haze, mid glow, core.
    ctx.strokeStyle = `rgba(255,79,216,${0.12 + heat * 0.12})`;
    ctx.lineWidth = 14 + heat * 10;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255,79,216,${0.3 + heat * 0.3})`;
    ctx.lineWidth = 5 + heat * 5 + Math.sin(time * 30) * 1.2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    ctx.strokeStyle = heat > 0.8 ? '#ffffff' : '#ffb3ec';
    ctx.lineWidth = 1.5 + heat * 1.8;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    // Pulses travelling toward the target.
    for (let k = 0; k < 3 + tower.level; k++) {
      const t = ((time * (1.6 + heat) + k / (3 + tower.level)) % 1);
      glowDisc(ctx, sx + ux * len * t, sy + uy * len * t, 4 + heat * 3, 'rgba(255,255,255,0.7)');
    }
    // Impact: flare disc, lens-flare spikes, and a heat ring at full power.
    glowDisc(ctx, pos.x, pos.y, 10 + heat * 10, `rgba(255,120,230,${0.5 + heat * 0.3})`);
    ctx.fillStyle = `rgba(255,255,255,${0.6 + heat * 0.4})`;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 2.5 + heat * 3 + Math.sin(time * 40), 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(255,255,255,${0.35 + heat * 0.45})`;
    ctx.lineWidth = 1;
    const spike = 6 + heat * 12;
    const rot = time * 1.5;
    for (let k = 0; k < 4; k++) {
      const a = rot + (k / 4) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(pos.x - Math.cos(a) * spike, pos.y - Math.sin(a) * spike);
      ctx.lineTo(pos.x + Math.cos(a) * spike, pos.y + Math.sin(a) * spike);
      ctx.stroke();
    }
    if (heat > 0.6) {
      const ring = ((time * 2) % 1);
      ctx.strokeStyle = `rgba(255,79,216,${(1 - ring) * 0.6 * heat})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 6 + ring * 18, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
  ctx.globalCompositeOperation = 'source-over';
}

// Chain lightning: jagged main bolts with branching forks, glow, and flares
// at every strike point.
function drawBolts(ctx, bolts) {
  ctx.globalCompositeOperation = 'lighter';
  for (const bolt of bolts) {
    const frac = Math.max(0, bolt.life / bolt.maxLife);
    ctx.globalAlpha = frac;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (let i = 0; i < bolt.points.length - 1; i++) {
      const a = bolt.points[i];
      const b = bolt.points[i + 1];
      // Glow pass, then core pass, each with its own jitter so the bolt shimmers.
      ctx.strokeStyle = 'rgba(126,200,255,0.5)';
      ctx.lineWidth = 9;
      jaggedPath(ctx, a.x, a.y, b.x, b.y, 7, 10);
      ctx.strokeStyle = '#7ec8ff';
      ctx.lineWidth = 3.5;
      const pts = jaggedPath(ctx, a.x, a.y, b.x, b.y, 7, 12);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      pts.forEach((p, k) => (k === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
      ctx.stroke();
      // Forks off a couple of interior vertices.
      ctx.strokeStyle = 'rgba(223,243,255,0.8)';
      ctx.lineWidth = 1;
      for (let f = 2; f < pts.length - 1; f += 3) {
        const p = pts[f];
        const ang = Math.atan2(b.y - a.y, b.x - a.x) + (f % 2 ? 0.9 : -0.9);
        const fl = 8 + Math.random() * 10;
        jaggedPath(ctx, p.x, p.y, p.x + Math.cos(ang) * fl, p.y + Math.sin(ang) * fl, 3, 5);
      }
    }
    for (const p of bolt.points.slice(1)) {
      glowDisc(ctx, p.x, p.y, 12, 'rgba(126,200,255,0.6)');
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// --- Enemies: sprite composer ------------------------------------------------

function drawEnemies(ctx, game, time) {
  const sorted = [...game.enemies].sort((a, b) => {
    return game.path.positionAt(a.dist).y - game.path.positionAt(b.dist).y;
  });
  for (const enemy of sorted) {
    const pos = game.path.positionAt(enemy.dist);
    const ahead = game.path.positionAt(enemy.dist + 2);
    const facing = ahead.x >= pos.x ? 1 : -1;
    const type = game.enemyTypes[enemy.typeId];
    const look = type.look || { body: 'round', features: [] };
    const has = (f) => look.features.includes(f);
    const stride = Math.sin(enemy.dist * 0.25);
    const floating = look.body === 'wisp';
    const bob = floating ? Math.sin(time * 4 + enemy.id) * 3 + 6 : Math.abs(stride) * 2.5;
    const x = pos.x;
    const y = pos.y - bob;
    const r = enemy.radius;
    const grow = Math.min(1, (enemy.age ?? 1) / 0.3);
    const spawnScale = 0.4 + 0.6 * (1 - (1 - grow) * (1 - grow)); // ease-out
    ctx.save();
    ctx.translate(x, pos.y);
    ctx.scale(spawnScale, spawnScale);
    ctx.translate(-x, -pos.y);

    ctx.fillStyle = 'rgba(20,40,15,0.25)';
    ctx.beginPath();
    ctx.ellipse(x, pos.y + r * 0.7, r * (floating ? 0.6 : 0.9), r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    if (!floating) {
      // Stepping feet, alternating with the stride.
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.4 + stride * r * 0.35 * facing, pos.y + r * 0.55, r * 0.28, r * 0.18, 0, 0, Math.PI * 2);
      ctx.ellipse(x + r * 0.4 - stride * r * 0.35 * facing, pos.y + r * 0.55, r * 0.28, r * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (has('glow')) {
      ctx.fillStyle = hexToRgba(type.color, 0.25 + Math.sin(time * 5 + enemy.id) * 0.1);
      ctx.beginPath();
      ctx.arc(x, y, r * 1.7, 0, Math.PI * 2);
      ctx.fill();
    }
    if (has('wings')) drawWings(ctx, x, y, r, time, enemy.id, type.color);

    // Body.
    if (look.body === 'long') drawLongBody(ctx, type.color, x, y, r, facing);
    else if (look.body === 'wisp') drawWispBody(ctx, type.color, x, y, r, time, enemy.id);
    else drawBody(ctx, type.color, x, y, r, look.body === 'big');

    // Features behind the face.
    if (has('shell')) drawShell(ctx, x, y, r);
    if (has('pads')) drawPads(ctx, x, y, r);
    if (has('scarf')) drawScarf(ctx, x, y, r, facing, time);
    if (has('ears')) drawEars(ctx, type.color, x, y, r);
    if (has('horns')) drawHorns(ctx, x, y, r);
    if (has('helmet')) drawHelmet(ctx, x, y, r);
    if (has('spikes')) drawSpikes(ctx, x, y, r);
    if (has('crown')) drawCrown(ctx, x, y, r);
    if (has('hat')) drawHat(ctx, x, y, r, facing);
    if (has('flame')) drawFlame(ctx, x, y, r, time, enemy.id);

    // Face.
    if (has('wolf')) drawWolfFace(ctx, type.color, x, y, r, facing);
    else if (has('frog')) drawFrogFace(ctx, x, y, r, facing);
    else drawEyes(ctx, x, y, r, facing, !floating);

    if (has('tusks')) drawTusks(ctx, x, y, r);
    if (has('tooth')) drawTooth(ctx, x, y, r, facing);
    if (has('club')) drawClub(ctx, x, y, r, facing);
    if (has('stinger')) drawStinger(ctx, x, y, r, facing, time);

    // Status tints: icy blue while chilled, orange while burning.
    if (enemy.slow) {
      ctx.fillStyle = 'rgba(143,211,255,0.4)';
      ctx.beginPath();
      ctx.arc(x, y, r * 1.02, 0, Math.PI * 2);
      ctx.fill();
    }
    if (enemy.burn) {
      ctx.fillStyle = `rgba(255,120,40,${0.25 + Math.sin(time * 20 + enemy.id) * 0.1})`;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.02, 0, Math.PI * 2);
      ctx.fill();
    }
    if (enemy.poison) {
      ctx.fillStyle = `rgba(143,211,58,${0.18 + enemy.poison.stacks * 0.05})`;
      ctx.beginPath();
      ctx.arc(x, y, r * 1.02, 0, Math.PI * 2);
      ctx.fill();
    }

    // Trait visuals: elemental aura, regeneration pulse, energy shield, rage.
    drawEnemyTraits(ctx, enemy, x, y, pos, r, time);

    // White hit-flash overlay while enemy.flash runs down.
    if (enemy.flash > 0) {
      ctx.globalAlpha = (enemy.flash / 0.12) * 0.65;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, r * 1.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Health bar (only once hurt). Bosses use the top bar instead.
    if (enemy.hp < enemy.maxHp && !enemy.boss) {
      const w = 22;
      const frac = Math.max(0, enemy.hp / enemy.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - w / 2 - 1, y - r - 10, w + 2, 5);
      ctx.fillStyle = frac > 0.5 ? '#6fd64a' : frac > 0.25 ? '#e8c33a' : '#d64545';
      ctx.fillRect(x - w / 2, y - r - 9, w * frac, 3);
    }
    ctx.restore();
  }
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

function drawBody(ctx, color, x, y, r, heavy) {
  ctx.fillStyle = color;
  ctx.strokeStyle = heavy ? 'rgba(0,0,0,0.55)' : 'rgba(0,0,0,0.35)';
  ctx.lineWidth = heavy ? 2.5 : 1.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  ctx.arc(x, y + r * 0.25, r * 0.85, 0.3, Math.PI - 0.3);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath();
  ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.4, 0, Math.PI * 2);
  ctx.fill();
}

function drawLongBody(ctx, color, x, y, r, facing) {
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(x, y, r * 1.25, r * 0.85, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.beginPath();
  ctx.ellipse(x, y + r * 0.3, r * 1.05, r * 0.5, 0, 0, Math.PI);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.ellipse(x + r * 0.6 * facing, y + r * 0.1, r * 0.45, r * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawWispBody(ctx, color, x, y, r, time, id) {
  const flicker = 0.75 + Math.sin(time * 9 + id) * 0.15;
  ctx.globalAlpha = flicker;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // Trailing wisps of body behind.
  for (let i = 1; i <= 3; i++) {
    ctx.globalAlpha = flicker * (0.5 - i * 0.12);
    ctx.beginPath();
    ctx.arc(x, y + r * 0.5 * i, r * (1 - i * 0.22), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.arc(x - r * 0.25, y - r * 0.3, r * 0.4, 0, Math.PI * 2);
  ctx.fill();
}

function drawEyes(ctx, x, y, r, facing, angry) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + r * 0.35 * facing, y - r * 0.2, r * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1c1c1c';
  ctx.beginPath();
  ctx.arc(x + r * 0.45 * facing, y - r * 0.2, r * 0.14, 0, Math.PI * 2);
  ctx.fill();
  if (angry) {
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + r * 0.1 * facing, y - r * 0.55);
    ctx.lineTo(x + r * 0.6 * facing, y - r * 0.38);
    ctx.stroke();
  }
}

function drawWolfFace(ctx, color, x, y, r, facing) {
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); // snout
  ctx.ellipse(x + r * 1.25 * facing, y - r * 0.05, r * 0.55, r * 0.32, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1c1c1c';
  ctx.beginPath();
  ctx.arc(x + r * 1.7 * facing, y - r * 0.1, r * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color; // ears
  ctx.beginPath();
  ctx.moveTo(x + r * 0.2 * facing, y - r * 0.6);
  ctx.lineTo(x + r * 0.45 * facing, y - r * 1.45);
  ctx.lineTo(x + r * 0.75 * facing, y - r * 0.65);
  ctx.closePath();
  ctx.moveTo(x - r * 0.25 * facing, y - r * 0.65);
  ctx.lineTo(x - r * 0.05 * facing, y - r * 1.35);
  ctx.lineTo(x + r * 0.3 * facing, y - r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.moveTo(x + r * 0.33 * facing, y - r * 0.68);
  ctx.lineTo(x + r * 0.47 * facing, y - r * 1.2);
  ctx.lineTo(x + r * 0.62 * facing, y - r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = color; // tail
  ctx.beginPath();
  ctx.ellipse(x - r * 1.35 * facing, y - r * 0.35, r * 0.5, r * 0.26, facing * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ffd34d'; // eye
  ctx.beginPath();
  ctx.arc(x + r * 0.75 * facing, y - r * 0.3, r * 0.17, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1c1c1c';
  ctx.beginPath();
  ctx.arc(x + r * 0.8 * facing, y - r * 0.3, r * 0.08, 0, Math.PI * 2);
  ctx.fill();
}

function drawFrogFace(ctx, x, y, r, facing) {
  for (const side of [-0.45, 0.45]) {
    ctx.fillStyle = '#e8f0b0';
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(x + side * r, y - r * 0.85, r * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#1c1c1c';
    ctx.beginPath();
    ctx.arc(x + side * r + r * 0.1 * facing, y - r * 0.85, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); // wide mouth
  ctx.arc(x + r * 0.15 * facing, y + r * 0.1, r * 0.55, 0.2, Math.PI - 0.2);
  ctx.stroke();
}

function drawEars(ctx, color, x, y, r) {
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.8, y - r * 0.4);
  ctx.lineTo(x - r * 1.5, y - r * 1.1);
  ctx.lineTo(x - r * 0.3, y - r * 0.9);
  ctx.closePath();
  ctx.moveTo(x + r * 0.8, y - r * 0.4);
  ctx.lineTo(x + r * 1.5, y - r * 1.1);
  ctx.lineTo(x + r * 0.3, y - r * 0.9);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawTooth(ctx, x, y, r, facing) {
  ctx.fillStyle = '#e8e2d4';
  ctx.beginPath();
  ctx.moveTo(x + r * 0.15 * facing, y + r * 0.45);
  ctx.lineTo(x + r * 0.3 * facing, y + r * 0.75);
  ctx.lineTo(x + r * 0.45 * facing, y + r * 0.45);
  ctx.fill();
}

function drawClub(ctx, x, y, r, facing) {
  ctx.strokeStyle = '#6b4a2b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7 * facing, y + r * 0.3);
  ctx.lineTo(x - r * 1.3 * facing, y - r * 0.6);
  ctx.stroke();
  ctx.fillStyle = '#5a3d20';
  ctx.beginPath();
  ctx.arc(x - r * 1.35 * facing, y - r * 0.7, r * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawHelmet(ctx, x, y, r) {
  ctx.fillStyle = '#6b7178';
  ctx.strokeStyle = '#4a4f55';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, y - r * 0.45, r * 0.72, Math.PI, 0);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#4a4f55'; // nose guard
  ctx.fillRect(x - 1, y - r * 0.5, 2, r * 0.35);
}

function drawHorns(ctx, x, y, r) {
  ctx.fillStyle = '#e8e2d4';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * r * 0.6, y - r * 0.75);
    ctx.lineTo(x + side * r * 1.1, y - r * 1.3);
    ctx.lineTo(x + side * r * 0.35, y - r * 0.95);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

function drawPads(ctx, x, y, r) {
  ctx.fillStyle = '#6b7178';
  ctx.strokeStyle = '#4a4f55';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(x + side * r * 0.85, y + r * 0.05, r * 0.42, r * 0.3, side * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.strokeStyle = '#4a3a22'; // chest strap
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7, y - r * 0.15);
  ctx.lineTo(x + r * 0.7, y + r * 0.45);
  ctx.stroke();
}

function drawTusks(ctx, x, y, r) {
  ctx.fillStyle = '#e8e2d4';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * r * 0.45, y + r * 0.5);
    ctx.lineTo(x + side * r * 0.6, y - r * 0.05);
    ctx.lineTo(x + side * r * 0.2, y + r * 0.3);
    ctx.closePath();
    ctx.fill();
  }
}

function drawShell(ctx, x, y, r) {
  // Segmented carapace plates across the back.
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(x, y + i * r * 0.35, r * 0.95, Math.PI + 0.4, Math.PI * 2 - 0.4);
    ctx.stroke();
  }
}

function drawSpikes(ctx, x, y, r) {
  ctx.fillStyle = '#d8d2c4';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const a = Math.PI + (i / 4) * Math.PI;
    const bx = x + Math.cos(a) * r * 0.85;
    const by = y + Math.sin(a) * r * 0.85;
    ctx.beginPath();
    ctx.moveTo(bx + Math.sin(a) * 2.5, by - Math.cos(a) * 2.5);
    ctx.lineTo(x + Math.cos(a) * r * 1.4, y + Math.sin(a) * r * 1.4);
    ctx.lineTo(bx - Math.sin(a) * 2.5, by + Math.cos(a) * 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

function drawCrown(ctx, x, y, r) {
  const top = y - r * 1.05;
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#a3780a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.5, top);
  ctx.lineTo(x - r * 0.5, top - r * 0.4);
  ctx.lineTo(x - r * 0.25, top - r * 0.15);
  ctx.lineTo(x, top - r * 0.5);
  ctx.lineTo(x + r * 0.25, top - r * 0.15);
  ctx.lineTo(x + r * 0.5, top - r * 0.4);
  ctx.lineTo(x + r * 0.5, top);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#e03a3a';
  ctx.beginPath();
  ctx.arc(x, top - r * 0.12, r * 0.1, 0, Math.PI * 2);
  ctx.fill();
}

function drawHat(ctx, x, y, r, facing) {
  ctx.fillStyle = '#2b2234';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); // brim
  ctx.ellipse(x, y - r * 0.6, r * 1.1, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath(); // crooked cone
  ctx.moveTo(x - r * 0.6, y - r * 0.65);
  ctx.lineTo(x + r * 0.3 * facing, y - r * 1.7);
  ctx.lineTo(x + r * 0.6, y - r * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#c9a53a'; // buckle band
  ctx.fillRect(x - r * 0.45, y - r * 0.85, r * 0.9, r * 0.14);
}

function drawScarf(ctx, x, y, r, facing, time) {
  ctx.strokeStyle = '#b8403a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y + r * 0.15, r * 0.75, 0.2, Math.PI - 0.2);
  ctx.stroke();
  const flap = Math.sin(time * 6) * 2;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7 * facing, y + r * 0.3);
  ctx.lineTo(x - r * 1.4 * facing, y + r * 0.1 + flap);
  ctx.stroke();
}

function drawWings(ctx, x, y, r, time, id, color) {
  const flap = Math.sin(time * 18 + id) * 0.5;
  ctx.fillStyle = hexToRgba(color, 0.45);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(x + side * r * 1.1, y - r * 0.3 - flap * r, r * 0.9, r * 0.4 + flap * r * 0.3, side * (0.5 + flap), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawFlame(ctx, x, y, r, time, id) {
  // Three tongues of different heights, additive, with a soft glow beneath.
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y - r * 0.6, 0, x, y - r * 0.6, r * 1.6);
  g.addColorStop(0, 'rgba(255,150,60,0.35)');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y - r * 0.6, r * 1.6, 0, Math.PI * 2);
  ctx.fill();
  for (let k = -1; k <= 1; k++) {
    const h = r * (k === 0 ? 1.3 : 0.8) * (0.9 + Math.sin(time * 12 + id + k * 2) * 0.25);
    const lean = Math.sin(time * 7 + id + k) * r * 0.25;
    drawFlameTongue(ctx, x + k * r * 0.45, y - r * 0.7, -Math.PI / 2 + lean / r * 0.6, h, r * 0.32, time, id + k);
  }
  ctx.restore();
}

function drawStinger(ctx, x, y, r, facing, time) {
  const curl = Math.sin(time * 4) * 0.15;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r * 1.0 * facing, y);
  ctx.quadraticCurveTo(x - r * 1.9 * facing, y - r * (0.3 + curl), x - r * 1.5 * facing, y - r * 1.2);
  ctx.stroke();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.moveTo(x - r * 1.5 * facing, y - r * 1.2);
  ctx.lineTo(x - r * 1.2 * facing, y - r * 1.55);
  ctx.lineTo(x - r * 1.7 * facing, y - r * 1.45);
  ctx.closePath();
  ctx.fill();
}

// --- Projectiles, particles, HUD overlays -----------------------------------

function drawProjectiles(ctx, game) {
  for (const proj of game.projectiles) {
    const scale = 1 + (proj.towerLevel || 0) * 0.25;
    const ang = Math.atan2(proj.dirY, proj.dirX);
    if (proj.towerType === 'archer') {
      // Arrow: shaft with a steel broadhead, fletching, and a faint speed streak.
      const len = 11 * scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * len * 2.2, proj.y - proj.dirY * len * 2.2);
      ctx.lineTo(proj.x - proj.dirX * len, proj.y - proj.dirY * len);
      ctx.stroke();
      ctx.strokeStyle = '#5a4322';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * len, proj.y - proj.dirY * len);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      ctx.fillStyle = proj.towerLevel >= 2 ? '#e8e2d4' : '#d9c9a3';
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(proj.x - proj.dirX * len, proj.y - proj.dirY * len);
        ctx.lineTo(proj.x - proj.dirX * (len + 2) - proj.dirY * 2.8 * side, proj.y - proj.dirY * (len + 2) + proj.dirX * 2.8 * side);
        ctx.lineTo(proj.x - proj.dirX * (len - 4) - proj.dirY * 1.2 * side, proj.y - proj.dirY * (len - 4) + proj.dirX * 1.2 * side);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#c9ced4';
      ctx.beginPath();
      ctx.moveTo(proj.x + proj.dirX * 3.5, proj.y + proj.dirY * 3.5);
      ctx.lineTo(proj.x - proj.dirY * 1.6, proj.y + proj.dirX * 1.6);
      ctx.lineTo(proj.x - proj.dirX * 1.5, proj.y - proj.dirY * 1.5);
      ctx.lineTo(proj.x + proj.dirY * 1.6, proj.y - proj.dirX * 1.6);
      ctx.closePath();
      ctx.fill();
    } else if (proj.towerType === 'frost') {
      // Spinning ice shard with an inner glow and a frosty wake.
      const l = 7.5 * scale;
      const w = 3.2 * scale;
      ctx.globalCompositeOperation = 'lighter';
      glowDisc(ctx, proj.x, proj.y, 9 * scale, 'rgba(143,211,255,0.35)');
      ctx.globalCompositeOperation = 'source-over';
      const g = ctx.createLinearGradient(proj.x - proj.dirY * w, proj.y + proj.dirX * w, proj.x + proj.dirY * w, proj.y - proj.dirX * w);
      g.addColorStop(0, '#6fb8e8');
      g.addColorStop(0.5, '#ffffff');
      g.addColorStop(1, '#8fd3ff');
      ctx.fillStyle = g;
      ctx.strokeStyle = '#5fa8d8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(proj.x + proj.dirX * l, proj.y + proj.dirY * l);
      ctx.lineTo(proj.x - proj.dirY * w, proj.y + proj.dirX * w);
      ctx.lineTo(proj.x - proj.dirX * l, proj.y - proj.dirY * l);
      ctx.lineTo(proj.x + proj.dirY * w, proj.y - proj.dirX * w);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (proj.towerType === 'sniper') {
      // A bright round with a long streak and a tiny shockwave cone.
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(242,255,208,0.5)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * 22, proj.y - proj.dirY * 22);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * 12, proj.y - proj.dirY * 12);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      glowDisc(ctx, proj.x, proj.y, 5, 'rgba(255,255,230,0.8)');
      ctx.globalCompositeOperation = 'source-over';
    } else if (proj.towerType === 'venom') {
      // Wobbling glob of ichor with a trailing drip.
      const wob = Math.sin((proj.x + proj.y) * 0.3) * 0.15;
      ctx.fillStyle = 'rgba(47,90,26,0.5)';
      ctx.beginPath();
      ctx.ellipse(proj.x - proj.dirX * 5, proj.y - proj.dirY * 5, 2.2 * scale, 1.6 * scale, ang, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = domeGradient(ctx, proj.x, proj.y, 5 * scale, '#c6ff6b', '#6fae3a', '#2f5a1a');
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y, 5 * scale * (1 + wob), 3.6 * scale * (1 - wob), ang, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      glowDisc(ctx, proj.x, proj.y, 7 * scale, 'rgba(143,211,58,0.35)');
      ctx.globalCompositeOperation = 'source-over';
    } else if (proj.towerType === 'mage') {
      // Arcane bolt: comet trail, haloed orb, spinning rune cross.
      ctx.globalCompositeOperation = 'lighter';
      const trail = ctx.createLinearGradient(proj.prevX - proj.dirX * 10, proj.prevY - proj.dirY * 10, proj.x, proj.y);
      trail.addColorStop(0, 'rgba(143,123,255,0)');
      trail.addColorStop(1, 'rgba(185,167,255,0.7)');
      ctx.strokeStyle = trail;
      ctx.lineWidth = 5 * scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * 14 * scale, proj.y - proj.dirY * 14 * scale);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      glowDisc(ctx, proj.x, proj.y, 10 * scale, 'rgba(143,123,255,0.5)');
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = domeGradient(ctx, proj.x, proj.y, 3.8 * scale, '#ffffff', '#e6dcff', '#8f7bff');
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 3.8 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 0.9;
      const ra = (proj.x + proj.y) * 0.15;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const a = ra + (k / 4) * Math.PI * 2;
        ctx.moveTo(proj.x, proj.y);
        ctx.lineTo(proj.x + Math.cos(a) * 6 * scale, proj.y + Math.sin(a) * 6 * scale);
      }
      ctx.stroke();
    } else {
      // Lobbed shells: sine arc with a ground shadow; mortar rounds glow and
      // trail fire, cannonballs show a lit fuse.
      const mortar = proj.towerType === 'mortar';
      const traveled = Math.hypot(proj.x - (proj.startX ?? proj.x), proj.y - (proj.startY ?? proj.y));
      const remaining = Math.hypot(proj.lastTarget.x - proj.x, proj.lastTarget.y - proj.y);
      const total = traveled + remaining || 1;
      const t = traveled / total;
      const lift = Math.sin(t * Math.PI) * Math.min(mortar ? 110 : 42, total * (mortar ? 0.55 : 0.3));
      const bx = proj.x;
      const by = proj.y - lift;
      ctx.fillStyle = `rgba(0,0,0,${0.3 - lift * 0.0015})`;
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y + 3, (4 + lift * 0.03) * scale, (2 + lift * 0.015) * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      if (mortar) {
        ctx.globalCompositeOperation = 'lighter';
        glowDisc(ctx, bx, by, 10 * scale, 'rgba(255,140,51,0.45)');
        ctx.globalCompositeOperation = 'source-over';
        // Shell body: pointed, with fins at the tail.
        const vx = Math.cos(t * Math.PI) * 0.5; // apparent heading along the arc
        const a = Math.atan2(-vx, proj.dirX || 0.01);
        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(a + Math.PI / 2);
        ctx.fillStyle = domeGradient(ctx, 0, 0, 5 * scale, '#8a9198', '#3a3f45', '#15181b');
        ctx.beginPath();
        ctx.moveTo(0, -7 * scale);
        ctx.quadraticCurveTo(4.2 * scale, -2 * scale, 3.5 * scale, 5 * scale);
        ctx.lineTo(-3.5 * scale, 5 * scale);
        ctx.quadraticCurveTo(-4.2 * scale, -2 * scale, 0, -7 * scale);
        ctx.fill();
        ctx.fillStyle = '#e2b84a';
        ctx.fillRect(-3.5 * scale, 1.5 * scale, 7 * scale, 1.4 * scale);
        ctx.fillStyle = '#2f3338';
        for (const side of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(side * 3 * scale, 3 * scale);
          ctx.lineTo(side * 5.5 * scale, 7 * scale);
          ctx.lineTo(side * 2 * scale, 6 * scale);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      } else {
        ctx.fillStyle = domeGradient(ctx, bx, by, 4.8 * scale, '#7a8188', '#2f3338', '#0f1113');
        ctx.beginPath();
        ctx.arc(bx, by, 4.8 * scale, 0, Math.PI * 2);
        ctx.fill();
        // Fuse spark.
        ctx.globalCompositeOperation = 'lighter';
        glowDisc(ctx, bx + 2 * scale, by - 4.5 * scale, 4 * scale, 'rgba(255,200,90,0.8)');
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#fff1b8';
        ctx.beginPath();
        ctx.arc(bx + 2 * scale, by - 4.5 * scale, 1.1 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}

function drawParticleList(ctx, particles, glow = false) {
  const opaque = new Set(['smoke', 'scorch', 'crater', 'frostpatch', 'puddle', 'leaf', 'snow', 'ash', 'shard', 'drop', 'casing', 'splinter']);
  for (const p of particles) {
    const frac = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = frac;
    ctx.globalCompositeOperation = glow && !opaque.has(p.shape) ? 'lighter' : 'source-over';
    switch (p.shape) {
      case 'ring':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3 * frac;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - frac) + 6, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case 'flash': {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (1.4 - frac * 0.4));
        g.addColorStop(0, p.color);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1.4 - frac * 0.4), 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'fire': {
        const r = p.size * (0.7 + (1 - frac) * (p.grow || 1) * 0.6);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, frac > 0.75 ? '#fff0c8' : p.color);
