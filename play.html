<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tower Rush</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #2a3142 0%, #161a24 60%, #0f1118 100%);
      min-height: 100vh;
      color: #e6eaf2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(90deg, #8fd3ff, #ff4fd8);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    #hud {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
    }
    #hud > span {
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
    }
    #stage {
      position: relative;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(143, 211, 255, 0.08);
    }
    #game {
      display: block;
      border-radius: 10px;
      max-width: 100%;
      touch-action: manipulation;
    }
    #level-select {
      position: absolute;
      inset: 0;
      background: rgba(12, 14, 22, 0.86);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      overflow: auto;
    }
    #level-select h2 { margin: 0 0 6px; font-size: 1.3rem; letter-spacing: 0.04em; }
    #level-list { display: flex; flex-direction: column; gap: 8px; width: min(440px, 100%); }
    .level-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      text-align: left;
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .level-btn:hover:not(:disabled) { background: rgba(143, 211, 255, 0.18); border-color: rgba(143, 211, 255, 0.5); }
    .level-btn small { opacity: 0.75; font-weight: normal; }
    .level-btn:disabled { opacity: 0.45; }
    #controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
    #tower-menu { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
    button:active:not(:disabled) { transform: translateY(0) scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; }
    button[data-type] {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 92px;
      padding: 8px 10px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--tower) 85%, white 15%), var(--tower));
      color: var(--tower-fg, #fff);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 14px color-mix(in srgb, var(--tower) 55%, transparent);
    }
    button[data-type] .tower-name { font-weight: 600; font-size: 0.85rem; }
    button[data-type] .tower-cost { font-size: 0.8rem; opacity: 0.85; }
    #start-wave { background: linear-gradient(180deg, #6fa0d8, #4a6fa5); font-weight: 600; letter-spacing: 0.03em; }
    #sell-tower { background: linear-gradient(180deg, #d06a72, #a8524c); }
    #upgrade-tower { background: linear-gradient(180deg, #b7d99f, #8fb273); color: #1b1f2a; font-weight: 600; }
    #tower-info { font-size: 0.9rem; opacity: 0.85; min-height: 1.2em; }
    #status { min-height: 1.4em; font-style: italic; opacity: 0.8; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Tower Rush</h1>
  <div id="hud">
    <span id="level-name"></span>
    <span>💰 Gold: <strong id="gold">0</strong></span>
    <span>❤️ Lives: <strong id="lives">0</strong></span>
    <span>🌊 Wave: <strong id="wave">0 / 0</strong></span>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="level-select">
      <h2>Choose a level</h2>
      <div id="level-list"></div>
    </div>
  </div>
  <div id="controls">
    <button id="start-wave">Start Wave</button>
    <span id="tower-menu" hidden>
      <button id="upgrade-tower">Upgrade</button>
      <button id="sell-tower">Sell</button>
    </span>
    <button id="next-level" hidden>Next Level</button>
    <button id="restart" hidden>Play Again</button>
    <button id="choose-level">Levels</button>
  </div>
  <div id="tower-info"></div>
  <div id="status"></div>

// Kept for backwards compatibility with existing imports and tests.
const LEVEL_1 = LEVELS[0];

// A polyline path enemies walk along, addressed by distance from the start.
//
// Levels describe a road with a handful of control points. Path.fromLevel()
// bends long straight runs with a gentle meander and runs a centripetal
// Catmull-Rom spline through the result, producing a dense polyline that the
// simulation walks and the renderer draws, so the road reads as a winding
// trail rather than a grid.

function dist(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

// Insert an offset midpoint into every long straight segment so roads wander
// a little instead of running ruler-straight. Alternates side to side.
function meanderWaypoints(points, { minLength = 130, amount = 0.11, maxOffset = 22 } = {}) {
  if (points.length < 2) return points.map((p) => ({ ...p }));
  const out = [{ ...points[0] }];
  let side = 1;
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1];
    const b = points[i];
    const len = dist(a, b);
    // Leave the off-screen entry and exit stubs straight.
    const offscreen = a.x < 0 || a.y < 0 || b.x < 0 || b.y < 0 || a.x > 800 || b.x > 800;
    if (len >= minLength && !offscreen) {
      const nx = -(b.y - a.y) / len;
      const ny = (b.x - a.x) / len;
      const off = Math.min(maxOffset, len * amount) * side;
      out.push({ x: (a.x + b.x) / 2 + nx * off, y: (a.y + b.y) / 2 + ny * off });
      side = -side;
    }
    out.push({ ...b });
  }
  return out;
}

// Centripetal Catmull-Rom through the control points (Barry–Goldman form).
// The first and last points are kept exactly.
function smoothWaypoints(points, samplesPerSegment = 12) {
  if (points.length < 3) return points.map((p) => ({ ...p }));
  const pts = [points[0], ...points, points[points.length - 1]];
  const knot = (t, a, b) => t + Math.pow(Math.max(dist(a, b), 1e-6), 0.5);
  const out = [{ ...points[0] }];

  for (let i = 1; i < pts.length - 2; i++) {
    const [p0, p1, p2, p3] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
    const t0 = 0;
    const t1 = knot(t0, p0, p1);
    const t2 = knot(t1, p1, p2);
    const t3 = knot(t2, p2, p3);
    for (let s = 1; s <= samplesPerSegment; s++) {
      const t = t1 + ((t2 - t1) * s) / samplesPerSegment;
      const lerp = (a, b, ta, tb) => {
        const w = (t - ta) / (tb - ta);
        return { x: a.x + (b.x - a.x) * w, y: a.y + (b.y - a.y) * w };
      };
      const a1 = lerp(p0, p1, t0, t1);
      const a2 = lerp(p1, p2, t1, t2);
      const a3 = lerp(p2, p3, t2, t3);
      const b1 = lerp(a1, a2, t0, t2);
      const b2 = lerp(a2, a3, t1, t3);
      out.push(lerp(b1, b2, t1, t2));
    }
  }
  return out;
}

class Path {
  constructor(waypoints) {
    if (!waypoints || waypoints.length < 2) {
      throw new Error('Path needs at least two waypoints');
    }
    this.waypoints = waypoints;
    this.segmentLengths = [];
    this.totalLength = 0;
    for (let i = 0; i < waypoints.length - 1; i++) {
      const dx = waypoints[i + 1].x - waypoints[i].x;
      const dy = waypoints[i + 1].y - waypoints[i].y;
      const len = Math.hypot(dx, dy);
      this.segmentLengths.push(len);
      this.totalLength += len;
    }
  }

  // The smooth, winding road for a level. Set `level.smoothPath = false` to
  // walk the raw control points instead.
  static fromLevel(level) {
    if (level.smoothPath === false) return new Path(level.path);
    return new Path(smoothWaypoints(meanderWaypoints(level.path)));
  }

  // Position at `dist` from the start, clamped to the path's ends.
  positionAt(dist) {
    if (dist <= 0) return { ...this.waypoints[0] };
    let remaining = dist;
    for (let i = 0; i < this.segmentLengths.length; i++) {
      const len = this.segmentLengths[i];
      if (remaining <= len) {
        const t = len === 0 ? 0 : remaining / len;
        const a = this.waypoints[i];
        const b = this.waypoints[i + 1];
        return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
      }
      remaining -= len;
    }
    return { ...this.waypoints[this.waypoints.length - 1] };
  }
}

// Core game logic. No DOM or canvas access here, so it runs in Node for tests.


const PHASE = {
  BUILD: 'build', // between waves; player can build and start the next wave
  WAVE: 'wave',   // enemies spawning/walking
  WON: 'won',
  LOST: 'lost',
};

// Physical damage is cut by armor, magic damage by magic resistance.
function effectiveDamage(amount, damageType, enemyType) {
  const reduction = damageType === 'magic' ? enemyType.magicResist || 0 : enemyType.armor || 0;
  return amount * (1 - reduction);
}

class Game {
  constructor(level, { towerTypes = TOWER_TYPES, enemyTypes = ENEMY_TYPES } = {}) {
    this.level = level;
    this.towerTypes = towerTypes;
    this.enemyTypes = enemyTypes;
    this.path = Path.fromLevel(level);

    this.gold = level.startingGold;
    this.lives = level.startingLives;
    this.phase = PHASE.BUILD;
    this.waveIndex = -1; // index of the wave in progress (or last completed)

    this.enemies = [];
    this.towers = []; // one slot per build spot; null = empty
    for (let i = 0; i < level.buildSpots.length; i++) this.towers.push(null);
    this.projectiles = [];
    this.spawnQueue = []; // [{ typeId, at }] sorted by time; `at` is wave-relative seconds
    this.waveTime = 0;
    this.nextEnemyId = 1;
    this.events = []; // gameplay events since the last drainEvents(), for effects/UI
  }

  get waveCount() {
    return this.level.waves.length;
  }

  // The live boss enemy, if one is on the field.
  get boss() {
    return this.enemies.find((e) => e.alive && e.boss) || null;
  }

  // Record a gameplay event. The queue is capped so a headless simulation
  // that never drains it cannot grow without bound.
  pushEvent(event) {
    this.events.push(event);
    if (this.events.length > 500) this.events.splice(0, this.events.length - 500);
  }

  drainEvents() {
    const events = this.events;
    this.events = [];
    return events;
  }

  // --- Tower stats -------------------------------------------------------

  // Stats for a tower's current tier: { cost, damage, range, fireInterval, splashRadius }.
  towerStats(tower) {
    return this.towerTypes[tower.typeId].levels[tower.level];
  }

  // Cost to take a tower to its next tier, or null at max level.
  upgradeCost(tower) {
    const levels = this.towerTypes[tower.typeId].levels;
    if (tower.level + 1 >= levels.length) return null;
    return levels[tower.level + 1].cost;
  }

  sellValue(tower) {
    return Math.floor(tower.invested * this.level.sellRefund);
  }

  // --- Player actions ---------------------------------------------------

  buildTower(spotIndex, typeId) {
    if (spotIndex < 0 || spotIndex >= this.towers.length) {
      return { ok: false, reason: 'invalid-spot' };
    }
    if (this.towers[spotIndex]) return { ok: false, reason: 'occupied' };
    const type = this.towerTypes[typeId];
    if (!type) return { ok: false, reason: 'unknown-type' };
    const cost = type.levels[0].cost;
    if (this.gold < cost) return { ok: false, reason: 'not-enough-gold' };
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) {
      return { ok: false, reason: 'game-over' };
    }

    this.gold -= cost;
    this.towers[spotIndex] = { typeId, level: 0, cooldown: 0, invested: cost, age: 0 };
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-built', x: spot.x, y: spot.y, towerType: typeId });
    return { ok: true };
  }

  upgradeTower(spotIndex) {
    const tower = this.towers[spotIndex];
    if (!tower) return { ok: false, reason: 'empty' };
    const cost = this.upgradeCost(tower);
    if (cost === null) return { ok: false, reason: 'max-level' };
    if (this.gold < cost) return { ok: false, reason: 'not-enough-gold' };
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) {
      return { ok: false, reason: 'game-over' };
    }

    this.gold -= cost;
    tower.level += 1;
    tower.invested += cost;
    tower.age = 0;
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-upgraded', x: spot.x, y: spot.y, towerType: tower.typeId, level: tower.level + 1 });
    return { ok: true, level: tower.level + 1 };
  }

  sellTower(spotIndex) {
    const tower = this.towers[spotIndex];
    if (!tower) return { ok: false, reason: 'empty' };
    const refund = this.sellValue(tower);
    this.gold += refund;
    this.towers[spotIndex] = null;
    const spot = this.level.buildSpots[spotIndex];
    this.pushEvent({ type: 'tower-sold', x: spot.x, y: spot.y, refund });
    return { ok: true, refund };
  }

  startNextWave() {
    if (this.waveIndex + 1 >= this.waveCount) return { ok: false, reason: 'no-more-waves' };
    if (this.phase !== PHASE.BUILD) return { ok: false, reason: 'wave-in-progress' };

    this.waveIndex += 1;
    this.phase = PHASE.WAVE;
    this.waveTime = 0;
    this.spawnQueue = [];

    // Entries within a wave spawn in sequence: all of entry 0, then entry 1, ...
    let t = 0;
    for (const entry of this.level.waves[this.waveIndex].entries) {
      for (let i = 0; i < entry.count; i++) {
        this.spawnQueue.push({ typeId: entry.type, at: t });
        t += entry.interval;
      }
    }
    this.pushEvent({ type: 'wave-started', wave: this.waveIndex + 1, final: this.waveIndex + 1 === this.waveCount });
    return { ok: true, wave: this.waveIndex + 1 };
  }

  // --- Simulation --------------------------------------------------------

  update(dt) {
    if (this.phase === PHASE.WON || this.phase === PHASE.LOST) return;
    if (this.phase === PHASE.WAVE) this.waveTime += dt;

    this.spawnEnemies();
    this.moveEnemies(dt);
    this.updateTowers(dt);
    this.updateProjectiles(dt);
    this.cleanupAndCheckEnd();
  }

  spawnEnemies() {
    while (this.spawnQueue.length > 0 && this.spawnQueue[0].at <= this.waveTime) {
      const { typeId } = this.spawnQueue.shift();
      const type = this.enemyTypes[typeId];
      this.enemies.push({
        id: this.nextEnemyId++,
        typeId,
        hp: type.hp,
        maxHp: type.hp,
        speed: type.speed,
        bounty: type.bounty,
        radius: type.radius,
        boss: !!type.boss,
        livesCost: type.lives || 1,
        dist: 0,
        alive: true,
        flash: 0, // seconds of white hit-flash left, for rendering
        slow: null, // { factor, remaining } while chilled
        burn: null, // { dps, remaining, damageType } while burning
        age: 0, // seconds since spawning, for the renderer
      });
      const pos = this.path.positionAt(0);
      this.pushEvent({ type: 'enemy-spawned', x: pos.x, y: pos.y, enemyType: typeId });
      if (type.boss) this.pushEvent({ type: 'boss-spawned', name: type.name, enemyType: typeId });
    }
  }

  moveEnemies(dt) {
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      enemy.flash = Math.max(0, (enemy.flash || 0) - dt);
      enemy.age = (enemy.age || 0) + dt;
      if (enemy.slow) {
        enemy.slow.remaining -= dt;
        if (enemy.slow.remaining <= 0) enemy.slow = null;
      }
      if (enemy.burn) {
        this.damageEnemy(enemy, enemy.burn.dps * dt, enemy.burn.damageType, { flash: false });
        enemy.burn.remaining -= dt;
        if (enemy.burn.remaining <= 0) enemy.burn = null;
        if (!enemy.alive) continue;
      }
      enemy.dist += enemy.speed * (enemy.slow ? enemy.slow.factor : 1) * dt;
      if (enemy.dist >= this.path.totalLength) {
        enemy.alive = false;
        enemy.leaked = true;
        const cost = enemy.livesCost || 1;
        this.lives = Math.max(0, this.lives - cost);
        const pos = this.path.positionAt(this.path.totalLength - 1);
        this.pushEvent({ type: 'enemy-leaked', x: pos.x, y: pos.y, boss: enemy.boss, cost });
      }
    }
  }

  updateTowers(dt) {
    for (let i = 0; i < this.towers.length; i++) {
      const tower = this.towers[i];
      if (!tower) continue;
      const type = this.towerTypes[tower.typeId];
      const stats = this.towerStats(tower);
      const spot = this.level.buildSpots[i];
      const attack = type.attack || 'projectile';
      tower.age = (tower.age || 0) + dt; // seconds since built/upgraded, for the renderer

      if (attack === 'beam') {
        this.updateBeam(tower, type, stats, spot, dt);
        continue;
      }

      tower.cooldown = Math.max(0, tower.cooldown - dt);
      if (tower.cooldown > 0) continue;
      const target = this.findTarget(spot, stats.range);
      if (!target) continue;

      const pos = this.path.positionAt(target.dist);
      tower.angle = Math.atan2(pos.y - spot.y, pos.x - spot.x);
      tower.cooldown = stats.fireInterval;
      this.pushEvent({ type: 'shot', x: spot.x, y: spot.y, angle: tower.angle, towerType: tower.typeId, level: tower.level });

      if (attack === 'projectile') {
        this.projectiles.push({
          x: spot.x,
          y: spot.y,
          startX: spot.x,
          startY: spot.y,
          prevX: spot.x,
          prevY: spot.y,
          targetId: target.id,
          lastTarget: pos,
          speed: type.projectileSpeed,
          damage: stats.damage,
          damageType: type.damageType,
          splashRadius: stats.splashRadius,
          slow: stats.slow || null,
          color: type.color,
          towerType: tower.typeId,
          towerLevel: tower.level,
          dirX: 0,
          dirY: 0,
        });
      } else if (attack === 'instant') {
        this.damageEnemy(target, stats.damage, type.damageType);
        if (stats.burn) this.applyBurn(target, stats.burn, type.damageType);
        this.pushEvent({ type: 'hit', x: pos.x, y: pos.y, towerType: tower.typeId, level: tower.level, splash: 0 });
      } else if (attack === 'chain') {
        this.chainLightning(spot, target, stats, type, tower);
      }
    }
  }

  // Lightning hits the target, then arcs to the nearest untouched enemy
  // within chainRadius, losing damage with every jump.
  chainLightning(spot, target, stats, type, tower) {
    const points = [{ x: spot.x, y: spot.y - 26 }];
    const struck = new Set();
    let current = target;
    let damage = stats.damage;
    for (let jump = 0; jump <= stats.jumps && current; jump++) {
      const pos = this.path.positionAt(current.dist);
      points.push(pos);
      struck.add(current.id);
      this.damageEnemy(current, damage, type.damageType);
      damage *= stats.falloff;
      let next = null;
      let best = Infinity;
      for (const enemy of this.enemies) {
        if (!enemy.alive || struck.has(enemy.id)) continue;
        const p = this.path.positionAt(enemy.dist);
        const d = Math.hypot(p.x - pos.x, p.y - pos.y);
        if (d <= stats.chainRadius && d < best) {
          best = d;
          next = enemy;
        }
      }
      current = next;
    }
    this.pushEvent({ type: 'zap', points, towerType: tower.typeId, level: tower.level });
  }

  // A beam stays on its target while it can and ramps up the longer it holds.
  updateBeam(tower, type, stats, spot, dt) {
    let target = this.enemies.find((e) => e.id === tower.beamTargetId && e.alive) || null;
    if (target) {
      const pos = this.path.positionAt(target.dist);
      if (Math.hypot(pos.x - spot.x, pos.y - spot.y) > stats.range) target = null;
    }
    if (!target) {
      target = this.findTarget(spot, stats.range);
      tower.beamTargetId = target ? target.id : null;
      tower.beamTime = 0;
    }
    if (!target) return;

    tower.beamTime += dt;
    const ramp = Math.min(1, tower.beamTime / stats.rampTime);
    const multiplier = 1 + (stats.rampMultiplier - 1) * ramp;
    const pos = this.path.positionAt(target.dist);
    tower.angle = Math.atan2(pos.y - spot.y, pos.x - spot.x);
    this.damageEnemy(target, stats.dps * multiplier * dt, type.damageType, { flash: false });
  }

  // Current damage multiplier of a beam tower, for the HUD and renderer.
  beamMultiplier(tower) {
    const stats = this.towerStats(tower);
    if (!tower.beamTargetId || !stats.rampTime) return 1;
    return 1 + (stats.rampMultiplier - 1) * Math.min(1, (tower.beamTime || 0) / stats.rampTime);
  }

  applySlow(enemy, slow) {
    // A stronger or fresher chill replaces a weaker one; never stacks.
    if (!enemy.slow || slow.factor <= enemy.slow.factor) {
      enemy.slow = { factor: slow.factor, remaining: slow.duration };
    } else {
      enemy.slow.remaining = Math.max(enemy.slow.remaining, slow.duration);
    }
  }

  applyBurn(enemy, burn, damageType) {
    if (!enemy.burn || burn.dps >= enemy.burn.dps) {
      enemy.burn = { dps: burn.dps, remaining: burn.duration, damageType };
    } else {
      enemy.burn.remaining = Math.max(enemy.burn.remaining, burn.duration);
    }
  }

  // Kingdom Rush convention: shoot the enemy furthest along the path in range.
  findTarget(from, range) {
    let best = null;
    for (const enemy of this.enemies) {
      if (!enemy.alive) continue;
      const pos = this.path.positionAt(enemy.dist);
      if (Math.hypot(pos.x - from.x, pos.y - from.y) > range) continue;
      if (!best || enemy.dist > best.dist) best = enemy;
    }
    return best;
  }

  updateProjectiles(dt) {
    for (const proj of this.projectiles) {
      const target = this.enemies.find((e) => e.id === proj.targetId && e.alive);
      // Fly toward the live target, or the target's last known spot if it died.
      const dest = target ? this.path.positionAt(target.dist) : proj.lastTarget;
      if (target) proj.lastTarget = dest;

      const dx = dest.x - proj.x;
      const dy = dest.y - proj.y;
      const distToDest = Math.hypot(dx, dy);
      const step = proj.speed * dt;
      proj.prevX = proj.x;
      proj.prevY = proj.y;
      if (distToDest > 0) {
        proj.dirX = dx / distToDest;
        proj.dirY = dy / distToDest;
      }

      if (distToDest <= step) {
        proj.x = dest.x;
        proj.y = dest.y;
        proj.done = true;
        this.applyHit(proj, target);
        this.pushEvent({
          type: 'hit',
          x: proj.x,
          y: proj.y,
          towerType: proj.towerType,
          level: proj.towerLevel,
          splash: proj.splashRadius,
        });
      } else {
        proj.x += (dx / distToDest) * step;
        proj.y += (dy / distToDest) * step;
      }
    }
    this.projectiles = this.projectiles.filter((p) => !p.done);
  }

  applyHit(proj, directTarget) {
    if (proj.splashRadius > 0) {
      for (const enemy of this.enemies) {
        if (!enemy.alive) continue;
        const pos = this.path.positionAt(enemy.dist);
        if (Math.hypot(pos.x - proj.x, pos.y - proj.y) <= proj.splashRadius + enemy.radius) {
          this.damageEnemy(enemy, proj.damage, proj.damageType);
          if (proj.slow) this.applySlow(enemy, proj.slow);
        }
      }
    } else if (directTarget) {
      this.damageEnemy(directTarget, proj.damage, proj.damageType);
      if (proj.slow) this.applySlow(directTarget, proj.slow);
    }
  }

  damageEnemy(enemy, amount, damageType = 'physical', { flash = true } = {}) {
    if (!enemy.alive) return;
    const type = this.enemyTypes[enemy.typeId];
    enemy.hp -= effectiveDamage(amount, damageType, type);
    if (flash) enemy.flash = 0.12;
    if (enemy.hp <= 0 && enemy.alive) {
      enemy.alive = false;
      this.gold += enemy.bounty;
      const pos = this.path.positionAt(enemy.dist);
      this.pushEvent({
        type: 'enemy-died',
        x: pos.x,
        y: pos.y,
        bounty: enemy.bounty,
        enemyType: enemy.typeId,
        boss: enemy.boss,
      });
    }
  }

  cleanupAndCheckEnd() {
    this.enemies = this.enemies.filter((e) => e.alive);

    if (this.lives <= 0) {
      this.phase = PHASE.LOST;
      this.pushEvent({ type: 'game-lost' });
      return;
    }
    const waveCleared =
      this.phase === PHASE.WAVE && this.spawnQueue.length === 0 && this.enemies.length === 0;
    if (waveCleared) {
      this.phase = this.waveIndex + 1 >= this.waveCount ? PHASE.WON : PHASE.BUILD;
      this.pushEvent({ type: this.phase === PHASE.WON ? 'game-won' : 'wave-cleared' });
    }
  }
}

{ MAX_TOWER_LEVEL };

// Visual effects state: particles, floating texts, banners, and scheduled
// bursts (fireworks). No DOM or canvas access — the renderer draws this,
// tests drive it headless.
//
// Two particle layers: `groundParticles` render under enemies (scorch marks,
// dust) and `particles` render on top (sparks, smoke, debris).


function rand(min, max) {
  return min + Math.random() * (max - min);
}

class Effects {
  constructor({ enemyTypes = ENEMY_TYPES } = {}) {
    this.enemyTypes = enemyTypes;
    this.particles = [];       // {x,y,vx,vy,life,maxLife,size,color,shape,gravity}
    this.groundParticles = []; // same shape, drawn beneath enemies
    this.texts = [];           // {x,y,text,color,life,maxLife}
    this.banner = null;        // {text,color,life,maxLife}
    this.scheduled = [];       // [{delay, x, y, kind}] future bursts
    this.bolts = [];           // [{points, life, maxLife}] lightning arcs
    this.dustTimer = 0;        // throttles ambient footstep dust
  }

  clear() {
    this.particles = [];
    this.groundParticles = [];
    this.texts = [];
    this.banner = null;
    this.scheduled = [];
    this.bolts = [];
  }

  // Turn gameplay events (from Game.drainEvents()) into visual effects.
  process(events) {
    for (const event of events) {
      switch (event.type) {
        case 'shot':
          this.spawnMuzzle(event);
          break;
        case 'hit':
          this.spawnImpact(event);
          break;
        case 'zap':
          this.spawnLightning(event);
          break;
        case 'enemy-died':
          this.spawnDeath(event);
          break;
        case 'enemy-spawned':
          this.spawnEmerge(event);
          break;
        case 'enemy-leaked':
          this.spawnLeak(event);
          break;
        case 'tower-built':
          this.spawnConstruction(event);
          break;
        case 'tower-sold':
          this.spawnSale(event);
          break;
        case 'tower-upgraded':
          this.spawnUpgrade(event);
          break;
        case 'boss-spawned':
          this.setBanner(event.name, '#ff6b6b');
          break;
        case 'wave-started':
          this.setBanner(event.final ? `Final Wave` : `Wave ${event.wave}`, event.final ? '#ff9f45' : '#f2e3b3');
          break;
        case 'game-won':
          this.setBanner('Victory!', '#ffd700');
          this.scheduleFireworks();
          break;
        case 'game-lost':
          this.setBanner('Defeat!', '#e25555');
          break;
      }
    }
  }

  // Continuous effects driven by live game state rather than events:
  // footstep dust under walkers and trails behind projectiles.
  ambient(game, dt) {
    this.dustTimer -= dt;
    if (this.dustTimer <= 0) {
      this.dustTimer = 0.09;
      for (const enemy of game.enemies) {
        if (!enemy.alive || Math.random() > 0.4) continue;
        const pos = game.path.positionAt(enemy.dist);
        this.addGroundParticle({
          x: pos.x + rand(-4, 4),
          y: pos.y + enemy.radius * 0.6,
          vx: rand(-8, 8),
          vy: rand(-14, -4),
          life: rand(0.3, 0.55),
          size: rand(1.5, 3),
          color: '#b8a67e',
          shape: 'smoke',
        });
      }
    }
    for (const enemy of game.enemies) {
      if (!enemy.alive) continue;
      if (enemy.burn && Math.random() < dt * 14) {
        const pos = game.path.positionAt(enemy.dist);
        this.addParticle({
          x: pos.x + rand(-enemy.radius * 0.6, enemy.radius * 0.6),
          y: pos.y - enemy.radius * 0.5,
          vx: rand(-10, 10),
          vy: rand(-55, -25),
          life: rand(0.3, 0.55),
          size: rand(1.5, 3),
          color: Math.random() < 0.5 ? '#ff9f45' : '#ffd97a',
        });
      }
      if (enemy.slow && Math.random() < dt * 8) {
        const pos = game.path.positionAt(enemy.dist);
        this.addParticle({
          x: pos.x + rand(-enemy.radius, enemy.radius),
          y: pos.y + rand(-enemy.radius, enemy.radius),
          vx: rand(-6, 6),
          vy: rand(-12, -2),
          life: rand(0.4, 0.7),
          size: rand(1, 2),
          color: '#dff3ff',
        });
      }
    }
    game.towers.forEach((tower, i) => {
      if (!tower || !tower.beamTargetId) return;
      const target = game.enemies.find((e) => e.id === tower.beamTargetId && e.alive);
      if (!target || Math.random() > dt * 30) return;
      const pos = game.path.positionAt(target.dist);
      const angle = rand(0, Math.PI * 2);
      this.addParticle({
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * rand(30, 90),
        vy: Math.sin(angle) * rand(30, 90) - 20,
        life: rand(0.15, 0.3),
        size: rand(1, 2.2),
        color: Math.random() < 0.5 ? '#ff4fd8' : '#ffffff',
      });
    });
    for (const proj of game.projectiles) {
      if (proj.towerType === 'frost' && Math.random() < dt * 30) {
        this.addParticle({
          x: proj.x + rand(-2, 2),
          y: proj.y + rand(-2, 2),
          vx: rand(-8, 8),
          vy: rand(-8, 8),
          life: rand(0.2, 0.35),
          size: rand(1, 2),
          color: '#dff3ff',
        });
      } else if (proj.towerType === 'mage' && Math.random() < dt * 40) {
        this.addParticle({
          x: proj.x + rand(-2, 2),
          y: proj.y + rand(-2, 2),
          vx: rand(-12, 12),
          vy: rand(-12, 12),
          life: rand(0.2, 0.35),
          size: rand(1, 2.2),
          color: Math.random() < 0.5 ? '#b9a7ff' : '#e6dcff',
        });
      } else if (proj.towerType === 'cannon' && Math.random() < dt * 25) {
        this.addParticle({
          x: proj.x,
          y: proj.y,
          vx: rand(-6, 6),
          vy: rand(-14, -4),
          life: rand(0.25, 0.45),
          size: rand(1.5, 3),
          color: '#8d949b',
          shape: 'smoke',
        });
      }
    }
  }

  spawnMuzzle(event) {
    if (event.towerType === 'cannon') {
      // Flash and smoke out of the barrel.
      for (let i = 0; i < 8; i++) {
        const spread = event.angle + rand(-0.45, 0.45);
        this.addParticle({
          x: event.x + Math.cos(event.angle) * 14,
          y: event.y - 10 + Math.sin(event.angle) * 14,
          vx: Math.cos(spread) * rand(50, 130),
          vy: Math.sin(spread) * rand(50, 130),
          life: rand(0.15, 0.3),
          size: rand(2, 4.5),
          color: i < 4 ? '#ffd97a' : '#9aa0a6',
          shape: i < 4 ? 'dot' : 'smoke',
        });
      }
    } else if (event.towerType === 'mage') {
      for (let i = 0; i < 5; i++) {
        this.addParticle({
          x: event.x,
          y: event.y - 26,
          vx: rand(-35, 35),
          vy: rand(-35, 35),
          life: rand(0.2, 0.4),
          size: rand(1.5, 3),
          color: '#b9a7ff',
        });
      }
    } else if (event.towerType === 'flame') {
      // A burst of fire along the nozzle direction.
      for (let i = 0; i < 4; i++) {
        const spread = event.angle + rand(-0.3, 0.3);
        const speed = rand(110, 180);
        this.addParticle({
          x: event.x + Math.cos(event.angle) * 16,
          y: event.y - 8 + Math.sin(event.angle) * 16,
          vx: Math.cos(spread) * speed,
          vy: Math.sin(spread) * speed,
          life: rand(0.18, 0.32),
          size: rand(3, 5.5),
          color: ['#ffd97a', '#ff9f45', '#ff6b35', '#ffe8b0'][i % 4],
          shape: 'smoke',
        });
      }
    } else if (event.towerType === 'tesla' || event.towerType === 'laser') {
      // Handled by the bolt / beam visuals.
    } else {
      // A tiny puff of dust off the bowstring.
      this.addParticle({
        x: event.x,
        y: event.y - 20,
        vx: Math.cos(event.angle) * 30,
        vy: Math.sin(event.angle) * 30,
        life: 0.15,
        size: 1.6,
        color: '#e8e2d4',
      });
    }
  }

  spawnImpact(event) {
    if (event.towerType === 'cannon') {
      // Explosion: fireball debris, rising smoke, shockwave ring, scorch mark.
      for (let i = 0; i < 18; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(50, 190);
        this.addParticle({
          x: event.x,
          y: event.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.3, 0.65),
          size: rand(2, 5),
          color: ['#ffd97a', '#ff9f45', '#ff6b35', '#ffe8b0'][i % 4],
          gravity: 170,
        });
      }
      for (let i = 0; i < 6; i++) {
        this.addParticle({
          x: event.x + rand(-9, 9),
          y: event.y + rand(-9, 9),
          vx: rand(-18, 18),
          vy: rand(-50, -18),
          life: rand(0.5, 1.0),
          size: rand(5, 10),
          color: '#7d848a',
          shape: 'smoke',
        });
      }
      this.addParticle({
        x: event.x,
        y: event.y,
        vx: 0,
        vy: 0,
        life: 0.35,
        size: Math.max(20, event.splash),
        color: '#ffb347',
        shape: 'ring',
      });
      this.addGroundParticle({
        x: event.x,
        y: event.y,
        vx: 0,
        vy: 0,
        life: 4,
        size: rand(10, 14),
        color: 'rgba(40,32,22,0.55)',
        shape: 'scorch',
      });
    } else if (event.towerType === 'frost') {
      for (let i = 0; i < 7; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(30, 90);
        this.addParticle({
          x: event.x,
          y: event.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.25, 0.45),
          size: rand(1.5, 3),
          color: i % 2 ? '#8fd3ff' : '#ffffff',
          gravity: 90,
        });
      }
      this.addParticle({ x: event.x, y: event.y, vx: 0, vy: 0, life: 0.25, size: 14, color: '#bfe9ff', shape: 'ring' });
    } else if (event.towerType === 'flame') {
      for (let i = 0; i < 2; i++) {
        this.addParticle({
          x: event.x + rand(-4, 4),
          y: event.y + rand(-4, 4),
          vx: rand(-20, 20),
          vy: rand(-50, -20),
          life: rand(0.2, 0.4),
          size: rand(1.5, 2.5),
          color: '#ffd97a',
        });
      }
    } else if (event.towerType === 'mage') {
      for (let i = 0; i < 10; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(30, 100);
        this.addParticle({
          x: event.x,
          y: event.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.25, 0.5),
          size: rand(1.5, 3.5),
          color: i % 2 ? '#8f7bff' : '#e6dcff',
        });
      }
      this.addParticle({
        x: event.x,
        y: event.y,
        vx: 0,
        vy: 0,
        life: 0.2,
        size: 12,
        color: '#b9a7ff',
        shape: 'ring',
      });
    } else {
      for (let i = 0; i < 4; i++) {
        this.addParticle({
          x: event.x,
          y: event.y,
          vx: rand(-50, 50),
          vy: rand(-50, 10),
          life: rand(0.15, 0.3),
          size: rand(1.5, 2.5),
          color: i % 2 ? '#e8e2d4' : '#c9a86a',
          gravity: 120,
        });
      }
    }
  }

  spawnLightning(event) {
    this.bolts.push({ points: event.points, life: 0.18, maxLife: 0.18 });
    for (const p of event.points.slice(1)) {
      for (let i = 0; i < 5; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(40, 110);
        this.addParticle({
          x: p.x,
          y: p.y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: rand(0.15, 0.3),
          size: rand(1, 2.2),
          color: i % 2 ? '#dff3ff' : '#7ec8ff',
        });
      }
    }
  }

  spawnDeath(event) {
    const color = this.enemyTypes[event.enemyType]?.color ?? '#888';
    for (let i = 0; i < 10; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(25, 95);
      this.addParticle({
        x: event.x,
        y: event.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 35,
        life: rand(0.3, 0.6),
        size: rand(2, 4),
        color: i % 3 === 0 ? '#ddd6c5' : color,
        gravity: 130,
      });
    }
    // A coin that pops up and falls with the bounty text.
    this.addParticle({
      x: event.x,
      y: event.y,
      vx: rand(-15, 15),
      vy: -90,
      life: 0.6,
      size: 3,
      color: '#ffd700',
      gravity: 260,
    });
    this.addText(event.x, event.y - 12, `+${event.bounty}g`, '#ffd700');
  }

  spawnEmerge(event) {
    // Dust kicked up as an enemy steps out of the cave.
    for (let i = 0; i < 4; i++) {
      this.addParticle({
        x: event.x + rand(-6, 10),
        y: event.y + rand(-6, 6),
        vx: rand(5, 30),
        vy: rand(-18, -4),
        life: rand(0.3, 0.5),
        size: rand(2, 4),
        color: '#b8a67e',
        shape: 'smoke',
      });
    }
  }

  spawnLeak(event) {
    const cost = event.cost || 1;
    this.addText(event.x, event.y, cost === 1 ? '-1 life' : `-${cost} lives`, '#e25555');
    // Bigger breaches ring louder.
    this.addParticle({
      x: event.x,
      y: event.y,
      vx: 0,
      vy: 0,
      life: 0.4 + cost * 0.05,
      size: 22 + cost * 6,
      color: '#e25555',
      shape: 'ring',
    });
  }

  spawnConstruction(event) {
    // Dust and stone chips around a freshly built tower.
    for (let i = 0; i < 10; i++) {
      const angle = rand(0, Math.PI * 2);
      this.addParticle({
        x: event.x + Math.cos(angle) * rand(4, 14),
        y: event.y + Math.sin(angle) * rand(2, 8),
        vx: Math.cos(angle) * rand(20, 60),
        vy: rand(-70, -20),
        life: rand(0.3, 0.6),
        size: rand(2, 4),
        color: i % 3 === 0 ? '#9aa1a8' : '#c2b391',
        gravity: 220,
        shape: i % 2 ? 'dot' : 'smoke',
      });
    }
  }

  spawnSale(event) {
    for (let i = 0; i < 6; i++) {
      this.addParticle({
        x: event.x + rand(-8, 8),
        y: event.y + rand(-10, 0),
        vx: rand(-20, 20),
        vy: rand(-80, -40),
        life: rand(0.4, 0.6),
        size: rand(2, 3),
        color: '#ffd700',
        gravity: 200,
      });
    }
    this.addText(event.x, event.y - 16, `+${event.refund}g`, '#ffd700');
  }

  spawnUpgrade(event) {
    // A golden ring and rising sparks as the tower is rebuilt bigger.
    this.addParticle({ x: event.x, y: event.y - 8, vx: 0, vy: 0, life: 0.45, size: 26, color: '#ffd700', shape: 'ring' });
    for (let i = 0; i < 12; i++) {
      const angle = rand(0, Math.PI * 2);
      this.addParticle({
        x: event.x + Math.cos(angle) * rand(2, 12),
        y: event.y + Math.sin(angle) * rand(1, 6),
        vx: rand(-15, 15),
        vy: rand(-110, -50),
        life: rand(0.4, 0.8),
        size: rand(1.5, 3),
        color: i % 3 === 0 ? '#ffffff' : '#ffd700',
        gravity: 80,
      });
    }
    this.addText(event.x, event.y - 30, `Level ${event.level}`, '#ffd700');
  }

  scheduleFireworks() {
    // A short celebratory volley across the upper half of the map.
    for (let i = 0; i < 6; i++) {
      this.scheduled.push({
        delay: 0.3 + i * 0.45,
        x: rand(120, 680),
        y: rand(60, 220),
        kind: 'firework',
      });
    }
  }

  spawnFirework(x, y) {
    const hue = ['#ffd700', '#7bd47b', '#7badff', '#ff8fb3', '#c9a1ff'][Math.floor(rand(0, 5))];
    for (let i = 0; i < 22; i++) {
      const angle = (i / 22) * Math.PI * 2;
      const speed = rand(60, 120);
      this.addParticle({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: rand(0.5, 0.9),
        size: rand(1.5, 3),
        color: i % 4 === 0 ? '#ffffff' : hue,
        gravity: 60,
      });
    }
  }

  addParticle({ x, y, vx, vy, life, size, color, shape = 'dot', gravity = 0 }) {
    this.particles.push({ x, y, vx, vy, life, maxLife: life, size, color, shape, gravity });
  }

  addGroundParticle({ x, y, vx, vy, life, size, color, shape = 'dot', gravity = 0 }) {
    this.groundParticles.push({ x, y, vx, vy, life, maxLife: life, size, color, shape, gravity });
  }

  addText(x, y, text, color) {
    this.texts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
  }

  setBanner(text, color) {
    this.banner = { text, color, life: 2.0, maxLife: 2.0 };
  }

  update(dt) {
    for (const list of [this.particles, this.groundParticles]) {
      for (const p of list) {
        p.life -= dt;
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
      }
    }
    this.particles = this.particles.filter((p) => p.life > 0);
    this.groundParticles = this.groundParticles.filter((p) => p.life > 0);

    for (const t of this.texts) {
      t.life -= dt;
      t.y -= 28 * dt;
    }
    this.texts = this.texts.filter((t) => t.life > 0);

    if (this.banner) {
      this.banner.life -= dt;
      if (this.banner.life <= 0) this.banner = null;
    }

    for (const b of this.bolts) b.life -= dt;
    this.bolts = this.bolts.filter((b) => b.life > 0);

    for (const s of this.scheduled) {
      s.delay -= dt;
      if (s.delay <= 0 && s.kind === 'firework') this.spawnFirework(s.x, s.y);
    }
    this.scheduled = this.scheduled.filter((s) => s.delay > 0);
  }
}

// Canvas rendering. Pure drawing — reads game/effects state, never mutates it.
//
// Layers, back to front:
//   static terrain (prerendered once per level): ground, path, water base,
//     cave, castle
//   animated water (ripples, shimmer)
//   ground particles (dust, scorch)
//   build spots, decorations, towers, enemies (sorted by y), projectiles
//   cloud shadows
//   particles, floating text, boss bar, banner

let sceneCache = null; // { level, terrain: canvas, decor: [...], clouds: [...] }

// Small deterministic PRNG so decorations stay put between frames and loads.
function mulberry32(seed) {
  return function () {
    seed |= 0;
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function render(ctx, game, effects, ui, time) {
  const { level } = game;
  // The canvas may be scaled for high-DPI screens; terrain is prerendered at
  // the same scale so it stays crisp.
  const dpr = ctx.getTransform().a || 1;
  const scene = getScene(game, dpr);
  ctx.clearRect(0, 0, level.width, level.height);
  ctx.drawImage(scene.terrain, 0, 0, level.width, level.height);

  drawWaterAnimation(ctx, level, time);
  drawParticleList(ctx, effects.groundParticles);
  drawBuildSpots(ctx, game, ui, time);
  drawDecorations(ctx, scene.decor, level.theme, time);
  drawTowers(ctx, game, ui, time);
  drawEnemies(ctx, game, time);
  drawProjectiles(ctx, game);
  drawBeams(ctx, game, time);
  drawBolts(ctx, effects.bolts);
  drawCloudShadows(ctx, scene.clouds, level, time);
  drawParticleList(ctx, effects.particles, true);
  drawVignette(ctx, scene.vignette, level);
  drawTexts(ctx, effects);
  drawBossBar(ctx, game);
  drawBanner(ctx, effects, level);
}

// --- Scene setup (once per level) -----------------------------------------

function getScene(game, dpr) {
  if (sceneCache && sceneCache.level === game.level && sceneCache.dpr === dpr) return sceneCache;
  const { level } = game;
  const { theme } = level;
  const rng = mulberry32(42);

  const terrain = document.createElement('canvas');
  terrain.width = Math.round(level.width * dpr);
  terrain.height = Math.round(level.height * dpr);
  const ctx = terrain.getContext('2d');
  ctx.scale(dpr, dpr);

  // Ground with soft mottling.
  const ground = ctx.createLinearGradient(0, 0, 0, level.height);
  ground.addColorStop(0, theme.groundTop);
  ground.addColorStop(1, theme.groundBottom);
  ctx.fillStyle = ground;
  ctx.fillRect(0, 0, level.width, level.height);
  for (let i = 0; i < 70; i++) {
    ctx.fillStyle = rng() > 0.5 ? theme.mottleLight : theme.mottleDark;
    ctx.beginPath();
    ctx.ellipse(rng() * level.width, rng() * level.height, 15 + rng() * 45, 8 + rng() * 22, rng() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const w of level.water) drawWaterBase(ctx, w, theme);

  // Path: dark edge, fill, worn center line.
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathEdge;
  ctx.lineWidth = 34;
  ctx.stroke();
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathFill;
  ctx.lineWidth = 28;
  ctx.stroke();
  ctx.save();
  ctx.setLineDash([2, 14]);
  tracePath(ctx, game.path.waypoints);
  ctx.strokeStyle = theme.pathLine;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();

  drawCave(ctx, level);
  drawCastle(ctx, level, theme);

  const decor = placeDecorations(game, rng);
  const clouds = makeClouds(level, rng);
  const vignette = makeVignette(level, dpr);
  sceneCache = { level, dpr, terrain, decor, clouds, vignette };
  return sceneCache;
}

// Soft darkening toward the edges, prerendered once; gives the map depth.
function makeVignette(level, dpr) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(level.width * dpr);
  canvas.height = Math.round(level.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const g = ctx.createRadialGradient(level.width / 2, level.height / 2, level.height * 0.45, level.width / 2, level.height / 2, level.width * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(10,8,20,0.42)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, level.width, level.height);
  return canvas;
}

function drawVignette(ctx, vignette, level) {
  ctx.drawImage(vignette, 0, 0, level.width, level.height);
}

function tracePath(ctx, waypoints) {
  ctx.beginPath();
  waypoints.forEach((p, i) => (i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)));
}

function drawWaterBase(ctx, w, theme) {
  // Shore ring, then deep-to-shallow radial fill.
  ctx.fillStyle = theme.lava ? 'rgba(20,10,8,0.6)' : 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(w.x, w.y, w.rx + 6, w.ry + 5, 0, 0, Math.PI * 2);
  ctx.fill();
  const grad = ctx.createRadialGradient(w.x, w.y, 2, w.x, w.y, w.rx);
  grad.addColorStop(0, theme.waterDeep);
  grad.addColorStop(1, theme.waterShallow);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(w.x, w.y, w.rx, w.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  if (theme.lilyPads) {
    const rng = mulberry32(w.x * 7 + w.y);
    for (let i = 0; i < 4; i++) {
      const a = rng() * Math.PI * 2;
      const d = rng() * 0.7;
      const px = w.x + Math.cos(a) * w.rx * d;
      const py = w.y + Math.sin(a) * w.ry * d;
      ctx.fillStyle = '#6fae4a';
      ctx.beginPath();
      ctx.ellipse(px, py, 7, 5, 0, 0.4, Math.PI * 2 - 0.2);
      ctx.lineTo(px, py);
      ctx.fill();
    }
  }
}

function drawCave(ctx, level) {
  const p = level.path[0];
  const x = Math.max(16, Math.min(level.width - 16, p.x));
  const y = Math.max(16, Math.min(level.height - 16, p.y));
  ctx.fillStyle = '#4a4238';
  ctx.beginPath();
  ctx.arc(x, y, 24, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#17120d';
  ctx.beginPath();
  ctx.arc(x, y, 16, Math.PI, 0);
  ctx.fill();
}

function drawCastle(ctx, level, theme) {
  const p = level.path[level.path.length - 1];
  const x = Math.max(30, Math.min(level.width - 30, p.x));
  const y = Math.max(60, Math.min(level.height - 20, p.y));
  ctx.fillStyle = theme.stone;
  ctx.fillRect(x - 26, y - 34, 52, 44);
  ctx.fillStyle = theme.stoneDark;
  for (let i = 0; i < 4; i++) ctx.fillRect(x - 26 + i * 14, y - 42, 9, 10); // crenellations
  ctx.fillRect(x - 26, y - 14, 52, 2); // string course
  ctx.fillStyle = '#5b4632';
  ctx.beginPath(); // gate
  ctx.arc(x, y + 10, 11, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x - 11, y + 10, 22, 1);
  ctx.fillStyle = '#2b2520'; // arrow slits
  ctx.fillRect(x - 16, y - 28, 3, 8);
  ctx.fillRect(x + 13, y - 28, 3, 8);
  ctx.strokeStyle = theme.stoneDark; // flag pole
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 20, y - 42);
  ctx.lineTo(x + 20, y - 58);
  ctx.stroke();
  ctx.fillStyle = '#c33c3c';
  ctx.beginPath();
  ctx.moveTo(x + 20, y - 58);
  ctx.lineTo(x + 34, y - 53);
  ctx.lineTo(x + 20, y - 48);
  ctx.fill();
}

function placeDecorations(game, rng) {
  const { level } = game;
  const kinds = level.theme.decor;
  const placed = [];
  let attempts = 0;
  while (placed.length < 26 && attempts++ < 400) {
    const x = 14 + rng() * (level.width - 28);
    const y = 14 + rng() * (level.height - 28);
    if (distToPath(game, x, y) < 36) continue;
    if (level.buildSpots.some((s) => Math.hypot(s.x - x, s.y - y) < 34)) continue;
    if (level.water.some((w) => ((x - w.x) / (w.rx + 14)) ** 2 + ((y - w.y) / (w.ry + 14)) ** 2 < 1)) continue;
    if (placed.some((d) => Math.hypot(d.x - x, d.y - y) < 28)) continue;
    placed.push({ x, y, kind: kinds[Math.floor(rng() * kinds.length)], seed: rng() * 10 });
  }
  // Draw order by y so taller things overlap naturally.
  return placed.sort((a, b) => a.y - b.y);
}

function distToPath(game, x, y) {
  let min = Infinity;
  for (let d = 0; d <= game.path.totalLength; d += 8) {
    const p = game.path.positionAt(d);
    min = Math.min(min, Math.hypot(p.x - x, p.y - y));
  }
  return min;
}

function makeClouds(level, rng) {
  const clouds = [];
  for (let i = 0; i < 3; i++) {
    const puffs = [];
    for (let j = 0; j < 5; j++) {
      puffs.push({ dx: (rng() - 0.5) * 220, dy: (rng() - 0.5) * 90, rx: 70 + rng() * 70, ry: 40 + rng() * 35 });
    }
    clouds.push({ x0: rng() * (level.width + 500), y: rng() * level.height, speed: 14 + rng() * 10, puffs });
  }
  return clouds;
}

// --- Animated environment -------------------------------------------------

function drawWaterAnimation(ctx, level, time) {
  const { theme } = level;
  for (const w of level.water) {
    const rng = mulberry32(Math.floor(w.x + w.y * 3));
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(w.x, w.y, w.rx, w.ry, 0, 0, Math.PI * 2);
    ctx.clip();

    ctx.globalCompositeOperation = 'lighter';
    if (theme.lava) {
      // Slow brightness pulse over the whole pool.
      ctx.fillStyle = `rgba(255,200,80,${0.08 + Math.sin(time * 1.3 + w.x) * 0.06})`;
      ctx.fillRect(w.x - w.rx, w.y - w.ry, w.rx * 2, w.ry * 2);
    }

    // Expanding ripple rings at fixed points in each pool.
    for (let k = 0; k < 4; k++) {
      const ox = (rng() - 0.5) * 1.3;
      const oy = (rng() - 0.5) * 1.3;
      const speed = theme.lava ? 0.18 : 0.32;
      const phase = (time * speed + k * 0.27 + rng()) % 1;
      const cx = w.x + ox * w.rx;
      const cy = w.y + oy * w.ry;
      ctx.strokeStyle = theme.waterGlow;
      ctx.globalAlpha = (1 - phase) * 0.9;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 3 + phase * w.rx * 0.45, (3 + phase * w.rx * 0.45) * (w.ry / w.rx), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Drifting shimmer dashes.
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = theme.waterGlow;
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 6; k++) {
      const sy = w.y + (rng() - 0.5) * w.ry * 1.4;
      const drift = ((time * 12 + k * 37 + rng() * 100) % (w.rx * 2.2)) - w.rx * 1.1;
      const sx = w.x + drift;
      ctx.beginPath();
      ctx.moveTo(sx - 5, sy);
      ctx.lineTo(sx + 5, sy);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

function drawCloudShadows(ctx, clouds, level, time) {
  ctx.fillStyle = `rgba(10,12,40,${level.theme.cloudAlpha})`;
  const span = level.width + 500;
  for (const c of clouds) {
    const x = ((c.x0 + time * c.speed) % span) - 250;
    for (const p of c.puffs) {
      ctx.beginPath();
      ctx.ellipse(x + p.dx, c.y + p.dy, p.rx, p.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawDecorations(ctx, decor, theme, time) {
  for (const d of decor) {
    const sway = Math.sin(time * 1.4 + d.seed * 2.1 + d.x * 0.02) * 2.5;
    switch (d.kind) {
      case 'tree': drawTree(ctx, d.x, d.y, sway); break;
      case 'pine': drawPine(ctx, d.x, d.y, sway, true); break;
      case 'palm': drawPalm(ctx, d.x, d.y, sway, time); break;
      case 'willow': drawWillow(ctx, d.x, d.y, sway, time); break;
      case 'deadtree': drawDeadTree(ctx, d.x, d.y, sway); break;
      case 'cactus': drawCactus(ctx, d.x, d.y); break;
      case 'bush': drawBush(ctx, d.x, d.y, '#4c8c40'); break;
      case 'deadbush': drawBush(ctx, d.x, d.y, '#8a7a5a'); break;
      case 'reeds': drawReeds(ctx, d.x, d.y, sway); break;
      case 'rock': drawRock(ctx, d.x, d.y, '#8f9296', '#a8abaf'); break;
      case 'snowrock': drawRock(ctx, d.x, d.y, '#9aa6b0', '#eef3f7'); break;
      case 'sandrock': drawRock(ctx, d.x, d.y, '#b08b55', '#d6b27e'); break;
      case 'obsidian': drawRock(ctx, d.x, d.y, '#1f1b24', '#4a3f55'); break;
      case 'flower': drawFlowers(ctx, d.x, d.y, d.seed, ['#e8e26e', '#e2918f', '#e8e8e8']); break;
      case 'ember': drawFlowers(ctx, d.x, d.y, d.seed, ['#ff9f45', '#ffd97a', '#ff6b35'], time); break;
      case 'mushroom': drawMushroom(ctx, d.x, d.y); break;
      case 'iceshard': drawIceShard(ctx, d.x, d.y, time); break;
      case 'bones': drawBones(ctx, d.x, d.y); break;
      case 'vent': drawVent(ctx, d.x, d.y, time, d.seed); break;
    }
  }
}

function shadow(ctx, x, y, rx, ry) {
  ctx.fillStyle = 'rgba(20,30,15,0.2)';
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawTree(ctx, x, y, sway) {
  shadow(ctx, x, y + 10, 10, 4);
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(x - 2, y, 4, 10);
  ctx.fillStyle = '#3f7a35';
  ctx.beginPath();
  ctx.moveTo(x + sway, y - 22);
  ctx.lineTo(x + 10, y + 2);
  ctx.lineTo(x - 10, y + 2);
  ctx.fill();
  ctx.fillStyle = '#4c8c40';
  ctx.beginPath();
  ctx.moveTo(x + sway * 0.6, y - 14);
  ctx.lineTo(x + 8, y + 4);
  ctx.lineTo(x - 8, y + 4);
  ctx.fill();
}

function drawPine(ctx, x, y, sway, snowy) {
  shadow(ctx, x, y + 10, 9, 4);
  ctx.fillStyle = '#5a3f2a';
  ctx.fillRect(x - 2, y + 2, 4, 9);
  const tiers = [[y + 4, 11, y - 10], [y - 6, 9, y - 19], [y - 14, 7, y - 27]];
  for (const [base, half, top] of tiers) {
    const s = sway * ((y - top) / 30);
    ctx.fillStyle = '#2f6b45';
    ctx.beginPath();
    ctx.moveTo(x + s, top);
    ctx.lineTo(x + half, base);
    ctx.lineTo(x - half, base);
    ctx.fill();
    if (snowy) {
      ctx.fillStyle = '#eef3f7';
      ctx.beginPath();
      ctx.moveTo(x + s, top);
      ctx.lineTo(x + half * 0.55, base - 4);
      ctx.lineTo(x - half * 0.55, base - 4);
      ctx.fill();
    }
  }
}

function drawPalm(ctx, x, y, sway, time) {
  shadow(ctx, x, y + 8, 12, 4);
  ctx.strokeStyle = '#8a6a3a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y + 8);
  ctx.quadraticCurveTo(x + 4, y - 10, x + sway, y - 24);
  ctx.stroke();
  ctx.strokeStyle = '#3f8a3a';
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + time * 0.3;
    const flap = Math.sin(time * 2 + i) * 1.5;
    ctx.beginPath();
    ctx.moveTo(x + sway, y - 24);
    ctx.quadraticCurveTo(x + sway + Math.cos(a) * 9, y - 28 + Math.sin(a) * 4 + flap, x + sway + Math.cos(a) * 15, y - 20 + Math.sin(a) * 6 + flap);
    ctx.stroke();
  }
}

function drawWillow(ctx, x, y, sway, time) {
  shadow(ctx, x, y + 10, 12, 4);
  ctx.fillStyle = '#4a3a28';
  ctx.fillRect(x - 3, y - 6, 6, 16);
  ctx.fillStyle = '#5c8a3a';
  ctx.beginPath();
  ctx.arc(x + sway * 0.4, y - 14, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#4e7a30';
  ctx.lineWidth = 1.5;
  for (let i = -3; i <= 3; i++) {
    const s = sway * (1 + Math.abs(i) * 0.2) + Math.sin(time * 2 + i) * 1.2;
    ctx.beginPath();
    ctx.moveTo(x + i * 4, y - 10);
    ctx.quadraticCurveTo(x + i * 4 + s * 0.5, y, x + i * 4.5 + s, y + 8);
    ctx.stroke();
  }
}

function drawDeadTree(ctx, x, y, sway) {
  shadow(ctx, x, y + 10, 8, 3);
  ctx.strokeStyle = '#3a2e26';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y + 10);
  ctx.lineTo(x + sway * 0.4, y - 14);
  ctx.lineTo(x + sway - 7, y - 24);
  ctx.moveTo(x + sway * 0.3, y - 8);
  ctx.lineTo(x + sway + 8, y - 18);
  ctx.moveTo(x + sway * 0.4, y - 14);
  ctx.lineTo(x + sway + 2, y - 26);
  ctx.stroke();
}

function drawCactus(ctx, x, y) {
  shadow(ctx, x, y + 10, 7, 3);
  ctx.fillStyle = '#4f8f4a';
  ctx.strokeStyle = '#2f6b2f';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x - 4, y - 18, 8, 28, 4);
  roundRect(ctx, x - 13, y - 10, 6, 12, 3);
  ctx.fillRect(x - 10, y - 2, 7, 4);
  roundRect(ctx, x + 7, y - 14, 6, 12, 3);
  ctx.fillRect(x + 3, y - 6, 7, 4);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawBush(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x - 4, y, 5, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 1, 6, 0, Math.PI * 2);
  ctx.arc(x, y + 3, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawReeds(ctx, x, y, sway) {
  ctx.strokeStyle = '#6f9a3a';
  ctx.lineWidth = 1.5;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(x + i * 3, y + 6);
    ctx.quadraticCurveTo(x + i * 3 + sway * 0.5, y - 6, x + i * 3 + sway * (1 + Math.abs(i) * 0.3), y - 16 - Math.abs(i) * 2);
    ctx.stroke();
  }
  ctx.fillStyle = '#6b4a2b';
  ctx.beginPath();
  ctx.ellipse(x + sway, y - 15, 1.8, 4, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawRock(ctx, x, y, dark, light) {
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(x - 7, y + 4);
  ctx.lineTo(x - 4, y - 4);
  ctx.lineTo(x + 3, y - 5);
  ctx.lineTo(x + 7, y + 2);
  ctx.lineTo(x + 4, y + 5);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = light;
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 4);
  ctx.lineTo(x + 3, y - 5);
  ctx.lineTo(x + 2, y);
  ctx.closePath();
  ctx.fill();
}

function drawFlowers(ctx, x, y, seed, colors, time) {
  const rng = mulberry32(Math.floor(seed * 1000));
  for (let i = 0; i < 3; i++) {
    const fx = x + (rng() - 0.5) * 14;
    const fy = y + (rng() - 0.5) * 10;
    const glow = time === undefined ? 1 : 0.6 + Math.sin(time * 3 + i + seed) * 0.4;
    ctx.globalAlpha = glow;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMushroom(ctx, x, y) {
  ctx.fillStyle = '#e6d9b8';
  ctx.fillRect(x - 2, y - 4, 4, 8);
  ctx.fillStyle = '#b8403a';
  ctx.beginPath();
  ctx.arc(x, y - 4, 7, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = '#f2e9d8';
  ctx.beginPath();
  ctx.arc(x - 2, y - 7, 1.5, 0, Math.PI * 2);
  ctx.arc(x + 3, y - 6, 1.2, 0, Math.PI * 2);
  ctx.fill();
}

function drawIceShard(ctx, x, y, time) {
  ctx.fillStyle = `rgba(190,230,255,${0.75 + Math.sin(time * 2 + x) * 0.15})`;
  ctx.strokeStyle = '#7fb8d8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 6, y + 4);
  ctx.lineTo(x - 3, y - 16);
  ctx.lineTo(x + 1, y + 4);
  ctx.moveTo(x + 1, y + 4);
  ctx.lineTo(x + 5, y - 9);
  ctx.lineTo(x + 8, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

function drawBones(ctx, x, y) {
  ctx.strokeStyle = '#efe6d0';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 3);
  ctx.lineTo(x + 8, y + 3);
  ctx.moveTo(x - 7, y + 5);
  ctx.lineTo(x + 7, y - 5);
  ctx.stroke();
  ctx.fillStyle = '#efe6d0';
  ctx.beginPath();
  ctx.arc(x + 12, y - 1, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#3a2e26';
  ctx.beginPath();
  ctx.arc(x + 11, y - 2, 1, 0, Math.PI * 2);
  ctx.arc(x + 14, y - 2, 1, 0, Math.PI * 2);
  ctx.fill();
}

function drawVent(ctx, x, y, time, seed) {
  ctx.fillStyle = '#2a2224';
  ctx.beginPath();
  ctx.ellipse(x, y, 9, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  const glow = 0.5 + Math.sin(time * 4 + seed) * 0.4;
  ctx.fillStyle = `rgba(255,120,40,${glow})`;
  ctx.beginPath();
  ctx.ellipse(x, y, 5, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Puff of smoke that rises and fades on a loop.
  const phase = (time * 0.5 + seed) % 1;
  ctx.fillStyle = `rgba(120,110,110,${(1 - phase) * 0.5})`;
  ctx.beginPath();
  ctx.arc(x + Math.sin(phase * 6) * 3, y - 4 - phase * 22, 3 + phase * 5, 0, Math.PI * 2);
  ctx.fill();
}

// --- Build spots and towers -------------------------------------------------

function drawBuildSpots(ctx, game, ui, time) {
  const { theme } = game.level;
  for (let i = 0; i < game.level.buildSpots.length; i++) {
    if (game.towers[i]) continue;
    const spot = game.level.buildSpots[i];
    const selected = i === ui.selectedSpot;
    const pulse = selected ? 2 + Math.sin(time * 5) * 1.5 : 0;

    ctx.fillStyle = 'rgba(20,40,15,0.18)';
    ctx.beginPath();
    ctx.ellipse(spot.x, spot.y + 3, 15, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = selected ? '#ece0b4' : theme.stone;
    ctx.strokeStyle = theme.stoneDark;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(spot.x, spot.y, 13 + pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(60,50,40,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath(); // "+" hint
    ctx.moveTo(spot.x - 5, spot.y);
    ctx.lineTo(spot.x + 5, spot.y);
    ctx.moveTo(spot.x, spot.y - 5);
    ctx.lineTo(spot.x, spot.y + 5);
    ctx.stroke();
  }
}

function drawTowers(ctx, game, ui, time) {
  for (let i = 0; i < game.towers.length; i++) {
    const tower = game.towers[i];
    if (!tower) continue;
    const spot = game.level.buildSpots[i];
    const type = game.towerTypes[tower.typeId];
    const stats = game.towerStats(tower);
    if (i === ui.selectedSpot) drawRange(ctx, spot, stats.range);

    drawPlatform(ctx, spot, tower.level);
    const age = tower.age ?? 1;
    const pop = age < 0.45 ? 1 + 0.35 * Math.sin((age / 0.45) * Math.PI) * (1 - age / 0.45) : 1;
    ctx.save();
    ctx.translate(spot.x, spot.y + 2);
    ctx.scale(pop, pop);
    ctx.translate(-spot.x, -(spot.y + 2));
    const justFired = stats.fireInterval ? tower.cooldown > stats.fireInterval - 0.12 : !!tower.beamTargetId;
    if (tower.typeId === 'archer') drawArcherTower(ctx, spot, time, justFired, tower.level);
    else if (tower.typeId === 'mage') drawMageTower(ctx, spot, time, justFired, tower.level);
    else if (tower.typeId === 'cannon') drawCannonTower(ctx, spot, tower.angle ?? 0, tower.cooldown / stats.fireInterval, tower.level);
    else if (tower.typeId === 'frost') drawFrostTower(ctx, spot, time, justFired, tower.level);
    else if (tower.typeId === 'tesla') drawTeslaTower(ctx, spot, time, justFired, tower.level);
    else if (tower.typeId === 'flame') drawFlameTower(ctx, spot, time, tower.angle ?? 0, justFired, tower.level);
    else if (tower.typeId === 'laser') drawLaserTower(ctx, spot, time, tower.angle ?? 0, tower.beamTargetId ? game.beamMultiplier(tower) : 0, tower.level);
    ctx.restore();

    // Level pips.
    ctx.fillStyle = '#ffd700';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 1;
    for (let p = 0; p <= tower.level; p++) {
      ctx.beginPath();
      ctx.arc(spot.x - tower.level * 4 + p * 8, spot.y + 15, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }
}

function drawPlatform(ctx, spot, level) {
  const r = 16 + level * 1.5;
  ctx.fillStyle = 'rgba(20,40,15,0.2)';
  ctx.beginPath();
  ctx.ellipse(spot.x, spot.y + 6, r + 2, 7.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#878e95';
  ctx.strokeStyle = '#60666c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(spot.x, spot.y + 2, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(96,102,108,0.6)'; // paver joints
  ctx.lineWidth = 1;
  for (let a = 0; a < 6; a++) {
    const angle = (a / 6) * Math.PI * 2 + 0.3;
    ctx.beginPath();
    ctx.moveTo(spot.x + Math.cos(angle) * 9, spot.y + 2 + Math.sin(angle) * 9);
    ctx.lineTo(spot.x + Math.cos(angle) * (r - 1), spot.y + 2 + Math.sin(angle) * (r - 1));
    ctx.stroke();
  }
  ctx.fillStyle = '#a4abb2';
  ctx.beginPath();
  ctx.arc(spot.x, spot.y + 1, 9, 0, Math.PI * 2);
  ctx.fill();
}

function drawArcherTower(ctx, spot, time, justFired, level) {
  const x = spot.x;
  const y = spot.y - level * 3; // taller with each tier
  const roofColor = ['#b5443c', '#3f6fb5', '#b58a2a'][level];
  if (level >= 2) {
    // Stone lower storey on the top tier.
    ctx.fillStyle = '#9aa1a8';
    ctx.strokeStyle = '#6b7178';
    ctx.lineWidth = 1.5;
    ctx.fillRect(x - 10, spot.y - 8, 20, 12);
    ctx.strokeRect(x - 10, spot.y - 8, 20, 12);
    ctx.fillStyle = '#5b4632';
    ctx.fillRect(x - 2.5, spot.y - 4, 5, 8);
  }
  // Stilt legs.
  ctx.strokeStyle = '#5f4a26';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x - 8, y + 3);
  ctx.lineTo(x - 6, y - 10);
  ctx.moveTo(x + 8, y + 3);
  ctx.lineTo(x + 6, y - 10);
  ctx.moveTo(x - 7, y - 3);
  ctx.lineTo(x + 7, y - 3); // crossbeam
  ctx.stroke();
  // Platform with planks.
  ctx.fillStyle = '#8d6e3a';
  ctx.strokeStyle = '#5f4a26';
  ctx.lineWidth = 1.5;
  const pw = 22 + level * 3;
  ctx.fillRect(x - pw / 2, y - 14, pw, 5);
  ctx.strokeRect(x - pw / 2, y - 14, pw, 5);
  // Railing posts.
  ctx.beginPath();
  for (let px = -pw / 2 + 1; px <= pw / 2; px += 5) {
    ctx.moveTo(x + px, y - 14);
    ctx.lineTo(x + px, y - 19);
  }
  ctx.moveTo(x - pw / 2 + 1, y - 18);
  ctx.lineTo(x + pw / 2 - 1, y - 18);
  ctx.stroke();
  // Archers: one per tier.
  for (let a = 0; a <= level; a++) {
    const ax = x + (a - level / 2) * 7;
    ctx.fillStyle = '#4a3a22';
    ctx.beginPath();
    ctx.arc(ax - 1, y - 21, 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(ax - 3, y - 19, 4.5, 5);
    ctx.strokeStyle = justFired ? '#f5e6c4' : '#d9c9a3';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ax + 4, y - 19, 4.5, -Math.PI / 2.4, Math.PI / 2.4);
    ctx.stroke();
  }
  // Roof on corner posts.
  ctx.strokeStyle = '#5f4a26';
  ctx.beginPath();
  ctx.moveTo(x - pw / 2 + 2, y - 19);
  ctx.lineTo(x - pw / 2 + 2, y - 26);
  ctx.moveTo(x + pw / 2 - 2, y - 19);
  ctx.lineTo(x + pw / 2 - 2, y - 26);
  ctx.stroke();
  ctx.fillStyle = roofColor;
  ctx.beginPath();
  ctx.moveTo(x - pw / 2 - 2, y - 25);
  ctx.lineTo(x, y - 36 - level * 2);
  ctx.lineTo(x + pw / 2 + 2, y - 25);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 28);
  ctx.lineTo(x + 9, y - 28);
  ctx.moveTo(x - 5, y - 32);
  ctx.lineTo(x + 5, y - 32);
  ctx.stroke();
  // Pennant.
  const top = y - 36 - level * 2;
  ctx.strokeStyle = '#5f4a26';
  ctx.beginPath();
  ctx.moveTo(x, top);
  ctx.lineTo(x, top - 7);
  ctx.stroke();
  ctx.fillStyle = ['#e8b73a', '#e8b73a', '#ffffff'][level];
  ctx.beginPath();
  ctx.moveTo(x, top - 7);
  ctx.lineTo(x + 8 + Math.sin(time * 4) * 1.5, top - 4.5);
  ctx.lineTo(x, top - 2);
  ctx.closePath();
  ctx.fill();
}

function drawMageTower(ctx, spot, time, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 18 + level * 5;
  // Stone body with brick courses.
  ctx.fillStyle = ['#8d93b8', '#7f86b8', '#6f78b8'][level];
  ctx.strokeStyle = '#5c6186';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 9 - level, y + 4);
  ctx.lineTo(x - 7, y - h);
  ctx.lineTo(x + 7, y - h);
  ctx.lineTo(x + 9 + level, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = 'rgba(92,97,134,0.7)';
  ctx.lineWidth = 1;
  for (let c = -4; c > -h + 4; c -= 7) {
    ctx.beginPath();
    ctx.moveTo(x - 8, y + c);
    ctx.lineTo(x + 8, y + c);
    ctx.stroke();
  }
  // Arched window with inner glow.
  ctx.fillStyle = justFired ? '#cdbfff' : '#2b2650';
  ctx.beginPath();
  ctx.arc(x, y - 9, 2.6, Math.PI, 0);
  ctx.fillRect(x - 2.6, y - 9, 5.2, 4);
  ctx.fill();
  if (level >= 1) {
    ctx.beginPath();
    ctx.arc(x, y - 20, 2.2, Math.PI, 0);
    ctx.fillRect(x - 2.2, y - 20, 4.4, 3.5);
    ctx.fill();
  }
  // Conical roof.
  ctx.fillStyle = '#5a4fcf';
  ctx.beginPath();
  ctx.moveTo(x - 10 - level, y - h + 1);
  ctx.lineTo(x, y - h - 12 - level * 2);
  ctx.lineTo(x + 10 + level, y - h + 1);
  ctx.closePath();
  ctx.fill();
  if (level >= 2) {
    // Crystal spikes ringing the roof on the top tier.
    ctx.fillStyle = '#c9bfff';
    ctx.strokeStyle = '#8f7bff';
    ctx.lineWidth = 1;
    for (const sx of [-12, -6, 6, 12]) {
      ctx.beginPath();
      ctx.moveTo(x + sx - 2, y - h + 3);
      ctx.lineTo(x + sx, y - h - 6);
      ctx.lineTo(x + sx + 2, y - h + 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }
  // Floating orb: pulsing glow plus orbiting sparks.
  const bob = Math.sin(time * 3) * 2;
  const oy = y - h - 18 - level * 2 + bob;
  const size = 1 + level * 0.25;
  const pulse = (1 + Math.sin(time * 6) * 0.25 + (justFired ? 0.6 : 0)) * size;
  if (level >= 2) {
    ctx.fillStyle = 'rgba(143,123,255,0.15)';
    ctx.beginPath();
    ctx.arc(x, oy, 16 * pulse, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(143,123,255,0.3)';
  ctx.beginPath();
  ctx.arc(x, oy, 8 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(185,167,255,0.5)';
  ctx.beginPath();
  ctx.arc(x, oy, 5.5 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e6dcff';
  ctx.beginPath();
  ctx.arc(x, oy, 3.5 * size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c9bfff';
  const sparks = 2 + level;
  for (let s = 0; s < sparks; s++) {
    const a = time * 2.4 + (s / sparks) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * (9 + level * 2), oy + Math.sin(a) * 3.5, 1.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCannonTower(ctx, spot, angle, cooldownFrac, level) {
  const x = spot.x;
  const cy = spot.y - 10 - level;
  const recoil = Math.max(0, (cooldownFrac - 0.75) / 0.25) * 4;
  const bx = x - Math.cos(angle) * recoil;
  const by = cy - Math.sin(angle) * recoil;
  const len = 16 + level * 3;
  const width = 7 + level;
  // Barrels: one, or twin barrels on the top tier.
  const offsets = level >= 2 ? [-3.5, 3.5] : [0];
  for (const off of offsets) {
    const ox = -Math.sin(angle) * off;
    const oy = Math.cos(angle) * off;
    ctx.strokeStyle = '#2f3338';
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + ox, by + oy);
    ctx.lineTo(bx + ox + Math.cos(angle) * len, by + oy + Math.sin(angle) * len);
    ctx.stroke();
    ctx.strokeStyle = '#1f2327';
    ctx.lineWidth = width + 2;
    ctx.beginPath();
    const mx = bx + ox + Math.cos(angle) * (len - 2);
    const my = by + oy + Math.sin(angle) * (len - 2);
    ctx.moveTo(mx, my);
    ctx.lineTo(mx + Math.cos(angle) * 2, my + Math.sin(angle) * 2);
    ctx.stroke();
  }
  // Turret dome with rivets and hatch.
  const r = 11 + level * 1.5;
  ctx.fillStyle = ['#555b61', '#4f5a66', '#5a4f4a'][level];
  ctx.strokeStyle = '#33373c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#3b4046';
  const rivets = 6 + level * 2;
  for (let i = 0; i < rivets; i++) {
    const a = (i / rivets) * Math.PI * 2 + 0.5;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * (r - 3), cy + Math.sin(a) * (r - 3), 1.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#6d747b'; // highlight
  ctx.beginPath();
  ctx.arc(x - 3.5, cy - 3.5, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#33373c'; // hatch seam
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x, cy, 5.5, -0.6, 1.8);
  ctx.stroke();
  if (level >= 1) {
    // Stacked cannonballs beside the turret.
    ctx.fillStyle = '#2f3338';
    for (const [dx, dy] of [[-14, 6], [-10, 6], [-12, 2]]) {
      ctx.beginPath();
      ctx.arc(x + dx, spot.y + dy - 4, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawFrostTower(ctx, spot, time, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 30 + level * 5;
  // Icy base ring.
  ctx.fillStyle = 'rgba(191,233,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, 13 + level, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Crystal obelisk with inner glow.
  const glow = 0.55 + Math.sin(time * 3) * 0.15 + (justFired ? 0.3 : 0);
  ctx.fillStyle = `rgba(143,211,255,${glow})`;
  ctx.strokeStyle = '#5fa8d8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x, y - h);
  ctx.lineTo(x + 8 + level, y - 10);
  ctx.lineTo(x + 4, y + 3);
  ctx.lineTo(x - 4, y + 3);
  ctx.lineTo(x - 8 - level, y - 10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; // facet highlight
  ctx.beginPath();
  ctx.moveTo(x - 1, y - h + 4);
  ctx.lineTo(x - 5 - level * 0.5, y - 10);
  ctx.lineTo(x - 2, y - 2);
  ctx.closePath();
  ctx.fill();
  // Smaller side crystals on higher tiers.
  for (let c = 0; c < level; c++) {
    const side = c === 0 ? -1 : 1;
    ctx.fillStyle = `rgba(191,233,255,${glow})`;
    ctx.beginPath();
    ctx.moveTo(x + side * 11, y - 16 - c * 2);
    ctx.lineTo(x + side * 15, y - 2);
    ctx.lineTo(x + side * 7, y - 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  // Drifting ice motes.
  ctx.fillStyle = '#ffffff';
  for (let m = 0; m < 2 + level; m++) {
    const a = time * 1.6 + (m / (2 + level)) * Math.PI * 2;
    ctx.globalAlpha = 0.6 + Math.sin(time * 4 + m) * 0.3;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * (12 + level * 2), y - 14 + Math.sin(a) * 6, 1.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawTeslaTower(ctx, spot, time, justFired, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 28 + level * 5;
  // Dark iron base block.
  ctx.fillStyle = '#3b4046';
  ctx.strokeStyle = '#1f2327';
  ctx.lineWidth = 1.5;
  ctx.fillRect(x - 9, y - 8, 18, 12);
  ctx.strokeRect(x - 9, y - 8, 18, 12);
  // Central rod with copper rings.
  ctx.strokeStyle = '#6d747b';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, y - 8);
  ctx.lineTo(x, y - h);
  ctx.stroke();
  ctx.strokeStyle = '#c47a3a';
  ctx.lineWidth = 3;
  for (let r = 0; r < 2 + level; r++) {
    const ry = y - 12 - r * ((h - 14) / (2 + level));
    ctx.beginPath();
    ctx.ellipse(x, ry, 7 + (level - r) * 0.5, 2.5, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Charged sphere with flickering arcs.
  const charge = 0.5 + Math.sin(time * 9) * 0.2 + (justFired ? 0.4 : 0);
  ctx.fillStyle = `rgba(126,200,255,${charge * 0.4})`;
  ctx.beginPath();
  ctx.arc(x, y - h - 4, 11 + level, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#9aa1a8';
  ctx.strokeStyle = '#5c6186';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y - h - 4, 6 + level * 0.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = `rgba(223,243,255,${charge})`;
  ctx.lineWidth = 1.2;
  for (let a = 0; a < 2 + level; a++) {
    const ang = time * 7 + a * 2.1;
    const len = 8 + Math.sin(time * 23 + a) * 3;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(ang) * 5, y - h - 4 + Math.sin(ang) * 5);
    ctx.lineTo(x + Math.cos(ang + 0.4) * (5 + len * 0.5), y - h - 4 + Math.sin(ang + 0.4) * (5 + len * 0.5));
    ctx.lineTo(x + Math.cos(ang) * (5 + len), y - h - 4 + Math.sin(ang) * (5 + len));
    ctx.stroke();
  }
}

function drawFlameTower(ctx, spot, time, angle, justFired, level) {
  const x = spot.x;
  const y = spot.y - 8;
  // Brass fuel tank.
  ctx.fillStyle = ['#b8863a', '#c4903a', '#d09a3a'][level];
  ctx.strokeStyle = '#6e4e1e';
  ctx.lineWidth = 1.5;
  roundRect(ctx, x - 11 - level, y - 12 - level, 22 + level * 2, 18 + level, 6);
  ctx.strokeStyle = 'rgba(110,78,30,0.6)'; // tank bands
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 5);
  ctx.lineTo(x + 10, y - 5);
  ctx.moveTo(x - 10, y + 1);
  ctx.lineTo(x + 10, y + 1);
  ctx.stroke();
  // Pressure gauge.
  ctx.fillStyle = '#eee6c8';
  ctx.beginPath();
  ctx.arc(x - 5, y - 6, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b8403a';
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 6);
  ctx.lineTo(x - 5 + Math.cos(time * 2) * 2, y - 6 + Math.sin(time * 2) * 2);
  ctx.stroke();
  // Nozzle aimed at the target.
  const nx = x + Math.cos(angle) * 14;
  const ny = y - 2 + Math.sin(angle) * 14;
  ctx.strokeStyle = '#3b4046';
  ctx.lineWidth = 5 + level;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y - 2);
  ctx.lineTo(nx, ny);
  ctx.stroke();
  // Pilot flame at the nozzle, bigger while firing.
  const f = (justFired ? 7 : 3) + Math.sin(time * 25) * 1.2;
  ctx.fillStyle = '#ff9f45';
  ctx.beginPath();
  ctx.arc(nx + Math.cos(angle) * 3, ny + Math.sin(angle) * 3, f, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffe08a';
  ctx.beginPath();
  ctx.arc(nx + Math.cos(angle) * 3, ny + Math.sin(angle) * 3, f * 0.5, 0, Math.PI * 2);
  ctx.fill();
  if (level >= 2) {
    // Twin side tanks on the top tier.
    ctx.fillStyle = '#9b7030';
    ctx.strokeStyle = '#6e4e1e';
    ctx.lineWidth = 1;
    roundRect(ctx, x - 17, y - 8, 5, 12, 2.5);
    roundRect(ctx, x + 12, y - 8, 5, 12, 2.5);
  }
}

function drawLaserTower(ctx, spot, time, angle, multiplier, level) {
  const x = spot.x;
  const y = spot.y;
  const h = 26 + level * 5;
  // Sleek dark pillar with a pink seam.
  ctx.fillStyle = '#2b2634';
  ctx.strokeStyle = '#15121b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 8 - level, y + 4);
  ctx.lineTo(x - 5, y - h);
  ctx.lineTo(x + 5, y - h);
  ctx.lineTo(x + 8 + level, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  const hot = multiplier > 0 ? 0.5 + (multiplier - 1) / 4 : 0.25 + Math.sin(time * 2) * 0.1;
  ctx.strokeStyle = `rgba(255,79,216,${hot})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x, y + 2);
  ctx.lineTo(x, y - h + 4);
  ctx.stroke();
  // Emitter head swivels toward the target.
  const hy = y - h - 4;
  ctx.fillStyle = '#4a4458';
  ctx.strokeStyle = '#15121b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, hy, 7 + level, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.strokeStyle = '#8a7fa0';
  ctx.lineWidth = 4 + level;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, hy);
  ctx.lineTo(x + Math.cos(angle) * (10 + level), hy + Math.sin(angle) * (10 + level));
  ctx.stroke();
  // Lens glow scales with how hot the beam is running.
  ctx.fillStyle = `rgba(255,79,216,${Math.min(1, hot + 0.2)})`;
  ctx.beginPath();
  ctx.arc(x + Math.cos(angle) * (11 + level), hy + Math.sin(angle) * (11 + level), 2.5 + hot * 2, 0, Math.PI * 2);
  ctx.fill();
  if (level >= 1) {
    // Cooling fins.
    ctx.strokeStyle = '#5c5570';
    ctx.lineWidth = 1.5;
