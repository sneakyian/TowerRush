  ctx.fillRect(x - 1, y - r * 0.5, 2, r * 0.35);
}

function drawHorns(ctx, x, y, r) {
  ctx.fillStyle = '#e8e2d4';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * r * 0.6, y - r * 0.75);
    ctx.lineTo(x + side * r * 1.1, y - r * 1.3);
    ctx.lineTo(x + side * r * 0.35, y - r * 0.95);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

function drawPads(ctx, x, y, r) {
  ctx.fillStyle = '#6b7178';
  ctx.strokeStyle = '#4a4f55';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(x + side * r * 0.85, y + r * 0.05, r * 0.42, r * 0.3, side * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
  ctx.strokeStyle = '#4a3a22'; // chest strap
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7, y - r * 0.15);
  ctx.lineTo(x + r * 0.7, y + r * 0.45);
  ctx.stroke();
}

function drawTusks(ctx, x, y, r) {
  ctx.fillStyle = '#e8e2d4';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + side * r * 0.45, y + r * 0.5);
    ctx.lineTo(x + side * r * 0.6, y - r * 0.05);
    ctx.lineTo(x + side * r * 0.2, y + r * 0.3);
    ctx.closePath();
    ctx.fill();
  }
}

function drawShell(ctx, x, y, r) {
  // Segmented carapace plates across the back.
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1.5;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(x, y + i * r * 0.35, r * 0.95, Math.PI + 0.4, Math.PI * 2 - 0.4);
    ctx.stroke();
  }
}

function drawSpikes(ctx, x, y, r) {
  ctx.fillStyle = '#d8d2c4';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const a = Math.PI + (i / 4) * Math.PI;
    const bx = x + Math.cos(a) * r * 0.85;
    const by = y + Math.sin(a) * r * 0.85;
    ctx.beginPath();
    ctx.moveTo(bx + Math.sin(a) * 2.5, by - Math.cos(a) * 2.5);
    ctx.lineTo(x + Math.cos(a) * r * 1.4, y + Math.sin(a) * r * 1.4);
    ctx.lineTo(bx - Math.sin(a) * 2.5, by + Math.cos(a) * 2.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
}

function drawCrown(ctx, x, y, r) {
  const top = y - r * 1.05;
  ctx.fillStyle = '#ffd700';
  ctx.strokeStyle = '#a3780a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.5, top);
  ctx.lineTo(x - r * 0.5, top - r * 0.4);
  ctx.lineTo(x - r * 0.25, top - r * 0.15);
  ctx.lineTo(x, top - r * 0.5);
  ctx.lineTo(x + r * 0.25, top - r * 0.15);
  ctx.lineTo(x + r * 0.5, top - r * 0.4);
  ctx.lineTo(x + r * 0.5, top);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#e03a3a';
  ctx.beginPath();
  ctx.arc(x, top - r * 0.12, r * 0.1, 0, Math.PI * 2);
  ctx.fill();
}

function drawHat(ctx, x, y, r, facing) {
  ctx.fillStyle = '#2b2234';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath(); // brim
  ctx.ellipse(x, y - r * 0.6, r * 1.1, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath(); // crooked cone
  ctx.moveTo(x - r * 0.6, y - r * 0.65);
  ctx.lineTo(x + r * 0.3 * facing, y - r * 1.7);
  ctx.lineTo(x + r * 0.6, y - r * 0.65);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#c9a53a'; // buckle band
  ctx.fillRect(x - r * 0.45, y - r * 0.85, r * 0.9, r * 0.14);
}

function drawScarf(ctx, x, y, r, facing, time) {
  ctx.strokeStyle = '#b8403a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(x, y + r * 0.15, r * 0.75, 0.2, Math.PI - 0.2);
  ctx.stroke();
  const flap = Math.sin(time * 6) * 2;
  ctx.beginPath();
  ctx.moveTo(x - r * 0.7 * facing, y + r * 0.3);
  ctx.lineTo(x - r * 1.4 * facing, y + r * 0.1 + flap);
  ctx.stroke();
}

function drawWings(ctx, x, y, r, time, id, color) {
  const flap = Math.sin(time * 18 + id) * 0.5;
  ctx.fillStyle = hexToRgba(color, 0.45);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 1;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(x + side * r * 1.1, y - r * 0.3 - flap * r, r * 0.9, r * 0.4 + flap * r * 0.3, side * (0.5 + flap), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }
}

function drawFlame(ctx, x, y, r, time, id) {
  // Three tongues of different heights, additive, with a soft glow beneath.
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y - r * 0.6, 0, x, y - r * 0.6, r * 1.6);
  g.addColorStop(0, 'rgba(255,150,60,0.35)');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y - r * 0.6, r * 1.6, 0, Math.PI * 2);
  ctx.fill();
  for (let k = -1; k <= 1; k++) {
    const h = r * (k === 0 ? 1.3 : 0.8) * (0.9 + Math.sin(time * 12 + id + k * 2) * 0.25);
    const lean = Math.sin(time * 7 + id + k) * r * 0.25;
    drawFlameTongue(ctx, x + k * r * 0.45, y - r * 0.7, -Math.PI / 2 + lean / r * 0.6, h, r * 0.32, time, id + k);
  }
  ctx.restore();
}

function drawStinger(ctx, x, y, r, facing, time) {
  const curl = Math.sin(time * 4) * 0.15;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - r * 1.0 * facing, y);
  ctx.quadraticCurveTo(x - r * 1.9 * facing, y - r * (0.3 + curl), x - r * 1.5 * facing, y - r * 1.2);
  ctx.stroke();
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath();
  ctx.moveTo(x - r * 1.5 * facing, y - r * 1.2);
  ctx.lineTo(x - r * 1.2 * facing, y - r * 1.55);
  ctx.lineTo(x - r * 1.7 * facing, y - r * 1.45);
  ctx.closePath();
  ctx.fill();
}

// --- Projectiles, particles, HUD overlays -----------------------------------

function drawProjectiles(ctx, game) {
  for (const proj of game.projectiles) {
    const scale = 1 + (proj.towerLevel || 0) * 0.25;
    if (proj.towerType === 'archer') {
      const len = 10 * scale;
      ctx.strokeStyle = '#4a3a22';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * len, proj.y - proj.dirY * len);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      ctx.strokeStyle = '#d9c9a3'; // fletching
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * len - proj.dirY * 2.5, proj.y - proj.dirY * len + proj.dirX * 2.5);
      ctx.lineTo(proj.x - proj.dirX * (len - 3), proj.y - proj.dirY * (len - 3));
      ctx.lineTo(proj.x - proj.dirX * len + proj.dirY * 2.5, proj.y - proj.dirY * len - proj.dirX * 2.5);
      ctx.stroke();
      ctx.fillStyle = '#e8e2d4'; // arrowhead
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 1.8, 0, Math.PI * 2);
      ctx.fill();
    } else if (proj.towerType === 'frost') {
      // A spinning ice shard: diamond along the flight direction.
      const l = 7 * scale;
      const w = 3 * scale;
      ctx.fillStyle = 'rgba(191,233,255,0.9)';
      ctx.strokeStyle = '#5fa8d8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(proj.x + proj.dirX * l, proj.y + proj.dirY * l);
      ctx.lineTo(proj.x - proj.dirY * w, proj.y + proj.dirX * w);
      ctx.lineTo(proj.x - proj.dirX * l, proj.y - proj.dirY * l);
      ctx.lineTo(proj.x + proj.dirY * w, proj.y - proj.dirX * w);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (proj.towerType === 'sniper') {
      // A bright tiny round with a short streak; the tracer effect does the rest.
      ctx.strokeStyle = 'rgba(242,255,208,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(proj.x - proj.dirX * 14, proj.y - proj.dirY * 14);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
    } else if (proj.towerType === 'venom') {
      ctx.fillStyle = '#6fae3a';
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y, 5 * scale, 3.6 * scale, Math.atan2(proj.dirY, proj.dirX), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(198,255,107,0.9)';
      ctx.beginPath();
      ctx.arc(proj.x - 1.2, proj.y - 1.2, 1.6 * scale, 0, Math.PI * 2);
      ctx.fill();
    } else if (proj.towerType === 'mage') {
      ctx.strokeStyle = 'rgba(143,123,255,0.5)'; // trail
      ctx.lineWidth = 4 * scale;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(proj.prevX, proj.prevY);
      ctx.lineTo(proj.x, proj.y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(143,123,255,0.35)';
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 7 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e6dcff';
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 3.5 * scale, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Lob: lift the ball along a sine arc between launch and target,
      // keeping a shadow on the ground beneath it. Mortar shells fly higher.
      const mortar = proj.towerType === 'mortar';
      const traveled = Math.hypot(proj.x - (proj.startX ?? proj.x), proj.y - (proj.startY ?? proj.y));
      const remaining = Math.hypot(proj.lastTarget.x - proj.x, proj.lastTarget.y - proj.y);
      const total = traveled + remaining || 1;
      const lift = Math.sin((traveled / total) * Math.PI) * Math.min(mortar ? 110 : 42, total * (mortar ? 0.55 : 0.3));
      if (mortar) {
        ctx.fillStyle = 'rgba(255,140,51,0.35)';
        ctx.beginPath();
        ctx.arc(proj.x, proj.y - lift, 8 * scale, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(proj.x, proj.y + 3, 4 * scale, 2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2f3338';
      ctx.beginPath();
      ctx.arc(proj.x, proj.y - lift, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#596067';
      ctx.beginPath();
      ctx.arc(proj.x - 1.3, proj.y - lift - 1.3, 1.6 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawParticleList(ctx, particles, glow = false) {
  const opaque = new Set(['smoke', 'scorch', 'crater', 'frostpatch', 'puddle', 'leaf', 'snow', 'ash', 'shard', 'drop']);
  for (const p of particles) {
    const frac = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = frac;
    ctx.globalCompositeOperation = glow && !opaque.has(p.shape) ? 'lighter' : 'source-over';
    switch (p.shape) {
      case 'ring':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3 * frac;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 - frac) + 6, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case 'flash': {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * (1.4 - frac * 0.4));
        g.addColorStop(0, p.color);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1.4 - frac * 0.4), 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'fire': {
        const r = p.size * (0.7 + (1 - frac) * (p.grow || 1) * 0.6);
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
        g.addColorStop(0, frac > 0.75 ? '#fff0c8' : p.color);
        g.addColorStop(0.4, p.color);
        g.addColorStop(1, 'rgba(255,60,10,0)');
        ctx.globalAlpha = Math.min(0.85, frac * 1.1);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'smoke':
        ctx.globalAlpha = frac * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (1 + (1 - frac) * (p.grow || 1) * 0.8), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'spark': {
        const speed = Math.hypot(p.vx, p.vy) || 1;
        const len = Math.min(16, 3 + speed * 0.05);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = Math.max(0.6, p.size * frac);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - (p.vx / speed) * len, p.y - (p.vy / speed) * len);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        break;
      }
      case 'ember':
        ctx.fillStyle = p.color;
        ctx.globalAlpha = frac * 0.35;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = frac;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + frac * 0.5), 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'shard': {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sz = p.size * (0.6 + frac * 0.4);
        ctx.beginPath();
        ctx.moveTo(0, -sz);
        ctx.lineTo(sz * 0.9, sz * 0.7);
        ctx.lineTo(-sz * 0.9, sz * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'star': {
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        const sz = p.size * (0.5 + frac * 0.5) * 1.6;
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
          const rad = k % 2 ? sz * 0.4 : sz;
          const a = (k / 8) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'drop':
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 1.3, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'tracer':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size * frac * 1.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        break;
      case 'scorch':
      case 'crater':
        ctx.globalAlpha = Math.min(0.8, frac * 1.5);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        if (p.shape === 'crater') {
          ctx.strokeStyle = 'rgba(0,0,0,0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 0.38, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        break;
      case 'frostpatch':
      case 'puddle':
        ctx.globalAlpha = Math.min(0.9, frac * 1.3);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'leaf':
        ctx.fillStyle = p.color;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 1.6, p.size * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        break;
      case 'snow':
      case 'ash':
      case 'pollen':
        ctx.globalAlpha = Math.min(1, frac * 3) * 0.9;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'sand':
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x - 14, p.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        break;
      case 'firefly': {
        const blink = 0.3 + Math.max(0, Math.sin(p.rot * 0.5 + p.x * 0.05 + p.life * 6)) * 0.7;
        ctx.globalAlpha = Math.min(1, frac * 3) * blink;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = Math.min(1, frac * 3);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      default:
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * frac, 0, Math.PI * 2);
        ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawTexts(ctx, effects) {
  ctx.textAlign = 'center';
  for (const t of effects.texts) {
    ctx.font = `bold ${Math.round(13 * (t.scale || 1))}px sans-serif`;
    ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawBossBar(ctx, game) {
  const boss = game.boss;
  if (!boss) return;
  const type = game.enemyTypes[boss.typeId];
  const w = 320;
  const x = (game.level.width - w) / 2;
  const y = 14;
  const frac = Math.max(0, boss.hp / boss.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x - 2, y - 2, w + 4, 16);
  ctx.fillStyle = '#4a1010';
  ctx.fillRect(x, y, w, 12);
  ctx.fillStyle = frac > 0.5 ? '#d64545' : '#ff7a45';
  ctx.fillRect(x, y, w * frac, 12);
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  ctx.strokeText(type.name, game.level.width / 2, y + 10);
  ctx.fillText(type.name, game.level.width / 2, y + 10);
}

function drawBanner(ctx, effects, level) {
  const banner = effects.banner;
  if (!banner) return;
  const age = banner.maxLife - banner.life;
  const alpha = Math.min(1, age * 4, banner.life * 2);
  const pop = age < 0.3 ? 1.25 - 0.25 * (age / 0.3) : 1; // settles in from slightly large
  const cx = level.width / 2;
  const cy = level.height / 2 - 40;
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(pop, pop);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Georgia, serif';
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = banner.color;
  ctx.globalAlpha = Math.max(0, alpha) * 0.35;
  ctx.fillText(banner.text, 0, 2); // glow pass
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.lineWidth = 7;
  ctx.strokeText(banner.text, 0, 0);
  ctx.fillStyle = banner.color;
  ctx.fillText(banner.text, 0, 0);
  if (banner.sub) {
    ctx.font = 'italic 16px Georgia, serif';
    ctx.lineWidth = 4;
    ctx.strokeText(banner.sub, 0, 24);
    ctx.fillStyle = '#f2e3b3';
    ctx.fillText(banner.sub, 0, 24);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawRange(ctx, spot, range) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
  ctx.beginPath();
  ctx.arc(spot.x, spot.y, range, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 6]);
  ctx.lineDashOffset = -performance.now() / 40;
  ctx.stroke();
  ctx.setLineDash([]);
}

// Browser entry point: wires the Game to the canvas and the HUD, handles
// level selection and saved progress.


const PROGRESS_KEY = 'towerrush-progress';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// The world is 800x480 logical units, but the canvas fills the stage (up to
// 1280 CSS px) and its backing store is sized at display size x device pixel
// ratio. Everything is vector-drawn through one scale transform, so a bigger
// or sharper screen simply gets more resolution.
const MAX_BACKING_WIDTH = 2800; // keeps the backing store sane on huge HiDPI screens
const stageEl = document.getElementById('stage');

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const { width, height } = game.level;
  const cssWidth = Math.max(320, stageEl.clientWidth || width);
  const cssHeight = (cssWidth * height) / width;
  const scale = Math.min((cssWidth / width) * dpr, MAX_BACKING_WIDTH / width);
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  canvas.style.aspectRatio = `${width} / ${height}`;
  canvas.width = Math.round(width * scale);
  canvas.height = Math.round(height * scale);
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  return { cssWidth, cssHeight };
}

let levelIndex = 0;
let game = new Game(LEVELS[0]);
fitCanvas();
window.addEventListener('resize', fitCanvas);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => fitCanvas()).observe(stageEl);
const effects = new Effects();
const ui = { selectedSpot: -1 };

// --- Saved progress (best effort; storage may be unavailable) -----------

function loadUnlocked() {
  try {
    const n = Number(localStorage.getItem(PROGRESS_KEY));
    return Number.isFinite(n) ? Math.min(Math.max(n, 0), LEVELS.length - 1) : 0;
  } catch {
    return 0;
  }
}

function saveUnlocked(n) {
  try {
    localStorage.setItem(PROGRESS_KEY, String(Math.max(n, loadUnlocked())));
  } catch {
    /* storage unavailable: progress just isn't remembered */
  }
}

const goldEl = document.getElementById('gold');
const livesEl = document.getElementById('lives');
const waveEl = document.getElementById('wave');
const statusEl = document.getElementById('status');
const towerInfoEl = document.getElementById('tower-info');
const startWaveBtn = document.getElementById('start-wave');
const nextLevelBtn = document.getElementById('next-level');
const restartBtn = document.getElementById('restart');
const chooseLevelBtn = document.getElementById('choose-level');
const towerMenu = document.getElementById('tower-menu');
const upgradeBtn = document.getElementById('upgrade-tower');
const sellBtn = document.getElementById('sell-tower');

for (const type of Object.values(TOWER_TYPES)) {
  const btn = document.createElement('button');
  btn.dataset.type = type.id;
  btn.innerHTML = `<span class="tower-name">${type.name}</span><span class="tower-cost">${type.levels[0].cost}g</span>`;
  btn.title = type.desc;
  btn.style.setProperty('--tower', type.color);
  // Light tower colors need dark text.
  const n = parseInt(type.color.slice(1), 16);
  const luma = 0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
  btn.style.setProperty('--tower-fg', luma > 150 ? '#1b1f2a' : '#ffffff');
  btn.addEventListener('click', () => {
    if (ui.selectedSpot < 0) return;
    const result = game.buildTower(ui.selectedSpot, type.id);
    if (!result.ok && result.reason === 'not-enough-gold') flashStatus('Not enough gold!');
    updateHud();
  });
  towerMenu.insertBefore(btn, upgradeBtn);
}

upgradeBtn.addEventListener('click', () => {
  if (ui.selectedSpot < 0) return;
  const result = game.upgradeTower(ui.selectedSpot);
  if (!result.ok && result.reason === 'not-enough-gold') flashStatus('Not enough gold!');
  updateHud();
});

sellBtn.addEventListener('click', () => {
  if (ui.selectedSpot >= 0) game.sellTower(ui.selectedSpot);
  ui.selectedSpot = -1;
  updateHud();
});

startWaveBtn.addEventListener('click', () => {
  game.startNextWave();
  updateHud();
});

restartBtn.addEventListener('click', () => loadLevel(levelIndex));
nextLevelBtn.addEventListener('click', () => loadLevel(levelIndex + 1));
chooseLevelBtn.addEventListener('click', () => showLevelSelect());

canvas.addEventListener('click', (event) => {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * (game.level.width / rect.width);
  const y = (event.clientY - rect.top) * (game.level.height / rect.height);

  ui.selectedSpot = -1;
  game.level.buildSpots.forEach((spot, i) => {
    if (Math.hypot(spot.x - x, spot.y - y) <= 22) ui.selectedSpot = i;
  });
  updateHud();
});

// --- Level flow -----------------------------------------------------------

function loadLevel(index) {
  levelIndex = Math.min(Math.max(index, 0), LEVELS.length - 1);
  game = new Game(LEVELS[levelIndex]);
  fitCanvas();
  effects.clear();
  ui.selectedSpot = -1;
  levelSelect.hidden = true;
  updateHud();
}

function showLevelSelect() {
  const unlocked = loadUnlocked();
  levelList.replaceChildren();
  LEVELS.forEach((level, i) => {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    btn.disabled = i > unlocked;
    btn.innerHTML = `<span><strong>${i + 1}. ${level.name}</strong><br><small>${level.subtitle}</small></span><span>${i > unlocked ? '🔒' : `${level.waves.length} waves`}</span>`;
    btn.addEventListener('click', () => loadLevel(i));
    levelList.appendChild(btn);
  });
  levelSelect.hidden = false;
}

// One line of stats for the tower info panel, per attack style.
function describeStats(type, stats) {
  const parts = [];
  if (type.attack === 'aura') {
    parts.push(`towers within ${stats.range} deal ×${stats.boost} damage`);
    return parts.join(' · ');
  }
  if (type.attack === 'beam') {
    parts.push(`${stats.dps} ${type.damageType} dps, up to ×${stats.rampMultiplier} when held`);
  } else {
    parts.push(`${stats.damage} ${type.damageType} dmg`, `${(1 / stats.fireInterval).toFixed(1)}/s`);
  }
  parts.push(stats.minRange ? `${stats.minRange}–${stats.range} range` : `${stats.range} range`);
  if (stats.splashRadius) parts.push(`${stats.splashRadius} splash`);
  if (stats.armorPierce) parts.push(`pierces ${Math.round(stats.armorPierce * 100)}% armor`);
  if (type.targeting === 'toughest') parts.push('targets the toughest');
  if (stats.slow) parts.push(`slows ${Math.round((1 - stats.slow.factor) * 100)}% for ${stats.slow.duration}s`);
  if (stats.burn) parts.push(`burns ${stats.burn.dps}/s for ${stats.burn.duration}s`);
  if (stats.poison) parts.push(`poison ${stats.poison.dpsPerStack}/s per stack, up to ${stats.poison.maxStacks}`);
  if (stats.jumps) parts.push(`arcs to ${stats.jumps} more`);
  return parts.join(' · ');
}

let statusTimer = null;
function flashStatus(text) {
  statusEl.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(updateHud, 1500);
}

function updateHud() {
  levelNameEl.textContent = `${levelIndex + 1}. ${game.level.name}`;
  goldEl.textContent = game.gold;
  livesEl.textContent = game.lives;
  waveEl.textContent = `${Math.max(0, game.waveIndex + 1)} / ${game.waveCount}`;

  const over = game.phase === PHASE.WON || game.phase === PHASE.LOST;
  startWaveBtn.disabled = game.phase !== PHASE.BUILD;
  restartBtn.hidden = !over;
  nextLevelBtn.hidden = !(game.phase === PHASE.WON && levelIndex + 1 < LEVELS.length);

  const spotSelected = ui.selectedSpot >= 0;
  const tower = spotSelected ? game.towers[ui.selectedSpot] : null;
  towerMenu.hidden = !spotSelected || over;
  upgradeBtn.hidden = !tower;
  sellBtn.hidden = !tower;
  for (const btn of towerMenu.querySelectorAll('button[data-type]')) {
    btn.hidden = !!tower;
    btn.disabled = game.gold < TOWER_TYPES[btn.dataset.type].levels[0].cost;
  }

  if (tower) {
    const type = TOWER_TYPES[tower.typeId];
    const stats = game.towerStats(tower);
    const upgradeCost = game.upgradeCost(tower);
    towerInfoEl.textContent = `${type.name} — Level ${tower.level + 1}/${MAX_TOWER_LEVEL} · ${describeStats(type, stats)}`;
    upgradeBtn.textContent = upgradeCost === null ? 'Max level' : `Upgrade (${upgradeCost}g)`;
    upgradeBtn.disabled = upgradeCost === null || game.gold < upgradeCost;
    sellBtn.textContent = `Sell (+${game.sellValue(tower)}g)`;
  } else {
    towerInfoEl.textContent = '';
  }

  if (game.phase === PHASE.WON) {
    saveUnlocked(levelIndex + 1);
    statusEl.textContent = levelIndex + 1 < LEVELS.length ? 'Victory! The next level is unlocked.' : 'Victory! You have beaten every level.';
  } else if (game.phase === PHASE.LOST) {
    statusEl.textContent = 'Defeat! The enemies broke through.';
  } else if (game.phase === PHASE.WAVE) {
    const boss = game.boss;
    statusEl.textContent = boss ? `${game.enemyTypes[boss.typeId].name} approaches!` : `Wave ${game.waveIndex + 1} incoming...`;
  } else if (spotSelected && !tower) {
    statusEl.textContent = 'Choose a tower to build.';
  } else if (tower) {
    statusEl.textContent = 'Upgrade or sell this tower.';
  } else {
    statusEl.textContent = 'Click a spot to build, then start the wave.';
  }
}

// --- Game loop ----------------------------------------------------------

let lastTime = performance.now();
function frame(now) {
  // Clamp dt so a background tab doesn't fast-forward the simulation.
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const phaseBefore = game.phase;
  const goldBefore = game.gold;
  const livesBefore = game.lives;
  game.update(dt);
  if (game.phase !== phaseBefore || game.gold !== goldBefore || game.lives !== livesBefore) {
    updateHud();
  }

  effects.process(game.drainEvents());
  effects.ambient(game, dt);
  effects.update(dt);
  render(ctx, game, effects, ui, now / 1000);
  requestAnimationFrame(frame);
}

updateHud();
showLevelSelect();
requestAnimationFrame(frame);

</script>
</body>
</html>
